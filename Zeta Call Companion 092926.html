": "The failure is real, and it has a happy ending.", "full": "I realized I'd failed him as a manager and as a friend, and that I would fail the school and the kids if I didn't figure it out quickly. So it became priority number one. … And accountability: within a month he was clearly meeting well-established targets. He's co-dean there now, with one of my former students, and he's still one of the best I've seen do this job. I wish I hadn't been so eager to support my initial hypothesis. <span class=\"small\">[bank block 6]</span>"}, {"sid": "(9)", "name": "THE DREAM VERSION (academics)", "proves": "Your other recorded answer to \"you are a systems and culture person.\" Reference, not a script.", "full": "Yeah, I think my career in the last... Five to six years has really leaned into that side of the work. … superintendent role at Brooklyn Lab and so that was overseeing three schools. But that was where I was responsible for the academic results directly through the principals I led all the summer onboarding, all of the learning and development. that at the network level and then of course through the principals. … Most recently at the KIPP Foundation, The... Primary focus for my work has been academic health. And so... You know, we've got so many different schools in so many different places with so many different standards. Our big push was to really make sure that our grades were meaningful, that they were normed, We developed a ton of best practices and guidance and goals around what it takes to have a true, meaningful, powerful both curriculum and set of grading practices and really be attentive to both end of day results, end of IA cycle results, and end of year results because of our goal of obviously having students being ready to be over prepared to succeed in college and beyond. <span class=\"small\">[DREAM screen 081726]</span>"}, {"sid": "(10)", "name": "THE FOUR-DAY COVID PLAYBOOK", "proves": "He runs a crisis as a plan on paper that actually reaches people. Good for launch or ambiguity questions.", "full": "I effectively did a version of My strong start spring readiness planning, I condensed it to about four days. And so it was day one, gather all the information. A lot of this is coming in piecemeal from different sources, but also from the people and really understanding, because so much of this was an emotional issue as much as it was a scientific issue, as much as it was a logistical issue. Day two began the work of Getting as many answers as possible on paper so that on day three I could bring this to the leadership team and say this is our new playbook. We're opening a fully remote school. We're staying open brick and mortar for every student who wants to come in … we effectively spent the entire day with staff on Zoom working to roll out all of these new changes. … drawing on those experiences to run the plays that you know how to run, And recognizing that You both have to have the answer on paper. But having the answer only on paper is next to worthless if it doesn't actually get to the people. And nothing that gets to the people is going to matter if The fundamental premise is this is being done to us or like they don't get it or they haven't heard me or I haven't had a chance to make my voice heard. <span class=\"small\">The passage does not name the school. No student or staff count with it; the one you gave DREAM does not match the Brooklyn Lab file.</span> <span class=\"small\">[DREAM screen 081726]</span>"}];

var Q = [{"id": "aboutyou", "grp": "A", "t1": 1, "tier": "LOCK", "type": "core", "short": "Background walk", "trig": "&ldquo;tell me about yourself&rdquo; &middot; &ldquo;walk me through your background&rdquo;", "core": "Systems in schools, change management, now tech. Turnaround, 100 schools, Collegiate, Brooklyn Lab, KIPP, the tools. The happiest I've been is a place like this.", "why": "Paola and Kruti haven't heard it. Dan got about 6 minutes; the bank version is about 2:35.", "keys": "background about yourself walk me through career history story arc resume", "label": "1 &middot; Walk me through your background.", "hook": "270th to number one / 100 schools, 14 years / Carver → CEO / happiest in a place like this", "tests": "Whether the arc reads as schools, and lands inside three minutes.", "target": "2:35. If short on time, Brooklyn Lab drops to its last sentence.", "land": "He hears a school person, and the last line points at Zeta.", "avoid": "The health reason for leaving Excel. \"Better part of a decade\" (it was 14 years). \"We were able to be successful in that.\"", "answer": "<p>The short version is I've spent my career developing systems in schools, learning change management, and now applying tech.</p><p>I started as a teacher in DC, then went to Excel Academy up in Boston. We were doing a turnaround. I was on the leadership team running culture and operations, and <span class=\"dcue slow\">slow, land the number</span> we took the school from <em>270th in the state to number one</em> and got National Charter School of the Year.</p><p>We got hundreds of visitors a year trying to apply our model. There was a big demand for guidance on how to do it well, and it felt important, so I launched a consulting practice. <span class=\"dcue flat\">plain</span> I had the privilege of walking into over 100 schools over the course of fourteen years, finding and fixing problems, improving systems, and helping each school set priorities and execute them. I met them where they were and took them from chaotic to stable, stable to functional, functional to rigorous. KIPP, Achievement First, Uncommon, most of the Northeast charters.</p><p><span class=\"dcue beat\">beat</span> Then I found a client I was really keen on, Collegiate Academies down in New Orleans. They had an all-means-all ambition, super high expectations and super high support for all students. After initial success at a single site, they couldn't replicate it, and I was brought down to fix that. We did it first as a consultant, then as chief culture officer for five years. We slashed suspensions while greatly increasing teacher retention and student and family satisfaction. <span class=\"dcue power\">add the result</span> <em>The best example is Carver, and the principal I was brought in to assess is now the CEO.</em></p><p><span class=\"dcue stop\">SKIP this paragraph for Zeta (the kids)</span> Then we came back to Brooklyn, because my wife is from New York and the plan was always to raise our two girls here. Or at least that was her plan.</p><p>While I was at Collegiate I kept a small consulting portfolio, and one of those clients became Brooklyn Lab. They tapped me to consult intensively, and it converted again. I was superintendent for just over a year, as a steward. <span class=\"dcue flat\">keep it moving, no weight on the renewal</span> We stabilized the in-person schools, built the remote school through COVID, and took both charters through renewal. Both were reauthorized, and we passed off as planned.</p><p>Then two years at the KIPP Foundation, bringing 28 wonderful but very independent regions into some degree of alignment on a national high school strategy, and handing it back to the regional teams, who run it now.</p><p>And now I'm doing a really cool thing, or at least I think it's very cool. I build custom AI tools for school leaders. They point me at a problem, and I build the thing that saves them the time so they can focus on the real work.</p><p><span class=\"dcue beat\">two-second beat</span> The happiest I've ever been is in a mid-sized, growing charter network with outsized ambition. <span class=\"dcue power\">land this</span> That's what my research says you all are, and this role is a perfect blend of the tools work and that kind of network. So that's what brought me here. <span class=\"dcue stop\">STOP</span></p><p class=\"small\">Your words: THE TWELVE ANSWERS, block 1 (your dictation, revised 092426). The Carver line in gold is from block 4.</p>", "receipts": ["(1) 270TH TO NUMBER ONE", "(4) CARVER", "(5) BROOKLYN LAB"], "stop": "Stop at \"that's what brought me here.\" Then the role question, if they pause."}, {"id": "whyzeta", "grp": "A", "t1": 2, "tier": "LOCK", "type": "core", "short": "Why Zeta, why this side", "trig": "&ldquo;why Zeta&rdquo; &middot; &ldquo;why this role&rdquo; &middot; &ldquo;why schooling, not ops&rdquo;", "core": "Building things other people can run. A midsize network with outsized ambition. Excellence with exploration.", "why": "The ops seat is closed. This has to be a clear yes to the schooling side.", "keys": "why zeta why us why this role why now schooling side ops operations transformation felipe", "label": "2 &middot; Why Zeta? Why this side of the house?", "hook": "building things other people can run / excellence with exploration / best idea wins", "tests": "Whether he wants this seat, or the ops seat he applied for.", "target": "75 seconds", "land": "He wants this work, at this network, now.", "avoid": "Any sign you would rather have the Operations Transformation seat. Title, level or money.", "answer": "<p><span class=\"dcue flat\">plain, easy</span> The idea that the job is focusing on initiatives, the ones that transition from launch into practices that the entire organization uses. And this, I think if there was one thing to sum up what I've been doing my whole career as a, in New York, Network offices at CMOs and as a consultant, it's been this like <span class=\"dcue slow\">slow</span> building things that other people can run.</p><p>I both like doing that work and I also like... Building systems. and structures and practices that people buy into on merit, not out of obligation.</p><p><span class=\"dcue beat\">beat</span> … the happiest I've ever been is in a midsize growing charter network that has wildly outsized ambition and is full of smart, aspirationally aligned folks. And my read is that you all might be that place and that this role just really spoke to me as a perfect blend of what I've done, what I want to do, and where I might want to be.</p><p><span class=\"dcue warm\">warm</span> … excellence with exploration on what that means seems really cool to me. I do have a lot of high school-specific experience in operations, culture, and academics. And so there's something cool about like the high school question. I love being in environments where it's like best idea wins, strong opinions, loosely held. Let's debate the heck out of things. Let's attack people's ideas without attacking people. <span class=\"dcue stop\">STOP</span></p><p class=\"small\">Your words: DREAM screen 081726 (first two paragraphs); Dan Rojas call 092526, lines 54 and 225-227.</p>", "receipts": [], "stop": "If they ask about ops: Felipe thought your strongest fit was the schooling side, and after the Dan call you see the logic."}, {"id": "g2g", "grp": "B", "t1": 3, "tier": "LOCK", "type": "core", "short": "Good principal → great", "trig": "&ldquo;how do you manage principals&rdquo; &middot; &ldquo;good to great&rdquo; &middot; &ldquo;feedback to a principal&rdquo;", "core": "Clothes, not skin. Support hat 99%. My side of the street clean. Shoulder to shoulder. Then Carver.", "why": "Paola manages Zeta's principals. Dan asked this exact question and the answer ended with no proof.", "keys": "principal manage feedback good to great coaching develop protective support evaluation", "label": "3 &middot; The good principal who needs to get to great. What's your common feedback?", "hook": "clothes, not skin / support hat 99% / end on Carver", "tests": "Whether he can manage strong, protective principals without mandating.", "target": "2 minutes", "land": "A named principal and a result: Carver, Louisiana Principal of the Year, now CEO.", "avoid": "Ending on \"completely let go of any hierarchical sense of mandate authority.\" Four principles and no proof (what happened with Dan).", "answer": "<p>I would say that the playbook that I have developed over time by doing it wrong and then eventually doing it better and then doing it well a few times at least is I think the first thing is <span class=\"dcue slow\">slow</span> we have to separate someone's performance from their identity. And I talk about using your identity not as your skin, but your identity as a principal is <em>the clothes that you wear, not the skin that you're in</em>. And helping them separate this idea that there are things that make you who you are that are irreplaceable and that nothing about those should change. There are, however, also ways in which we can build on those strengths. And by aligning on what the key problems or opportunities are, we can focus on improving those without undercutting either who you are, the strengths you bring, or attacking your personal identity. So that's number one. Number two is getting clear on support versus evaluation. <span class=\"dcue power\">land this</span> 99% of the time, I'm wearing my support hat. My success is entirely a function of your success. And so that when it comes time to evaluate, number one, nothing is a surprise. And number two, I've helped you along the way so that your review is wildly positive. The third thing is my side of the street needs to be totally clean above reproach. I need to be clear. I need to follow through. I need to be the model for reliability, for clarity and communication. And number four, doing the work alongside them. I think so often it's easy for folks, especially that have been doing it for a while, to say, \"Even if I respect you, even if I think you're great, you don't really get it, or you don't get it at the level that I'm currently experiencing it.\" And that's true. And I think with most conversations with smart people, acknowledging that their perspective is entirely valid is both necessary and important. Also, there are ways in which you can dive in, do the work alongside them, and really go shoulder to shoulder with them. And I'll close with this. <span class=\"dcue beat\">beat</span> Mandate authority is almost worthless in these settings. I mean, sure, you're the person's boss. Sure, you can say we are or aren't doing certain things, and you need to. However, for the people that we want to keep, like you said, the people who are innovative, who are strong, who bring their whole selves, we need to convince them through the quality of our ideas and our actions and through the data on what directions and changes need to be made. <span class=\"dcue power\">then the proof</span> <em>The best example is Carver, and the principal I was brought in to assess is now the CEO.</em> <span class=\"dcue stop\">STOP</span></p><p class=\"small\">Your words: Dan Rojas call 092526, lines 60-72. The last line is block 4 of your answer bank.</p>", "receipts": ["(4) CARVER"], "stop": "Carver in one line, then stop."}, {"id": "carver", "grp": "B", "t1": 4, "tier": "LOCK", "type": "core", "short": "Carver, the whole story", "trig": "&ldquo;a principal who was struggling&rdquo; &middot; &ldquo;hard feedback&rdquo; &middot; &ldquo;developing a leader&rdquo;", "core": "The problem is not the man. We were managing him against his strengths. Jerel is the CEO.", "why": "Your best proof for a principal-manager seat. With Dan it came out as \"we were able to be successful in that.\"", "keys": "carver struggling principal underwater hard feedback develop leader coach jerel ben marcovitz collegiate", "label": "4 &middot; Tell me about a principal who was struggling. What did you do?", "hook": "brought in to assess / Mom and Dad get right / connect and correct / Jerel is the CEO", "tests": "Whether he can diagnose, tell a hard truth, and grow a leader instead of replacing him.", "target": "90 seconds", "land": "Two hundred students to eight or nine hundred. Jerel is the CEO.", "avoid": "The 75% suspension drop (network-wide, never Carver alone). Naming blame.", "answer": "<p><span class=\"dcue warm\">steady</span> The best example is Carver, and the principal I was brought in to assess is now the CEO.</p><p>Ben Marcovitz brought me to Carver for a two or three day trial, and it was clearly a big question on his mind whether this effort to support Jerel was going to last.</p><p>I presented to the leadership team, and I didn't pull my punches. I named the quiet part, because it was the real problem and it had to get fixed. <span class=\"dcue slow\">slow</span> Jerel is one of the best I have ever seen at working with students, and we just weren't playing to his strengths. And the two of you are in a bad breakup. Nothing works until Mom and Dad get right.</p><p>We were willing to buck the inertia of how we do things, but not in a way that was disruptive to students. It was behind-the-scenes change: the roles, the responsibilities, and the relationship between the two co-leaders.</p><p>We got clear on the problem and the solution. Then we invested in training people and put Jerel on stage, so everyone could see it could work, and we stacked wins. We fixed the smallest action first. I coined a phrase, <span class=\"dcue power\">land this</span> connect and correct. Don't let your first interaction with a human being be a correction.</p><p>We shifted the staff from adversarial to partnership, and part of that was sweating some things a lot less, and the more important things a whole lot more.</p><p><span class=\"dcue slow\">slow</span> Two hundred students when I walked in. Eight or nine hundred now, in a brand-new building. And <em>Jerel is the CEO</em>. <span class=\"dcue stop\">STOP</span></p><p class=\"small\">Your words: THE TWELVE ANSWERS, block 4 (your dictation).</p>", "receipts": ["(4) CARVER"], "stop": "Stop on \"Jerel is the CEO.\""}, {"id": "managed", "grp": "B", "t1": 5, "tier": "LIKELY", "type": "core", "short": "Have you managed principals?", "trig": "&ldquo;have you managed principals&rdquo; &middot; &ldquo;you've never been a principal&rdquo;", "core": "Two seats managing principals, and I held a building myself for six months.", "why": "The seat is likely Principal Manager. Your fact file has a ruling on exactly how to say this.", "keys": "managed principals portfolio principal experience interim never been a principal evaluated", "label": "5 &middot; Have you managed principals? Have you been a principal?", "hook": "Collegiate portfolio / three at Brooklyn Lab / interim, half a year, my call", "tests": "Whether he has done the seat, not just coached near it.", "target": "45 seconds", "land": "Managing principals is the seat itself, twice.", "avoid": "Volunteering that you have not held a standing principal seat. A bare \"principal\" without \"interim.\"", "answer": "<p><span class=\"dcue flat\">plain, no hedge</span> No recorded answer in your words yet. Say these facts your way:</p><p><em>Collegiate:</em> a portfolio of principals as Chief Culture Officer, shared with the CAO. About a hundred site visits a year on structured observation and debrief.</p><p><em>Brooklyn Lab:</em> managed and evaluated three principals and the C-level team as superintendent.</p><p><span class=\"dcue slow\">slow</span> <em>Brooklyn Lab, interim:</em> your words, 083026: \"i was the princpal at bk lab for half a year bc i decided to remove the principal and take it over bc it needed to be done.\" (Say it out loud if it fits; never in writing.)</p><p class=\"small\">Your words: verified-facts rulings L1254, L230, L484 and L1242-1250, via PRINCIPAL MANAGER TRACK 092026.</p>", "receipts": ["(5) BROOKLYN LAB"], "stop": "Stop after the interim line."}, {"id": "hs", "grp": "C", "t1": 6, "tier": "LOCK", "type": "core", "short": "What high school should be", "trig": "&ldquo;the high school&rdquo; &middot; &ldquo;what would you rethink&rdquo; &middot; &ldquo;college admissions&rdquo;", "core": "Not middle school with a couple of dials turned. Same spine, dressed entirely different. 50/25/25.", "why": "Dan's biggest problem, and it rolls up to Paola. Dan said \"I love that idea.\"", "keys": "high school rethink ninth grade college admissions gradual release seating chart 50 25 identity", "label": "6 &middot; What should high school be? What needs a structural rethink?", "hook": "not middle school with the dials turned / same spine, dressed different / 50-25-25", "tests": "Whether he has a real point of view on the high school they just opened.", "target": "2 minutes. The seating-chart paragraph is the one to cut.", "land": "Lives of unlimited opportunity, and what a ninth grader needs to do to get there. Then the 46%.", "avoid": "Opening with \"I wish I had the answer\" (what happened with Dan).", "answer": "<p>… <span class=\"dcue power\">lead with this</span> high school can't be like middle school just with a couple of dials turned. We get into a lot of and I think that's what a lot of folks have done. Because like you said, some of the things wear off, some of the things that compelled students in middle school either don't hold for different reasons. Number two, we can't overcorrect and we can't undercorrect on our systems and our structures. When we try and go too far and we don't have any systems, students are looking left and looking right and being like, \"Do you even have it together? What is going on? This is not what I signed up for.\" At the same time, if we don't evolve them in strategic ways, you guys are treating me like I'm still in middle school. And so I would think about it the way I think about my classroom, which is I'm starting a new school year. It's a new group of students. I'm teaching something different. What is it that I did in the past that worked that I need to replicate for this group? And I think it would be about defining a wholly different identity, making sure that this was one that was resonant with students and that <span class=\"dcue slow\">slow</span> we had a spine, a skeleton of the same values, but we dressed it entirely different. And I don't mean dress in terms of faking or putting on just bells and whistles. What I simply mean to say is our values are still our values. But how they show up and what they look like and what the experience of a student is going to be does need to be fundamentally different.</p><p><span class=\"dcue flat\">cut if short</span> I would ideally have us start at the end of seventh grade and begin a transition towards independence. In eighth grade, one of the things we did at Excel and we started to do at collegiate was run the second semester of each of those years as intentional transition points where we said, \"We're going to remove the seating chart. Before we do that, we're going to teach you why it existed, what are the choices people are making, what does it look like to choose the seat?\" And then we let kids fail. Sorry, I should say, we let kids choose their own seat. Some of them did well, some of them didn't. And we didn't immediately jump in and say, \"Okay, fine. Here's where you sit.\" We let it run and we let kids sit with and see what the outcome, how the outcome of that two-weeks grading cycle, how it changed. And we reflected with them and gave them another opportunity, again, to choose. And we did three to four cycles of that for multiple discrete skills such that we were taking all of our we were taking, let's say, 40% of our 50% of our systems that were meant as placeholders or substitutes for the real skill, the student choice, the student understanding of why. So this is the org system. This is office hours and tutoring, student materials, late homework, or late work policy. And we systematically took those back, gave, like I said, the front-end instruction, the opportunity to try it out, and multiple cycles of that. And I think that's where I would want to start doing that in eighth grade so that we could do that in high school. And I think it's hard, though, because if you start that exact strategy in high school, are we really willing to say to students that we're going to take the first semester of their year and let things slide or let things slip? Because that's obviously highly problematic. So I think what I would try and do is find a way to apply some of that same logic.</p><p>I would take a look at my middle school plays. I would say, \"Which 25% of these no longer make sense? Or <span class=\"dcue beat\">beat</span> what are the 50 that are core we're going to keep? What are the 25% that don't make sense anymore or we don't need them? And then what are the 25% that we are going to intentionally do pretty quick gradual release with instruction and reflection as a primary starting point?\" All built around aiming at a different identity and an endpoint rather than we did in middle school because middle school is obviously focused on the high school portion of it. So then we have to focus on the lives of unlimited opportunity and what that means to a scholar in terms of what they need to do to advance and arrive at the right place. <span class=\"dcue power\">then the number</span> <em>In the third quarter, 46% of ninth graders across all 48 high schools finished at a 3.0 or better, up six points.</em> <span class=\"dcue stop\">STOP</span></p><p class=\"small\">Your words: Dan Rojas call 092526, lines 118-139. The number is from block 10 of your answer bank.</p>", "receipts": ["(3) ACADEMIC HEALTH, 46%"], "stop": "The 46%, then stop."}, {"id": "ownership", "grp": "C", "t1": 7, "tier": "LIKELY", "type": "core", "short": "Culture and student ownership", "trig": "&ldquo;beyond systems&rdquo; &middot; &ldquo;culture&rdquo; &middot; &ldquo;student voice&rdquo;", "core": "Cool to be smart. Ownership that isn't thin and surfacey. It's my school.", "why": "Dan's follow-up. For Paola it shows culture as academic identity.", "keys": "culture student ownership honor council orientation leaders identity belonging events", "label": "7 &middot; Beyond systems, what would you change about high school?", "hook": "cool to be smart / not thin and surfacey / it's my school", "tests": "Whether culture means more than discipline to him.", "target": "90 seconds", "land": "As adults, we would be saying a whole lot less and helping our students say a whole lot more.", "avoid": "Running past two minutes.", "answer": "<p>It sounds like you're in a place that where I think we got to a place at Excel where things were functional, things were academically focused, things were working. Were they perfect? No, of course not. But were they functional? Yes. And one of the corners that we turned two corners that made all the difference. One was what was teacher doing bell to bell in terms of rigor and instruction that gave us a sense of purpose and built an academic identity of cool to be smart, cool to work hard, and driving that as whereas in middle school, it might have been more focused on incentives and rewards or team. We switched it to a little bit more of an individual and more of an academic rigorous folk. <span class=\"dcue slow\">slow</span> It's not fun because it's fun. It's fun because it's challenging. And so building a true academic scholarly identity is number one. And number two, <span class=\"dcue beat\">beat</span> we always talk about student ownership over culture and over the school. And oftentimes, those end up being thin and surfacey. And so what I would do, I believe, would be something we did at Excel, which is to develop a lot of genuine student groups that play a key role, not just in the planning of the dance or the student council, but that are actually operating within the school day to help the school operate, to build the students who are involved in it to build their place and identity, but also so other students could see that this is the school that both trusts, empowers students, and those students are actually doing the thing incredibly well. So we'd have an honor council, right? And that honor council would be entirely responsible for within limits, of course, but doing a bit of investigation, evaluation around honor code violations, making recommendations. And we would put them front and center in terms of as much as we could from a legal and reasonable parent perspective, putting them in the position of understanding, deciding, and supporting scholars who are struggling. We would have groups that are intentionally owning and planning some of our joy factor or student events. All of these would be undergirded by our values. So not only would the group of the ninth-grade events committee be planning the dance, they'd be hyping the dance, they'd also attach a service commitment to it or a canned food drive to it. And they would be the ones making the announcements. They would be the one speaking and doing all of the things that oftentimes we have adults still do, even though behind the scenes, students are doing it. So it's really moving kids from supporting the school from an aspirational idea to action, but also to a level of doing it actually quite publicly. And that is where in a high school of 150 students, first year, 150 students per grade, you can get it so that more than a third of those students at any given time is in a meaningful group like this. And so they're part of one, and then they're seeing three to four others. And that's how we really get students to get that feeling of not only is this high school and it's different, it's also my school. And so we have this we build this identity of belonging such that when students are joining I mean, one of the big groups we would do, and I'll leave it at this, is our orientation leaders. We would have sophomores and juniors leading our freshman orientation, 50% of it, right? We would help prep them. We would help we'd spend a lot of time getting them to be incredibly good at this. We'd record a lot of video so that we could show what it looks like. But we would, <span class=\"dcue power\">land this</span> as adults, be saying a whole lot less and helping our students say a whole lot more. <span class=\"dcue stop\">STOP</span></p><p class=\"small\">Your words: Dan Rojas call 092526, lines 143-159.</p>", "receipts": [], "stop": "Stop on \"say a whole lot more.\""}, {"id": "scale", "grp": "D", "t1": 8, "tier": "LOCK", "type": "core", "short": "Earn it: when to scale, playbook vs autonomy", "trig": "&ldquo;playbook or autonomy&rdquo; &middot; &ldquo;why do networks plateau&rdquo; &middot; &ldquo;when is it ready to scale&rdquo;", "core": "We were clear on who we were. A new principal runs the proven play until the school is stable and functional; then they have earned room to change it.", "why": "Kruti's job is scaling what works. \"Earn it\" means: autonomy is earned by first getting the school stable and functional on the proven playbook.", "keys": "scale scaling playbook autonomy fidelity new principal earn it plateau network kipp excel replicate", "label": "8 &middot; When is a practice ready to scale? Playbook or principal autonomy?", "hook": "clear on who we were / earn it: stable, functional, then innovate / you are part of the evolution", "tests": "Fidelity versus autonomy, and whether he respects principals.", "target": "90 seconds", "land": "The high school is in the top 3% of all public high schools across the country. Jackie now has my old job.", "avoid": "\"I don't care really if you as a first-year principal...\" (it came right before \"earn that\" with Dan). The KIPP half of the comparison.", "answer": "<p>… Now, in contrast that with Excel, where we had playbooks for everything, we were unapologetic about the adult culture values, the way in which we did things, and we replicated not quite as cloning. I don't use huge, but the principal who started our second school and then our third school inherited 95% of the play was exactly the same. We wanted to maintain an opportunity for innovation because we recognized that innovation, one, you don't get to keep the right talent if you don't allow for some of that. And two, that's the laboratory where all the other schools can get better because we're trying something new. So fundamentally, we were clear on who we were. We were unapologetic about growing meant starting from a proven starting point and growing at a pace such that we could maintain the level of talent that we needed to do that incredibly well. And yeah, at the end of the day, our philosophy was we are here to build dynasties, to create radical transformations so students could live lives of unlimited opportunities. …</p><p><span class=\"dcue slow\">slow</span> Earn that, right? Get to the place of stable, get to the place of functional, then let's have a conversation about innovation. But for right now, we need to run the play because the play works. The play is not perfect. The play is going to evolve. <span class=\"dcue power\">land this</span> You're going to be part of that evolution. But the way in which we grow with quality is starting from a solid foundation of what we know that works. … Its high school is in the top 3% of all public high schools nationally, and a student I had in sixth grade now has my job. <span class=\"dcue stop\">STOP</span></p><p class=\"small\">Your words: Dan Rojas call 092526, lines 92-100, starting after the KIPP comparison; the \"I don't care really\" sentence is cut. The last sentence is block 3 of your answer bank (sixth grade, per your 091426 ruling), in place of the \"fifth, sixth, and seventh\" version you gave Dan.</p>", "receipts": ["(1) 270TH TO NUMBER ONE"], "stop": "Stop on \"now has my job.\" Then, if there is room, pair it with how you invest in people: Carver."}, {"id": "adopt", "grp": "D", "t1": 9, "tier": "LOCK", "type": "core", "short": "Adoption without authority (KIPP)", "trig": "&ldquo;adoption&rdquo; &middot; &ldquo;influence without authority&rdquo; &middot; &ldquo;across autonomous schools&rdquo;", "core": "Nobody had to say yes, so we had to get them to want to say yes. Aligned on the problem, made the pilot a success, stayed in the implementation.", "why": "Zeta is growing fast; Kruti needs adoption without force.", "keys": "adoption influence authority mandate kipp regions pilot champions buy in 28 48 alternate path", "label": "9 &middot; How do you get schools to adopt something they don't have to?", "hook": "no mandate / problem, pilot, implementation / 46% up six / no school took the alternate path", "tests": "Whether he can scale without positional power.", "target": "2 minutes", "land": "All 28 regions and all 48 high schools adopted the strategy. No school chose the alternate path.", "avoid": "\"Used by all 28\" for the tool (it was piloted and handed off). Criticizing KIPP.", "answer": "<p>Mandate authority isn't what drives change, not at any organization that attracts this kind of talent. The idea has to earn its place on merit, not on positional authority. It's not something you can build a dynasty on.</p><p>That was the situation at KIPP. The Foundation is the national strategy, support and oversight arm, but it has no mandate authority, and we had twenty-eight independent regions and forty-eight high schools. <span class=\"dcue slow\">slow</span> Nobody had to say yes, so we had to get them to want to say yes. It came down to three things.</p><p>First, we aligned on the problem and the goal. Every region was part of our listening tours and working groups. We showed people the problem, asked for their hypotheses, and workshopped them until we had a student-centered logic nobody could argue with: accurate, timely grades, non-negotiable, and a 3.0 GPA as the target, which was research-based, not our idea. Then we got clear on the one number we were going after.</p><p>Second, we piloted it, and we made the pilot a success. We shrank the scope, worked it with our influential champions, and publicized the wins, so it was attraction, not promotion. People wanted to catch up instead of being dragged along. \"Why are they making us do it\" became \"why aren't they helping us do it.\"</p><p>Third, we involved ourselves in the implementation. We supported it heavily, including the school-based routines, like tracking our single number every week. Our regional support person was overseeing that at each school, and we checked in with them regularly, because every rollout was its own animal.</p><p>And we gave them what felt like a cheat code. We made their lives easier and got them quick early wins with push-button data reports. They may not sound like much, but they really were. We went from super obscure data to super actionable data, and with our weekly structures, those reports made leaders look good, because they gave teachers a feel-good, and that gave us early wins we could stack. It's leaning into an advantage, so the work feels new and puts some wind in the sails.</p><p>In the third quarter, <span class=\"dcue power\">land the number</span> <em>46% of ninth graders across all 48 high schools finished at a 3.0 or better</em>, up six points. Best quarter KIPP had ever had on that number. All 28 regions and all 48 high schools adopted the strategy. There was an alternate path, and no school chose it.</p><p>We piloted the tool and handed it off. Now the regions are running the play. That's the exact type of work I love doing. <span class=\"dcue stop\">STOP</span></p><p class=\"small\">Your words: THE TWELVE ANSWERS, block 2 (your dictation, rebuilt 092526).</p>", "receipts": ["(2) 28 REGIONS, 48 HIGH SCHOOLS, NO MANDATE", "(3) ACADEMIC HEALTH, 46%"], "stop": "Stop on \"That's the exact type of work I love doing.\""}, {"id": "initiative", "grp": "D", "t1": 10, "tier": "LIKELY", "type": "core", "short": "An initiative, design to scale", "trig": "&ldquo;an initiative you led across schools&rdquo; &middot; &ldquo;pilot to scale&rdquo;", "core": "The data was there and nobody could use it. One button, a report per teacher. Present but obscured, to right in front of them.", "why": "Kruti's job is taking what works to scale. This is your pilot-to-network story.", "keys": "initiative pilot design implementation data academic health reports teacher student gpa weekly", "label": "10 &middot; An initiative you led from design through implementation across schools.", "hook": "data nobody could use / one button, a report per teacher / present but obscured", "tests": "Whether he can take a pilot to scale.", "target": "2 minutes", "land": "Cited as one of the primary drivers that got the right folks focused on the right conversation and the right actions.", "avoid": "Leading with the tool. Forgetting the book mid-story (last time).", "answer": "<p><span class=\"dcue flat\">set the scene</span> The Academic health data transparency work that was a subset of our larger academic health work so I'll I'll set the scene a little bit. Every school on our network had grade books, they had tons of data, All of that data was in these large CSV files and Excel files. and While it was accessible or while it was there, people couldn't really use it.</p><p><span class=\"dcue beat\">beat</span> … Using Claude Code to build A Python script that parsed out these huge data sets and with the push of a button created individualized teacher reports Telling them, you know, here are the students of concern, the assignments of concern. Here's where you don't have enough of a certain type of assessment. Here's where, you know, you're Your grades seem to be skewing. So we got people weekly high quality personalized data that we were able to compare to a standard. We did the same thing for students.</p><p>I designed this for one particular school, rolled it out at that school, and then we took it across the country. And so, We built these reports through the AI. Then we created a regular meeting cadence We created a team at the school I was looking into these things and was leading the work on the ground.</p><p>And what we ended up seeing was instead of people waiting till The end of the quarter to finish the grading or to tell students where they stood and what needed to happen, they were able to do that. weekly and just the fact that <span class=\"dcue slow\">slow</span> the data went from <em>present but obscured to right in front of them</em>, drove a tremendous amount of positive change because, again, they could look at it and they could see This is where I'm falling short. This is where this student is struggling.</p><p>We then took that across the country and we were able to see the biggest jump in GPA year over year in that, in the last year. In our last quarter that I was there, of course there's a million things that go into creating huge GPA jumps, so I don't mean to, I'm not trying to take all the credit, but it's been cited as one of the primary Drivers that really got the right folks Focus on the right conversation and the right actions. <span class=\"dcue power\">the number</span> <em>In the third quarter, 46% of ninth graders across all 48 high schools finished at a 3.0 or better, up six points.</em> <span class=\"dcue stop\">STOP</span></p><p class=\"small\">Your words: DREAM screen 081726, your answer to \"one initiative from design through implementation.\" The number is from block 2.</p>", "receipts": ["(3) ACADEMIC HEALTH, 46%"], "stop": "The number, then stop."}, {"id": "launch", "grp": "D", "t1": 11, "tier": "LIKELY", "type": "core", "short": "Launching a school: three phases", "trig": "&ldquo;launching a new school&rdquo; &middot; &ldquo;first-year principal&rdquo; &middot; &ldquo;turnaround&rdquo;", "core": "Stability, then the adults, then student ownership. Six days writing the playbook.", "why": "Zeta has Flushing, Tremont Park and the high school all in year one.", "keys": "launch new school first year principal turnaround excel phases playbook six days stability", "label": "11 &middot; How do you launch a new school or onboard a first-year principal?", "hook": "stability / the adults / student ownership / six days on the playbook", "tests": "Whether he knows what a first year needs.", "target": "2 minutes", "land": "Excel is now in the top 3% of all public high schools nationally.", "avoid": "Running all three phases at full length if time is short.", "answer": "<p>We took Excel from 270th in the state to number one and got National Charter School of the Year, and I think about it in three phases.</p><p>Phase one was stability. I came in with a mandate for change: an entire new staff, a hundred students, and a school that had stopped growing because things were in such rough shape. I was dean of students, forty percent of the staff reported to me, operations included, and I brought the consistency and clarity from my classroom to the whole school. <span class=\"dcue slow\">slow</span> I spent six days writing the playbook, my culture manual and my operations manual. My boss thought that was a crazy use of time. <span class=\"dcue power\">land this</span> It became one of the most important things we did.</p><p>Phase two was the adults. We focused on the five dysfunctions of a team and built a really strong best-idea-wins culture, with rigor and engagement as the primary drivers, so we stayed academically focused.</p><p>Phase three was student ownership, student leadership, and a deeply held sense of belonging. The grades were theirs, the classes were theirs, the culture was theirs. Honor council, student committees, orientation leaders. On the first day of school we had kids telling new kids how overwhelmed they'd been, and that they'd even told their parents they didn't like the school. Where we ended up was a culture where it was cool to be smart. Kids advised each other. When we asked a question, most every hand went up. Kids were genuinely supporting each other.</p><p>We were building dynasties, not just teams. Twenty years after that initial mandate for change, Excel is six schools across two states, one of the strongest networks out there, and one of the most successful at scaling without losing its soul or its results. Its high school is in the top 3% of all public high schools nationally, and a student I had in sixth grade now has my job. <span class=\"dcue stop\">STOP</span></p><p class=\"small\">Your words: THE TWELVE ANSWERS, block 3 (your dictation, revised 092526).</p>", "receipts": ["(1) 270TH TO NUMBER ONE"], "stop": "Stop on the top 3%."}, {"id": "instruction", "grp": "E", "t1": 12, "tier": "LOCK", "type": "curve", "short": "Systems and culture, not academics?", "trig": "&ldquo;you're a systems and culture person&rdquo; &middot; &ldquo;instructional leadership&rdquo;", "core": "Yes and no. I've spent my career on the part that decides whether instruction works.", "why": "DREAM asked this twice. It is the likeliest doubt about you for a schooling seat.", "keys": "instruction academic curriculum rigor systems culture never led instruction learning curve", "label": "12 &middot; You're known for systems and culture. Why trust you with academics?", "hook": "yes and no / culture is a means to an end / the four I spike in / 46%", "tests": "Whether a culture guy can manage instructional leaders.", "target": "2 minutes", "land": "Best quarter KIPP had ever had on that number.", "avoid": "Ending on the gap.", "answer": "<p><span class=\"dcue flat\">plain, no apology</span> Yes and no. I'm not the person who's going to know the twelfth grade AP government standards cold, but I've spent my career on the part that decides whether instruction works.</p><p>Culture is a means to an end. It isn't an end in itself. It used to be what happens outside the classroom, the systems and the struggles. Then it became how that supports what's happening in the classroom, and now it blends and becomes one with the classroom. I was in the room when Achievement First built the Arc of the Year in the mid-2010s, and then I carried it to Collegiate and into the schools I consulted with.</p><p>I've coached on rigor, too. As I taught leaders how to coach, I taught them how to teach: real-time coaching, observation and feedback. And you don't get anywhere in any good organization without a clear end point and real facility with academic results.</p><p>What I've seen most academic leaders get wrong isn't the curriculum or what great teaching looks like. It's four things. Do they have the personal systems to stay effective and above the fray, is their side of the street clean. Do they understand systems, adult leadership and change management. Can they analyze a problem, fix it, and lead an initiative for change. And do they know what to do with the teacher who has real issues with credibility and culture. Those are the four I spike in.</p><p>Where people often fail is in the non-academic parts of the job. There are a hundred instructional experts for every five legitimate, proper leaders who can lead people through an initiative.</p><p>I came up at Excel, and at Collegiate, which had the largest CREDO effect size of any high school in the country. At KIPP I owned the national academic health workstream across forty-eight high schools, GPA, course failures, attendance, and whether a kid feels like they belong. As interim high school principal at Brooklyn Lab, instruction was part of my job. And in the third quarter, <span class=\"dcue power\">land the number</span> 46% of ninth graders across those schools finished at a 3.0 or better, up six points. <em>Best quarter KIPP had ever had on that number</em>. <span class=\"dcue stop\">STOP</span></p><p class=\"small\">Your words: THE TWELVE ANSWERS, block 10 (your dictation, revised 092526). Your DREAM version of the same answer is in Story (9).</p>", "receipts": ["(3) ACADEMIC HEALTH, 46%", "(9) THE DREAM VERSION"], "stop": "Stop on the 46%."}, {"id": "lab", "grp": "E", "t1": 13, "tier": "LIKELY", "type": "core", "short": "Brooklyn Lab: the hard call", "trig": "&ldquo;hardest decision&rdquo; &middot; &ldquo;crisis&rdquo; &middot; &ldquo;Brooklyn Lab&rdquo;", "core": "I moved a leader I had asked to step in, and ran the high school myself, in the middle of COVID and the renewals.", "why": "The renewal is only a feat in context: two authorizers running separate processes, no credible institutional records, numbers you could not trust, low achievement and culture, COVID, a turnaround, and an acquisition in motion. You cannot say most of that. Your words that carry it: untangling knots and doing forensic analysis on the data.", "keys": "brooklyn lab hardest decision interim principal renewal reauthorized covid crisis superintendent", "label": "13 &middot; The hardest call you have made. Brooklyn Lab.", "hook": "moved the leader / ran the high school myself / knots, forensics / both reauthorized", "tests": "Whether he makes hard calls and owns them.", "target": "75 seconds", "land": "We took both charters through renewal at the same time, and both were reauthorized.", "avoid": "Saying the numbers you were shown were false or unknown. Blaming the founder. Leading with the renewal: any decent school gets reauthorized, so it only means something after the knots and the forensics.", "answer": "<p>The hardest decision was moving a leader I'd asked to step in, and it was hard because of what it meant for me: could I actually do the job?</p><p>At Brooklyn Lab, <span class=\"dcue flat\">plain</span> the original high school principal left about eight weeks after I joined, in a somewhat dramatic Friday afternoon fashion. A colleague stepped in at my request, and we both knew she wasn't an obvious choice for the role.</p><p>The high school was struggling, and I was the superintendent, so it was my call. Moving her meant I would run the high school myself, as interim principal, on top of being superintendent, in the middle of COVID and with the reauthorizations coming. We were untangling knots and doing forensic analysis on the data.</p><p><span class=\"dcue slow\">slow</span> I made the call, and I ran the high school for half a year while still serving as superintendent. We took both charters through renewal at the same time, in front of the Board of Regents, and <em>both were reauthorized</em>. <span class=\"dcue stop\">STOP</span></p><p class=\"small\">Your words: THE TWELVE ANSWERS, block 5 (your dictation).</p>", "receipts": ["(5) BROOKLYN LAB"], "stop": "Stop on \"both were reauthorized.\""}, {"id": "leftkipp", "grp": "E", "t1": 14, "tier": "LIKELY", "type": "core", "short": "Leaving KIPP", "trig": "&ldquo;why did you leave KIPP&rdquo; &middot; &ldquo;what have you been doing since May&rdquo;", "core": "A two-year design role. It ends when the cycle runs without me.", "why": "Short, clean, no apology.", "keys": "left kipp leave why did you leave since may gap design role one kipp", "label": "14 &middot; Why did you leave KIPP? What since?", "hook": "design and hand-back / runs without me / arm's reach", "tests": "Whether there is a problem behind the exit.", "target": "45 seconds", "land": "Twenty-eight regions, forty-eight high schools. They're running it now.", "avoid": "Anything critical about KIPP. The Verizon line if it lands wrong with ex-Success people.", "answer": "<p>It was a two-year design role on the One KIPP initiative, and we did what we were brought in to do.</p><p>We designed, launched and piloted a national high school strategy, then passed it back to the regional support teams. The project doesn't end when we run the first successful cycle. It ends when we run that cycle without me.</p><p>I was happy to play a part in that. It was focused, it was helpful, and it was what was needed. But a national foundation can feel a little like working at Verizon, not in an incubator or out of your garage. One of my favorite things is being part of a small group of people solving the problems within arm's reach.</p><p>Since then I've been building custom AI tools for school leaders, doing school leader consulting and sales advisory.</p><p>Twenty-eight regions, forty-eight high schools. <em>They're running it now.</em> <span class=\"dcue stop\">STOP</span></p><p class=\"small\">Your words: THE TWELVE ANSWERS, block 9 (your dictation, revised 092526).</p>", "receipts": ["(2) 28 REGIONS, 48 HIGH SCHOOLS, NO MANDATE"], "stop": "Stop."}, {"id": "assocdean", "grp": "E", "t1": 15, "tier": "LIKELY", "type": "core", "short": "A failure: the associate dean", "trig": "&ldquo;a failure&rdquo; &middot; &ldquo;a time you were wrong&rdquo; &middot; &ldquo;growth area&rdquo;", "core": "I had a fixed mindset about someone I managed. I fixed it, late.", "why": "Zeta is \"love your people.\" This shows you own a management miss.", "keys": "failure mistake wrong fixed mindset associate dean develop growth area manager", "label": "15 &middot; Tell me about a failure.", "hook": "fixed mindset / six months / clarity, investment, training, accountability / co-dean now", "tests": "Self-awareness and how he develops people.", "target": "90 seconds", "land": "He's co-dean there now, and still one of the best I've seen do this job.", "avoid": "Why you had to leave Excel.", "answer": "<p>The one I think about most is a time I had a fixed mindset, which is ironic for someone who talks so much about growth mindset and assuming the best.</p><p>At Excel I had an associate dean of students who was a wonderful human being and a true friend of mine. Out of the pressure, the need to be on, to move quickly, to survive and thrive, I fixed my mindset about him and never reanalyzed it. I found evidence to support my hypothesis and ignored the evidence that I was wrong. There's a time for that. But in years three and four I wasn't developing him to become a dean of students.</p><p>Then I learned I had to leave, and all of a sudden I had six months before he was the dean of students. <span class=\"dcue slow\">slow</span> I realized I'd failed him as a manager and as a friend, and that I would fail the school and the kids if I didn't figure it out quickly. So it became priority number one.</p><p>Clarity: I named exactly what he was good at, and what he hadn't been given the chance to do. Investment: I asked him whether he truly wanted the job, and I let him know I heard him. Training was most of the work. It was I do, we do, you do, with tons of support and feedback along the way and a gradual release. And accountability: within a month he was clearly meeting well-established targets.</p><p>He's co-dean there now, with one of my former students, and he's still one of the best I've seen do this job. I wish I hadn't been so eager to support my initial hypothesis. <span class=\"dcue stop\">STOP</span></p><p class=\"small\">Your words: THE TWELVE ANSWERS, block 6 (your dictation).</p>", "receipts": ["(8) THE ASSOCIATE DEAN"], "stop": "Stop on the last line."}, {"id": "ask1", "grp": "F", "t1": 16, "tier": "LOCK", "type": "exit", "short": "MUST-ASK 1: which role", "trig": "by minute 10", "core": "Which role, and what success looks like at twelve months.", "why": "You left the Dan call without knowing the seat or the next step.", "keys": "ask role which seat success twelve months principal manager", "label": "MUST-ASK 1 &middot; Which role? By minute 10.", "hook": "which role / success at 12 months / listen", "tests": "", "target": "one sentence", "land": "They describe the seat.", "avoid": "Waiting until the end.", "answer": "<p><span class=\"dcue flat\">PROPOSED wording, not yet yours: say it your way</span> Which role they are considering you for, and what success would look like at twelve months. <span class=\"dcue stop\">STOP</span></p><p class=\"small\">Your words: Proposed wording. The form that worked with Dan (line 211): \"What, if anything, should I read into the fact that you and I are having a conversation on the school excellence side of things as opposed to operations?\"</p>", "receipts": [], "stop": "Ask and listen."}, {"id": "ask2", "grp": "F", "t1": 17, "tier": "LOCK", "type": "exit", "short": "MUST-ASK 2 + next step", "trig": "minute 20", "core": "One question each, then the next step.", "why": "Grounded in what Zeta is doing this fall.", "keys": "ask question kruti paola campuses ninth graders next step who else", "label": "MUST-ASK 2 &middot; One for each of them, then the next step.", "hook": "Kruti: consistency / Paola: the 119 / next step", "tests": "", "target": "as needed", "land": "You know the next step and who decides.", "avoid": "Answering your own question.", "answer": "<p><span class=\"dcue flat\">PROPOSED wording, not yet yours: say it your way</span></p><p><em>Kruti:</em> with Flushing, Tremont Park and the high school all opening this fall, what has been hardest to keep consistent campus to campus.</p><p><em>Paola:</em> for the 119 ninth graders in that first class, what a great first year looks like by June.</p><p><span class=\"dcue slow\">slow</span> The next step, and who else you would talk to. <span class=\"dcue stop\">STOP</span></p><p class=\"small\">Your words: Proposed wording.</p>", "receipts": [], "stop": "Ask and listen."}, {"id": "now", "grp": "P", "short": "What you do now (AI)", "label": "What are you doing right now? The AI work.", "hook": "time / two fears / safe, human-in-the-loop / not for its own sake", "keys": "ai tools now current coverage schedule what are you doing technology", "core": "Principals point me at a problem; I build the thing that saves them time.", "why": "Only if asked. Do not pitch.", "tests": "", "target": "60 seconds", "land": "Some need a place to start, all of them need time, and I can help with both.", "avoid": "\"Taking off.\" Any claim a tool is running at a school.", "answer": "<p>Right now I build custom AI tools for school leaders, and I think this is a special moment, one that can finally help us deliver on our promise, or make the disparities even wider. I'd like to be on the right side of it, not for reputation but for results.</p><p>There's a need, and I'm well suited for it. I have a special skill set in knowing exactly how schools work, how the variety of schools work, what the common problems are, and where leaders commonly struggle. I've seen 48 high schools at KIPP and a hundred or so schools as a consultant, and I've gone deep in a lot of them to test hypotheses.</p><p>I've always been a systems guy, and this is the next level. It's the leap from Excel spreadsheets to Google Sheets to software to dashboards, and AI is the next one, orders of magnitude more powerful. I've always been building tools like DeansList, and at KIPP I was already building them into the solutions.</p><p>And it's not just that people point me at a problem. I'm constantly in touch with my network. I can text a hundred charter leaders and ask what their problems are. What I kept hearing was time. But when I dug deeper, I heard two fears: the fear of missing out, and the fear of messing up, doing nothing or doing the wrong thing. My job is to help them.</p><p>So I asked, what's the safe, leader-facing, human-in-the-loop, efficiency play that takes the mundane off the leader's plate so they can focus on the transformational? I built tools to answer that, and as new clients and new problems come up, I build new ones.</p><p>These are just a few of the ones I've been working on recently: a coverage schedule maker, a chief of staff, and tools for attendance, enrollment and retention, walkthrough coaching and PD. The coverage schedule maker is built on two schools' real master schedules, and it's installed at one. <span class=\"dcue flat\">plain</span> My estimate is two to three hours a week back to the person running the building.</p><p>And yes to AI in any role I'd take, in the service of the role, not for its own sake. I'd bring the efficiencies to my own work, and my natural tendency is to share them. I lead a monthly working group of education and tech leaders on exactly that.</p><p>The long-term vision is to get leaders really good at this, and for me to stay back and support them. There will always be a need for an expert who can build high-quality tools quickly. If a principal is going to decide how to approach AI for their teachers and classrooms, they need to understand it first. Some need a place to start, all of them need time, and I can help with both.</p><p class=\"small\">Your words: THE TWELVE ANSWERS, block 8 (your dictation).</p>", "stop": "Stop.", "type": "core", "receipts": []}, {"id": "whynow", "grp": "P", "short": "Why take this after being a chief", "label": "Why take this seat after being a superintendent and a chief?", "hook": "bass player / tomorrow in front of kids / a builder", "keys": "why now step down lateral ego superintendent chief level title", "core": "The right title in the wrong organization is a losing proposition.", "why": "If level comes up.", "tests": "", "target": "75 seconds", "land": "It's been a long time since I was directly responsible for the thing that had to happen in front of kids the next day, and I want that back.", "avoid": "Title, level, money.", "answer": "<p>Two things I know. The people I work with are worth far more than pride, and I'd rather have excellence than ego. And the right title in the wrong organization is a losing proposition. Putting my own advancement over the ability to drive achievement just isn't who I am. I'm a pretty good bass player, and I'm okay being the bass player. That doesn't mean I won't step up.</p><p>It's been a long time since I was directly responsible for the thing that had to happen in front of kids the next day, and I want that back. This is the work I'm doing and piloting with schools right now, and this is a chance to do it deeply, and better than I could possibly do it from afar.</p><p class=\"small\">Your words: THE TWELVE ANSWERS, block 12 (paragraphs 2-3).</p>", "stop": "Stop.", "type": "core", "receipts": []}, {"id": "change", "grp": "P", "short": "How you lead change", "label": "How do you lead change?", "hook": "one thing / clarity, investment, training, accountability / paper is worthless", "keys": "lead change approach leadership style rollout", "core": "The one thing, then the systems. Paper is worthless until the people are behind it.", "why": "If the question is about approach, not a story.", "tests": "", "target": "75 seconds", "land": "Paper is worthless until the people are behind it.", "avoid": "Reciting a framework.", "answer": "<p>I figure out the one thing we're going after, and then I build the systems and tools to go after it.</p><p>I've seen this at every level. Directly at Excel on the school leadership team, as a consultant, at the network level at Collegiate and Brooklyn Lab, and nationally at KIPP. And I've made lots of mistakes at every one of them.</p><p>The first part is the most important part. What's the one thing that tells us we're on track. Then, for a school, it's clarity, investment, training, and only then accountability. The order matters. It's the Switch framework from Dan Heath, the elephant and the path.</p><p>It's a narrow focus, intense but not blind. We work on a few things, not a hundred different things. And we don't confuse action and effort with real progress.</p><p>I know how to write a system on paper. I also know that paper is worthless until the people are behind it. And the work is changing. The organizations that figure out their stance on this new tech are going to serve students better, and the ones that bury their head in the sand are going to get left behind.</p><p class=\"small\">Your words: THE TWELVE ANSWERS, block 13.</p>", "stop": "Stop.", "type": "core", "receipts": []}, {"id": "growth", "grp": "P", "short": "Growth area", "label": "Your biggest area for growth?", "hook": "narrowing focus / build slow to go fast / first downs", "keys": "growth area weakness criticism", "core": "Narrowing focus.", "why": "One growth area, owned, with the fix.", "tests": "", "target": "45 seconds", "land": "The strategy is first downs.", "avoid": "A second weakness.", "answer": "<p>If I'm being really honest, it's narrowing focus.</p><p>I know it takes movement on multiple fronts, operations, culture, academics, talent, teacher training. Because it's all one package deal, I can overcomplicate it and spread us too thin, and not have a few narrow, viable targets that we stack.</p><p>What I work on is building slow so we can go fast. Operating in phases. Being okay with some things being not yet. When I've done it right, like at KIPP, we shrank the change and let the early wins in our stronger regions sell the rest.</p><p>Next time I'm directly operating, the school will run off a vision that's explicit about what the first down is, what the plays are, and what every position has to do. Every player can run the touchdown, but the strategy is first downs.</p><p class=\"small\">Your words: THE TWELVE ANSWERS, block 11.</p>", "stop": "Stop.", "type": "core", "receipts": []}, {"id": "consult", "grp": "P", "short": "Consultant to operator", "label": "Why go back inside a network after consulting?", "hook": "stay credible / kept a distance before / a promise to principals", "keys": "consultant operator consulting why operate distance", "core": "There is no substitute for the full experience.", "why": "The unspoken \"will he stay?\"", "tests": "", "target": "75 seconds", "land": "I can't break a promise to principals.", "avoid": "The hotels line if it sounds flip.", "answer": "<p>To be any good at consulting, you have to remember exactly what it's like to do the work, stay current, and stay credible, and the way I do that is by doing stints in-house, not as a visitor.</p><p>Consulting is where you help people do the work. It isn't where the work happens. The work is energizing, and so is being genuinely part of the team. I've done a good job of injecting myself, building credibility and building strong relationships, but there's no substitute for the full experience.</p><p>I've also messed this up. At Collegiate and at Brooklyn Lab I started as a consultant and then moved in, and both times I kept a bit of distance from the organization. It wasn't intentional, and I do it very differently now.</p><p>At some point a decision needed to be made. A school can't break a promise to kids. A school leader can't break a promise to teachers. I can't break a promise to principals.</p><p class=\"small\">Your words: THE TWELVE ANSWERS, block 7 (paragraphs 1, 3, 4, 7).</p>", "stop": "Stop.", "type": "core", "receipts": []}, {"id": "sped", "grp": "Q", "short": "Special education (strength)", "label": "Special education. How have you led it?", "hook": "Collegiate: best SPED operation I know / managed at Excel / oversaw at Lab", "keys": "special education sped students with disabilities ell english learners inclusion", "core": "A strength lane. Lead with it, never hedge.", "why": "Zeta's authorizer has flagged SPED and ELL enrollment. This is your strongest unplayed card.", "tests": "", "target": "60 seconds", "land": "No recorded answer in your words. Say the facts your way.", "avoid": "Saying you managed SPED teachers at Collegiate (you coached principals and held standards there).", "answer": "<p>No recorded answer in your words yet. The facts:</p><p><em>Collegiate:</em> a seven-level service continuum, including low-incidence programs and a post-secondary program. Your ruling: the best special education operation of any charter network you know in the country. You coached principals and held standards there.</p><p><em>Excel:</em> you managed special education. <em>Brooklyn Lab:</em> you oversaw it.</p><p class=\"small\">Your words: verified-facts L250, ruling 57, via PRINCIPAL MANAGER TRACK 092026.</p>", "stop": "Stop.", "type": "core", "receipts": []}, {"id": "pushback", "grp": "Q", "short": "A coaching miss at Collegiate", "label": "A time your approach with a principal did not work.", "hook": "wasted a year / systems before buy-in / cleaned it up", "keys": "coaching miss failure principal buy in collegiate pushback", "core": "I built the documents before I had the leader.", "why": "A second failure story if they want one about principals specifically.", "tests": "", "target": "60 seconds", "land": "Yes, I cleaned it up, but it was a failure.", "avoid": "Naming the principal or the school.", "answer": "<p>Your words, 082626: \"focused on building the systems and the structure of the documents and did not insist on the leader's buy-in, or even their time and their sign-off.\" \"that school fell as a result of it.\" \"a real, genuine failure that had real, measurable impact. Yes, I cleaned it up, but it was a failure.\"</p><p class=\"small\">Your words: verified-facts L1202, via PRINCIPAL MANAGER TRACK 092026. The principal stays unnamed.</p>", "stop": "Stop.", "type": "core", "receipts": []}, {"id": "pay", "grp": "R", "short": "Compensation", "label": "Compensation expectations? (never raise first)", "hook": "right team over cashing in / top of the band", "keys": "compensation salary pay range band money", "core": "Title and pay match the scope.", "why": "Debrief: Principal Manager band $125K to $175K; your salary of record $175K; your rule is to ask for the top of the band.", "tests": "", "target": "20 seconds", "land": "Top of the band, and the number grows if the scope does.", "avoid": "Naming a number first.", "answer": "<p>Yes. I think the top of that range is... Would work. Yeah. And I understand what you're saying and I appreciate you saying it clearly. But yeah, I want to join the team. Yeah. I'm not at a place in my life where I need to cash in, you know what I mean? I'm very happy to be part of the right team. That's where I've been the happiest in my life.</p><p class=\"small\">Your words: DREAM screen 081726, when the band was $145K to $165K. At Zeta, set your own number before the call.</p>", "stop": "Stop.", "type": "core", "receipts": []}, {"id": "commute", "grp": "R", "short": "In person, the Bronx", "label": "In person every day in the Bronx. Does that work? (never raise first)", "hook": "considered it / right people, right work / eyes wide open", "keys": "commute in person bronx westchester every day hybrid travel", "core": "Short answer is no concern, if that is still true.", "why": "Gillian asked about Inwood on 09/11. The Principal Manager seat is 425 Westchester Ave, daily.", "tests": "", "target": "20 seconds", "land": "I want to find the right group of people doing the right work more than anything.", "avoid": "The kids. \"I know that can be a red flag.\"", "answer": "<p>I've considered it. It's... Short answer is no. I wanna find the right group of people doing the right work more than anything. It's certainly not not a factor. … So, but at the same time, I do know what this work takes and yeah, I'm going in eyes wide open. I certainly, it's not that I've done this commute, you know, Six months straight and it's the middle of winter. I'm sure that will not always be the most joyful experience. But no, I've been up in that area and I've done the commute.</p><p class=\"small\">Your words: Zeta screen 091126, your commute answer; the \"…\" skips the part about your kids.</p>", "stop": "Stop.", "type": "core", "receipts": []}, {"id": "start", "grp": "R", "short": "Start date", "label": "When could you start?", "hook": "flexible / hand off thoughtfully", "keys": "start date when available october", "core": "Flexible.", "why": "Gillian floated October 13.", "tests": "", "target": "15 seconds", "land": "It's a good time for me.", "avoid": "Committing before checking United Schools.", "answer": "<p>The work that I'm doing now Now... is flexible enough in scope, especially if there's some consideration for sun setting and passing off some of these projects Thoughtfully, but it's a good time for me and that my flexible life schedule does Allow for that.</p><p class=\"small\">Your words: Zeta screen 091126.</p>", "stop": "Stop.", "type": "core", "receipts": []}, {"id": "yearone", "grp": "R", "short": "Year one", "label": "What would you want to own in year one?", "hook": "principals / ninth-grade academic health for the high school", "keys": "year one own first year 90 days priorities", "core": "Principals, and especially the high school side.", "why": "No recorded answer. The position is yours.", "tests": "", "target": "30 seconds", "land": "That is where my record is strongest.", "avoid": "", "answer": "<p>No recorded answer in your words. Proposed bullets: managing a set of principals, the way Dan described; owning ninth-grade academic health for the new high school; why: Carver and the 46%.</p>", "stop": "Stop.", "type": "core", "receipts": []}];
