me consideration for sun setting and passing off some of these projects Thoughtfully, but it's a good time for me and that my flexible life schedule does Allow for that.</p><p>I am happy. I'm happy to be patient, but I'm also would be eager to move as quickly as you all are ready to.</p><p class=\"small\">Your words: Zeta screen 091126.</p>", "stop": "Stop.", "type": "core", "receipts": []}, {"id": "yearone", "grp": "R", "short": "Year one", "label": "What would you want to own in year one?", "hook": "absorb, listen, think / reality heard before change / follow the bright spot / principals + ninth grade", "keys": "year one own first year 90 days priorities", "core": "\"Absorb. Listen. Think.\"", "why": "No recorded answer. The position is yours.", "tests": "", "target": "30 seconds", "land": "Frame: principals and ninth-grade academic health, proved by Carver and the 46%.", "avoid": "", "answer": "<p><span class=\"dcue slow\">slow</span> Your note (CH feedback for NCS prep): \"For first 90 days, we would start observing and listening this year. Absorb. Listen. Think.\"</p><p>School in the Square onsite 090826, as quoted in the debrief: \"people need their reality to be heard, valued, and considered before they're asked to do something different\" · \"let's limit the scope, let's follow the bright spot\" · \"I stopped thinking I knew everything and really listened\"</p><p><span class=\"dcue flat\">then the what, as bullets</span> Principals, the way Dan described the job. Ninth-grade academic health for the high school. Proof: Carver and the 46%. <span class=\"dcue stop\">STOP</span></p><p class=\"small\">Your words: the 90-day note is yours; the onsite lines are debrief quotes (secondary). The last line is a proposed frame, not your words. Do not name the Principal Manager title unless they do.</p>", "stop": "Stop.", "type": "core", "receipts": []}, {"id": "netsys", "grp": "D", "t1": 9, "tier": "LIKELY", "short": "Network systems that work in schools", "trig": "&ldquo;central office vs schools&rdquo; &middot; &ldquo;why don't network initiatives stick&rdquo;", "core": "They aren't designed at the network level. Find the bright spot, extract the principle, let the people in the room help make it.", "why": "Kruti's whole job is taking what works across campuses. This was one of your five best answers at the onsite.", "keys": "network central office systems school level consistency bright spot designed implement fidelity", "label": "9 &middot; How do network systems actually work for the people in schools?", "hook": "aren't designed at the network level / follow the bright spot / the people in this room", "tests": "Whether he builds with schools or at them.", "target": "75 seconds", "land": "Even if you don't agree with it, you at least know your opinion was heard.", "avoid": "A central-office framework speech. Criticizing Zeta's current systems.", "answer": "<p><span class=\"dcue flat\">plain, first sentence</span> <b>\"Well, it's simple. They aren't designed at the network level.\"</b></p><p>\"I'm not saying that to be glib\" · \"what's working at one school\" · \"what are the attributes of that that make it work\" · \"let's limit the scope, let's follow the bright spot\"</p><p><span class=\"dcue power\">land this</span> \"The policy might be made in this room, but the people in this room are the operations directors themselves — because then, even if you don't agree with it, you at least know your opinion was heard.\" <span class=\"dcue stop\">STOP</span></p><p class=\"small\">Your words: School in the Square onsite 090826, as quoted in the DEBRIEF and THE INTERVIEW REWRITTEN (secondary; the raw recording is on your Mac). For Zeta, \"operations directors\" becomes principals.</p>", "receipts": ["(2) 28 REGIONS, 48 HIGH SCHOOLS, NO MANDATE"], "stop": "Stop on \"your opinion was heard.\"", "type": "core"}, {"id": "inherit", "grp": "Q", "short": "A system you inherited that wasn't working", "label": "A system you inherited that wasn't working. How did you fix the root cause?", "hook": "assess the principal / student behavior is adult behavior / connect and correct / the 30-second video", "keys": "inherited system broken root cause culture demerit consequences connect correct collegiate principal video", "core": "Frame: saw the problem, agreed on it, named small actions, built on the momentum.", "why": "A principal-development story in your words, from the School in the Square round.", "tests": "", "target": "2 minutes", "land": "Frame: ends on the 30-second video the principal sent to everybody.", "avoid": "\"I'm happy to talk more specifically about something maybe more operational.\" Naming the principal.", "answer": "<p>I was brought down to, as a consultant, I was brought down to Collegiate Academies. You know, spoiler alert, I went and worked there full time for Five years after this consulting arrangement. So this is a story of like most of my work as a consultant and then later as chief culture officer. But I was brought down as a last ditch effort to assess whether or not the principal could be successful. They'd tried everything and things just weren't working.</p><p>And what we saw was was that teachers were not being in any way like human or real or authentic and really being quite rude, frankly, to students. And I think they were very frustrated and the students were returning in kind. And so, We inherited this like ineffective demerit system with a bunch of mindsets from teachers that they were showing this negative controller mindset. The way we went about fixing that was one, I went around with people individually and use guiding questions to get them to analyze the effectiveness of teacher interactions. and really put themselves in the shoes of the student who's being talked to. That way and asking them questions about like how will they respond, how did that come off. And I got them to see that like student behavior was very much a function of adult behavior. So we saw the problem, we agreed on the problem. That's the first step for me, then it changed management process. After we get a working hypothesis, we need to make sure that a dedicated group of people see the problem. Once people saw the problem, we then needed to direct them into a very concrete way to make change, right? Let's say I go to the doctor, I get told I need to get my heart health in order, so I'm woken up. Okay, great, but what do I do? Is it walking 10,000 steps a day? Is it lifting weights? So here's what we needed to do is because we can't just say like, be more human, What we did is we established three different techniques that teachers were going to do. The most, the one that's the stickiest was Connect and correct, which was the first thing you say to a student just simply cannot be a correction. It has to be a connection.</p><p><span class=\"dcue power\">land this</span> We built on the momentum. People saw the small wins. And then we were able to generate a positive flywheel. We took videos of people doing the better version. We shared it around. We got the conversation going. We were walking around with the principal. He would take a 30 second video, email it to everybody and say, <b>comment one word</b>. what this video makes you think. <span class=\"dcue stop\">STOP</span></p><p class=\"small\">Your words: School in the Square round 082426. Cut: the doctor analogy and the Monday-morning example.</p>", "stop": "Stop on the video.", "type": "core", "receipts": []}, {"id": "accountable", "grp": "Q", "short": "Relationships and accountability", "label": "How do you hold a leader accountable and keep the relationship?", "hook": "false choice / clarity up front / curious question / say good morning", "keys": "accountability relationships hard conversation hold accountable feedback manage leader support evaluation hat", "core": "\"It's a false choice between high expectations and high levels of accountability.\"", "why": "Zeta says \"love your people.\" This is how you hold the bar and love the person.", "tests": "", "target": "75 seconds", "land": "\"There's nothing nice and friendly about me thinking one thing behind your back and not saying it to you.\"", "avoid": "\"I used to hesitate a lot around accountability\" as the ending.", "answer": "<p>We recognize that <b>it's a false choice between high expectations and high levels of accountability</b>. We recognize that it's a false choice between doing right by kids and doing right by staff. Obviously, like when we started getting into those, Zero-sum games where we're talking about Either or, we're recognizing that it's We're all on the same team and it's a both/and. And so what that looks like to me is Clarity up front such that I can I can assume the best. when I'm holding someone accountable and I lead with a curious question, But I also don't then shy away from because we have the clarity, because we've inquired to find out what the context is. And I have strong interpersonal relationships. I don't have to shy away from the context. But hey, Simon, here's where the impact of what, you know, understand, and that makes a lot of sense. I appreciate you sharing, but... We also need to find a way to get around this for next time because here was the impact. And so It's both a... It both means we say good morning and we care about each other at like a very human level, but it also means that we know that we can use that in driving each other to be the people that we signed up to be and that are our kids want us to be and that we frankly have promised our parents that we will be.</p><p>Onsite 090826, debrief-quoted: \"We build the relationship by having the hard conversation, and that's the way in which people really know where they stand.\" · \"There's nothing nice and friendly about me thinking one thing behind your back and not saying it to you.\" · \"Hey, we talked about the calendar going out last week. I didn't get it. What can you tell me about that?\" <span class=\"dcue stop\">STOP</span></p><p class=\"small\">Your words: School in the Square screen 082126; onsite 090826 (secondary).</p>", "stop": "Stop.", "type": "core", "receipts": []}, {"id": "ambiguity", "grp": "Q", "short": "Ambiguity: the four-day COVID playbook", "label": "A time with a big goal, total ambiguity and full autonomy.", "hook": "four days / gather, paper, leadership team, staff / paper is worthless if it does not reach people", "keys": "ambiguity autonomy covid crisis reopening playbook four days remote school", "core": "Frame: spring readiness planning condensed into four days.", "why": "Good for launch or crisis questions. Kruti has three first-year campuses.", "tests": "", "target": "90 seconds", "land": "\"having the answer only on paper is next to worthless if it doesn't actually get to the people.\"", "avoid": "\"This is not a question I prepared for.\" A student or staff count (the one you gave DREAM does not match the Brooklyn Lab file).", "answer": "<p>I effectively did a version of My strong start spring readiness planning, I condensed it to about four days. And so it was day one, gather all the information. A lot of this is coming in piecemeal from different sources, but also from the people and really understanding, because so much of this was an emotional issue as much as it was a scientific issue, as much as it was a logistical issue.</p><p>Day two began the work of Getting as many answers as possible on paper so that on day three I could bring this to the leadership team and say this is our new playbook. We're opening a fully remote school. We're staying open brick and mortar for every student who wants to come in …</p><p><span class=\"dcue power\">land this</span> And recognizing that You both have to have the answer on paper. But <b>having the answer only on paper is next to worthless</b> if it doesn't actually get to the people. And nothing that gets to the people is going to matter if The fundamental premise is this is being done to us or like they don't get it or they haven't heard me or I haven't had a chance to make my voice heard. <span class=\"dcue stop\">STOP</span></p><p class=\"small\">Your words: DREAM screen 081726. Cut: the opening disclaimer and the org size.</p>", "stop": "Stop.", "type": "core", "receipts": []}];

var HTML = {"now": "<div class=\"card\"><div class=\"lab\">Tuesday 092926 &middot; 3:00-3:30 PM ET &middot; thirty minutes, two people</div>\n<div class=\"ans\"><p><b>Paola Zalkind</b>, Chief Schooling Officer, and <b>Kruti Mehta</b>, Managing Director, Scaling School Excellence. Zoom: <b>us06web.zoom.us/my/krutiatzeta</b>.</p>\n<p>The ops seat is closed. Felipe passed you to the schooling side, and Dan's first question was about managing principals. The live seat is almost certainly <b>Principal Manager</b>.</p>\n<p>Dress: business casual, collar. It applies on Zoom.</p></div></div>\n<div class=\"card\"><div class=\"lab\">The four things that decide this call</div><div class=\"ans\">\n<p><b>1.</b> First sentence is the claim. Last sentence is a person or a number.</p>\n<p><b>2.</b> Every principal answer ends on proof: Carver, Brooklyn Lab interim, the 46%. With Dan, 1 of 5 answers did.</p>\n<p><b>3.</b> MUST-ASK 1 by minute 10. With Dan you asked nothing until time was up.</p>\n<p><b>4.</b> Two minutes, then stop. Two of them, thirty minutes.</p></div></div>\n<div class=\"card prepOnly\"><div class=\"lab\">What the Dan call cost (debrief 092526)</div><div class=\"ans\">\n<p>Execution B-, outcome B+/A-. Background ran about 5&frac34; minutes against 2:35. Carver came out as \"we were able to be successful in that.\" You graded KIPP and AF \"B minus to C minus\" out loud. You gave the health reason for leaving Excel. \"The rest of the mess\" to a ten-year Success principal. The close sounded offhand: \"blah, blah, blah.\"</p></div></div>", "open": "<div class=\"card\"><div class=\"lab\">The running order</div><div class=\"ans\">\n<p><b>0-1</b> &middot; Warm open. Thank them for the time. If Paola is warm, TFA is an easy line at the end, not now.</p>\n<p><b>1-4</b> &middot; Background walk, card 1. 2:35. Skip the kids paragraph.</p>\n<p><b>By minute 10</b> &middot; <b>MUST-ASK 1</b>, card 17: has this role existed, and what made that person successful.</p>\n<p><b>Paola's turn</b> &middot; cards 3-5. Every one ends on Carver or Brooklyn Lab.</p>\n<p><b>Kruti's turn</b> &middot; cards 8-12. Earn it, paired with investing in people. Card 9 if it's about network systems.</p>\n<p><b>Minute 20</b> &middot; card 18. One question each, then the next step.</p></div></div>", "hs": "<div class=\"card\"><div class=\"lab\">Their high school, say-able</div><div class=\"ans\">\n<p><b>Opened August 2026</b> in an interim Washington Heights site, <b>119 ninth graders</b> from Zeta's own first class. <span class=\"small\">Sources: Zeta research 092826; CALL PREP Dan Rojas</span></p>\n<p>Design shown to Community Board 12, March 2026: <b>Z pods</b> of about 12 students who stay together, four <b>Z houses</b>, portfolios, AP required to graduate, SAT prep in school, a ZLab. <span class=\"small\">Source: Zeta research 092826 (search excerpts)</span></p>\n<p>From Dan: about <b>91%</b> of high school students stay year to year. His worry is college admissions: a strong student with one C in ninth grade got into no Ivy. The redemption-arc essay has stopped working. ZLab is \"our fifth core.\" There is a taekwondo team. <span class=\"small\">Source: Rojas debrief 092526 &sect;6</span></p>\n<p><span class=\"dcue stop\">never</span> A Zeta attrition or proficiency number. The NYPD episode. The 181st St opposition.</p></div></div>\n<div class=\"card\"><div class=\"lab\">The link nobody else will make (frame, not words)</div><div class=\"ans\">\n<p>Dan's fear is the ninth-grade C that follows a kid forever. Your KIPP work was ninth-grade grades, weekly, across 48 high schools: 46% at a 3.0 or better, up six points. Z pods are the structure; a weekly ninth-grade academic health routine is what protects it. Your words for that are on card 10 (\"present but obscured, to right in front of them\").</p></div></div>\n<div class=\"card\"><div class=\"lab\">Your high school record, said plainly</div><div class=\"ans\">\n<p><b>Collegiate Academies:</b> high school network, five years as Chief Culture Officer. One of our schools, Carver, had the largest CREDO effect size in the country.</p>\n<p><b>Brooklyn Lab:</b> interim high school principal for half a year, while superintendent.</p>\n<p><b>KIPP:</b> national high school strategy, 48 high schools. 46% of ninth graders at 3.0+, up six.</p>\n<p><b>Carver:</b> 200 students when you walked in, eight or nine hundred now. Jerel is the CEO.</p>\n<p><b>Excel:</b> its high school is in the top 3% of public high schools nationally.</p></div></div>", "repairs": "<div class=\"card\"><div class=\"lab\">Repair 1 &middot; Carver, reduced to \"successful\"</div><div class=\"ans\">\n<p>Say the whole thing, live. Your line (060925): <em>\"Jerel received Louisiana state's Principal of the Year in our fourth year together and is now CEO of Collegiate Academies.\"</em> Card 4.</p></div></div>\n<div class=\"card\"><div class=\"lab\">Repair 2 &middot; Principles with no proof</div><div class=\"ans\">\n<p>Card 3 now ends on Carver. Any principal answer that ends on a principle is not over.</p></div></div>\n<div class=\"card\"><div class=\"lab\">Repair 3 &middot; \"Earn it\" heard alone</div><div class=\"ans\">\n<p>\"Earn that\" landed with Dan, and about 15 minutes later he gave a speech on \"you have to love people.\" In plain words, earn it means: a new principal runs the proven play until the school is stable and functional, then gets room to change it. Say it, then Carver or the associate dean, so they hear the investment too.</p></div></div>\n<div class=\"card\"><div class=\"lab\">Repair 4 &middot; Grading KIPP and AF</div><div class=\"ans\">\n<p>Describe how KIPP works, never its results. The Excel contrast makes the point alone. Your line: <em>\"So fundamentally, we were clear on who we were.\"</em></p></div></div>\n<div class=\"card\"><div class=\"lab\">Repair 5 &middot; Leaving Excel</div><div class=\"ans\">\n<p>Never the health reason. The approved form: you knew you would be leaving at the end of the year. Your onsite line: <em>\"I learned I had to leave.\"</em></p></div></div>\n<div class=\"card\"><div class=\"lab\">Repair 6 &middot; The questions</div><div class=\"ans\">\n<p>Ask by minute 10. Then ask, and be silent. Do not answer your own question.</p></div></div>", "numbers": "<div class=\"card\"><div class=\"lab\">Every number, with its source. Never say one that is not on this card.</div><div class=\"ans\">\n<p><b>Excel:</b> 270th to #1 in Massachusetts &middot; National Charter School of the Year &middot; Dean of Students &middot; 40% of staff reported to you &middot; six days on the playbook &middot; HS top 3% nationally. <span class=\"small\">Sources: bank blocks 1, 3</span></p>\n<p><b>Consulting:</b> over 100 schools &middot; fourteen years. <span class=\"small\">Source: bank block 1</span></p>\n<p><b>Collegiate:</b> 5 years CCO &middot; Carver: largest CREDO effect size in the country &middot; seven-level special education continuum &middot; suspension drop is <b>network-wide</b> only. <span class=\"small\">Sources: bank block 1; ONE STORY 091326; your ruling 092826</span></p>\n<p><b>Carver:</b> 200 to eight or nine hundred students &middot; Jerel is the CEO. <span class=\"small\">Source: bank block 4</span></p>\n<p><b>Brooklyn Lab:</b> superintendent for a transitional period &middot; 3 principals and the C-level team (CEO and CFO co-managed) &middot; interim HS principal, half a year &middot; two simultaneous renewals, three-year terms, both reauthorized, Board of Regents. <span class=\"small\">Sources: bank blocks 1, 5; ONE STORY 091326; fact check 092826</span></p>\n<p><b>KIPP:</b> 28 regions &middot; 48 high schools &middot; all adopted the HS strategy, no school took the alternate path &middot; 46% of 9th graders at 3.0+, up 6, best quarter KIPP had had &middot; 20 schools hit the goal &middot; the tool was piloted and handed off. <span class=\"small\">Source: bank block 2 as dictated; your rulings 092826</span></p>\n<p><b>Coverage  Lab for half a year. <span class=\"dcue flat\">flat, no apology</span> Then card 12's first line: \"Yes and no.\" <span class=\"dcue stop\">stop</span></p></div></div>", "intel": "<div class=\"card\"><div class=\"lab\">From the Dan call 092526 (debrief &sect;6)</div><div class=\"ans\">\n<p>The ops seat is closed; Felipe made the call. Zeta moves people between teams rather than letting them go. \"You have to love people\": kids, parents (\"most especially the ones that are most challenging\"), and staff. \"The requirement of the manager is a lot higher.\" Dan oversees many principals and designed the high school. He said \"I love that idea\" about the 50/25/25 audit. \"We will be in touch very soon.\"</p></div></div>\n<div class=\"card\"><div class=\"lab\">What Zeta is doing now</div><div class=\"ans\">\n<p>Tremont Park opened Sept 17, 2026. Queens Flushing opened August 2026. The high school opened August 2026. Z Combinator, a federal grant for charter founders. <span class=\"small\">Source: research 092826, LIKELY on counts</span></p></div></div>\n<div class=\"card prepOnly\"><div class=\"lab\">Connection points, light touch</div><div class=\"ans\">\n<p>Paola was at KIPP New Jersey; you were at the KIPP Foundation. Don't name anyone you haven't checked. Paola is a TFA alum and the TFA 35th Summit is this Friday and Saturday: an easy line at the end. Kruti left consulting for Zeta; you went consulting to operator (bench card).</p></div></div>\n<div class=\"card prepOnly\"><div class=\"lab\">Know it, don't raise it</div><div class=\"ans\">\n<p>The NYPD episode. The 181st St community board fight. The Sept 2025 rally. Reported 2026 ELA dip. Listen if any of it surfaces. Never introduce it.</p></div></div>"};

var ENGINES=[{"sid": "ENGINE 1", "name": "NO MANDATE, NO SCHOOL TOOK THE ALTERNATE PATH", "one": "Nobody had to say yes to what we were doing, so we had to use influence and the quality of our ideas to get them to want to say yes.", "proves": "Adoption without authority: how a network office gets principals to use what works. Kruti's whole job.", "full": "the KIPP Foundation is the national arm. Strategy, support and oversight. But it doesn't have mandate authority. Twenty-eight independent regions, which you can think of as twenty-eight independent districts, and forty-eight high schools. Nobody had to say yes to what we were doing, so we had to use influence and the quality of our ideas to get them to want to say yes. <span class=\"dcue slow\">slow</span> First thing we did was we made the change theirs. Every single region was part of our listening tours, part of our iterative feedback, part of our working groups, so that when we announced what the strategy was, I was looking at people in the eye, watching them nod. <span class=\"dcue power\">land this</span> All 28 regions and all 48 high schools adopted the strategy. There was an alternate path, and no school chose that alternate path.", "guards": "Strategy adoption is 28 and 48. The push-button tool was PILOTED and handed off, never \"used by all 28.\" You SUPPORTED 48 high schools; never \"managed 48 principals.\" Never grade KIPP.", "bends": [["What's hard about the high school", "Lead with ninth-grade academic health.", "That year, 46% of ninth graders across all 48 high schools finished the quarter at a 3.0 or better. Up six points."], ["How do you lead change", "Lead with the one thing.", "The first part is the most important part: figure out the one thing we're going after to know if we're on track."], ["A principal won't use the system", "Lead with merit over obligation.", "Building systems and structures and practices that people buy into on merit, not out of obligation."], ["A strong principal pushes he play is going to evolve. You're going to be part of that evolution."], ["Why do networks plateau", "Lead with identity, not the KIPP grade.", "So fundamentally, we were clear on who we were."], ["How does that square with loving your people", "Lead with Carver.", "The most, the one that's the stickiest was Connect and correct, which was the first thing you say to a student just simply cannot be a correction. It has to be a connection."]]}, {"sid": "ENGINE 3", "name": "CARVER", "one": "do we keep this leader, can he be successful?", "proves": "He can tell a hard truth about a struggling principal and grow him into the top seat. Paola's whole job.", "full": "I first started working with Jerel Bryant as a consultant. Jerel was the founding principal of Collegiate Academies Carver High School, then in its third year. He was (and still is) a really compelling and charismatic leader. At the time, his school was really struggling with academic results, student culture and community relations. I was tasked with answering the question: do we keep this leader, can he be successful? <span class=\"dcue slow\">slow</span> I did this by primarily working shoulder to shoulder with him and giving him incredibly high doses of real time feedback - primarily affirming feedback that empowered him and built his confidence <span class=\"dcue beat\">beat</span> I clearly named that this frayed relationship needed to be reset and helped them come into alignment, focusing them on results and impact rather than narratives of blame. <span class=\"dcue power\">land this</span> Jerel received Louisiana state's Principal of the Year in our fourth year together and is now CEO of Collegiate Academies.", "guards": "It started as an assessment. Coached, never led. Louisiana Principal of the Year (your wording, kept 092826). The 75% suspension drop is Collegiate network-wide, never Carver alone. CREDO: \"One of our schools, Carver, had the largest CREDO effect size in the country.\"", "bends": [["         document.querySelectorAll('.qcard.open').forEach(function(o){o.classList.remove('open')});
      n.classList.add('open'); }
    n.scrollIntoView({behavior:'smooth',block:'center'});
    n.classList.add('flash'); setTimeout(function(){n.classList.remove('flash')},1600);
  },60);
}
var qi=document.getElementById('q'),rb=document.getElementById('res');
qi.addEventListener('input',function(){
  var hits=searchDoc(this.value);
  if(!this.value.trim()||!hits.length){rb.classList.remove('on');rb.innerHTML='';return}
  rb.innerHTML=''; hits.forEach(function(h){
    var d=el('<div>'+h.head+'</div>'); d.onclick=function(){rb.classList.remove('on');qi.value='';jumpTo(h)};
    rb.appendChild(d)});
  rb.classList.add('on');
});

document.getElementById('livebtn').onclick=function(){
  var on=body.classList.toggle('live');
  this.classList.toggle('on',on);

  if(on&&!MANY){var o=document.querySelectorAll('.qcard.open');for(var i=1;i<o.length;i++)o[i].classList.remove('open')}
  window.scrollTo({top:0});
};

var tS=0,tI=null,ck=document.getElementById('clock');
function paint(){var m=Math.floor(tS/60),s=tS%60;
  ck.textContent=(m<10?'0':'')+m+':'+(s<10?'0':'')+s;
  ck.classList.toggle('warn',tS>=1200&&tS<1560); ck.classList.toggle('hot',tS>=1560)}
document.getElementById('go').onclick=function(){
  if(tI){clearInterval(tI);tI=null;this.textContent='Start'}
  else{tI=setInterval(function(){tS++;paint()},1000);this.textContent='Pause'}};
var nT=0;document.getElementById('plus').onclick=function(){nT++;document.getElementById('cnt').textContent=nT};
var hb=document.getElementById('hold'),hT=null;
hb.onclick=function(){if(hT)clearInterval(hT);var r=3;hb.className='run';hb.textContent='SILENCE '+r;
  hT=setInterval(function(){r--;if(r>0)hb.textContent='SILENCE '+r;
    else{clearInterval(hT);hT=null;hb.className='ok';hb.textContent='OK to talk';
      setTimeout(function(){hb.className='';hb.textContent='STOP - hold 3s'},2500)}},1000)};

var ti=0,tt=null,tb=document.getElementById('tick');
function tshow(){tb.textContent='-> '+TICK[ti%TICK.length]}
function tickNext(){ti++;tshow();clearInterval(tt);tt=setInterval(function(){ti++;tshow()},45000)}
tb.onclick=tickNext; tshow(); tt=setInterval(function(){ti++;tshow()},45000);

var pIdx=-1,pSec=0,pTick=null,pLog=load('plog',[]);
function fmt(s){return Math.floor(s/60)+':'+(s%60<10?'0':'')+(s%60)}
document.getElementById('practice').innerHTML=
 '<div class="card"><div class="lab">Drill</div><div id="pQ" style="font-size:18px;font-weight:700">Tap start.</div>'+
 '<div class="small" id="pTarget"></div><div style="font-size:30px;font-weight:700;margin:9px 0" id="pTimer">0:00</div>'+
 '<button id="pMainBtn">Start drill</button> <button id="pSkip">Skip</button>'+
 '<div id="pRevealBox" style="margin-top:12px"></div></div>'+
 '<div class="card"><div class="lab">Rep log</div><div id="pLogBox"></div>'+
 '<button id="pClear" style="margin-top:9px">Clear the log</button></div>';
function pRender(){var b=document.getElementById('pLogBox');b.innerHTML=pLog.length?'':'<div>No reps yet.</div>';
  pLog.forEach(function(l){b.appendChild(el('<div>'+l+'</div>'))})}
function pNext(){pIdx=(pIdx+1)%Q.length;var x=Q[pIdx];
  document.getElementById('pQ').textContent=x.label;
  document.getElementById('pTarget').textContent='Out loud. Target '+(x.target||'60 seconds')+'.';
  document.getElementById('pRevealBox').innerHTML='';pSec=0;
  document.getElementById('pTimer').textContent='0:00';
  document.getElementById('pMainBtn').textContent='Start drill'}
function pReveal(){var x=Q[pIdx],t=fmt(pSec);
  document.getElementById('pRevealBox').innerHTML=
    '<div class="box land"><b>Landing</b>'+x.land+'</div><div class="box avoid"><b>Do not</b>'+x.avoid+'</div>'+
    '<div class="lab" style="margin-top:12px">Score this rep</div><div class="score" id="pScore">'+
    '<button data-v="Landed">Landed</button> <button data-v="Long">Long</button> '+
    '<button data-v="Wobbled">Wobbled</button></div><div class="ans" style="margin-top:11px">'+x.answer+'</div>';
  var entry=x.label.slice(0,42)+' - '+t; pLog.unshift(entry);save('plog',pLog);pRender();
  document.getElementById('pScore').onclick=function(e){var b=e.target.closest('button');if(!b)return;
    [].forEach.call(this.children,function(c){c.classList&&c.classList.remove('on')});
    b.classList.add('on');pLog[0]=entry+' - '+b.dataset.v;save('plog',pLog);pRender()}}
document.getElementById('pMainBtn').onclick=function(){
  if(pTick){clearInterval(pTick);pTick=null;this.textContent='Next question';pReveal();return}
  if(this.textContent==='Next question'||pIdx<0){pNext();return}
  pSec=0;pTick=setInterval(function(){pSec++;document.getElementById('pTimer').textContent=fmt(pSec)},1000);
  this.textContent='Stop and reveal'};
document.getElementById('pSkip').onclick=function(){if(pTick){clearInterval(pTick);pTick=null}pNext()};
document.getElementById('pClear').onclick=function(){pLog=[];save('plog',pLog);pRender()};
pRender();

document.addEventListener('keydown',function(e){
  if(e.target===qi){if(e.key==='Escape'){qi.value='';rb.classList.remove('on');qi.blur()}return}
  if(e.key==='/'){e.preventDefault();qi.focus()}
  if(e.key>='1'&&e.key<='9'){var s=SECTIONS[+e.key-1];if(s)showSec(s.id)}
  if(e.key==='l'||e.key==='L')document.getElementById('livebtn').click();
});

function coachCard(){
  var c=document.querySelector('.qcard.open');

}
