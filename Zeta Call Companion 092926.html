var HTML = {"now": "<div class=\"card\"><div class=\"lab\">Tuesday 092926 &middot; 3:00-3:30 PM ET &middot; thirty minutes, two people</div>\n<div class=\"ans\"><p><b>Paola Zalkind</b>, Chief Schooling Officer, and <b>Kruti Mehta</b>, Managing Director, Scaling School Excellence. Zoom: <b>us06web.zoom.us/my/krutiatzeta</b>.</p>\n<p>The ops seat is closed. Felipe passed you to the schooling side, and Dan's first question was about managing principals. The live seat is almost certainly <b>Principal Manager</b>.</p>\n<p>Dress: business casual, collar. It applies on Zoom.</p></div></div>\n<div class=\"card\"><div class=\"lab\">The four things that decide this call</div><div class=\"ans\">\n<p><b>1.</b> First sentence is the claim. Last sentence is a person or a number.</p>\n<p><b>2.</b> Every principal answer ends on proof: Carver, Brooklyn Lab interim, the 46%. With Dan, 1 of 5 answers did.</p>\n<p><b>3.</b> MUST-ASK 1 by minute 10. With Dan you asked nothing until time was up.</p>\n<p><b>4.</b> Two minutes, then stop. Two of them, thirty minutes.</p></div></div>\n<div class=\"card prepOnly\"><div class=\"lab\">What the Dan call cost (debrief 092526)</div><div class=\"ans\">\n<p>Execution B-, outcome B+/A-. Background ran about 5&frac34; minutes against 2:35. Carver came out as \"we were able to be successful in that.\" You graded KIPP and AF \"B minus to C minus\" out loud. You gave the health reason for leaving Excel. \"The rest of the mess\" to a ten-year Success principal. The close sounded offhand: \"blah, blah, blah.\"</p></div></div>", "open": "<div class=\"card\"><div class=\"lab\">The running order</div><div class=\"ans\">\n<p><b>0-1</b> &middot; Warm open. Thank them for the time. If Paola is warm, TFA is an easy line at the end, not now.</p>\n<p><b>1-4</b> &middot; Background walk, card 1. 2:35. Skip the kids paragraph.</p>\n<p><b>By minute 10</b> &middot; <b>MUST-ASK 1</b>, card 16: which role, and success at twelve months.</p>\n<p><b>Paola's turn</b> &middot; cards 3-5. Every one ends on Carver or Brooklyn Lab.</p>\n<p><b>Kruti's turn</b> &middot; cards 8-11. Earn it, paired with investing in people.</p>\n<p><b>Minute 20</b> &middot; card 17. One question each, then the next step.</p></div></div>", "hs": "<div class=\"card\"><div class=\"lab\">Their high school, say-able</div><div class=\"ans\">\n<p><b>Opened August 2026</b> in an interim Washington Heights site, <b>119 ninth graders</b> from Zeta's own first class. <span class=\"small\">Sources: Zeta research 092826; CALL PREP Dan Rojas</span></p>\n<p>Design shown to Community Board 12, March 2026: <b>Z pods</b> of about 12 students who stay together, four <b>Z houses</b>, portfolios, AP required to graduate, SAT prep in school, a ZLab. <span class=\"small\">Source: Zeta research 092826 (search excerpts)</span></p>\n<p>From Dan: about <b>91%</b> of high school students stay year to year. His worry is college admissions: a strong student with one C in ninth grade got into no Ivy. The redemption-arc essay has stopped working. ZLab is \"our fifth core.\" There is a taekwondo team. <span class=\"small\">Source: Rojas debrief 092526 &sect;6</span></p>\n<p><span class=\"dcue stop\">never</span> A Zeta attrition or proficiency number. The NYPD episode. The 181st St opposition.</p></div></div>\n<div class=\"card\"><div class=\"lab\">The link nobody else will make (frame, not words)</div><div class=\"ans\">\n<p>Dan's fear is the ninth-grade C that follows a kid forever. Your KIPP work was ninth-grade grades, weekly, across 48 high schools: 46% at a 3.0 or better, up six points. Z pods are the structure; a weekly ninth-grade academic health routine is what protects it. Your words for that are on card 10 (\"present but obscured, to right in front of them\").</p></div></div>\n<div class=\"card\"><div class=\"lab\">Your high school record, said plainly</div><div class=\"ans\">\n<p><b>Collegiate Academies:</b> high school network, largest CREDO effect size of any high school in the country, five years as Chief Culture Officer.</p>\n<p><b>Brooklyn Lab:</b> interim high school principal for half a year, while superintendent.</p>\n<p><b>KIPP:</b> national high school strategy, 48 high schools. 46% of ninth graders at 3.0+, up six.</p>\n<p><b>Carver:</b> 200 students when you walked in, eight or nine hundred now. Jerel is the CEO.</p>\n<p><b>Excel:</b> its high school is in the top 3% of public high schools nationally.</p></div></div>", "repairs": "<div class=\"card\"><div class=\"lab\">Repair 1 &middot; Carver, reduced to \"successful\"</div><div class=\"ans\">\n<p>Say the whole thing, live. Your line: <em>\"The best example is Carver, and the principal I was brought in to assess is now the CEO.\"</em> Card 4.</p></div></div>\n<div class=\"card\"><div class=\"lab\">Repair 2 &middot; Principles with no proof</div><div class=\"ans\">\n<p>Card 3 now ends on Carver. Any principal answer that ends on a principle is not over.</p></div></div>\n<div class=\"card\"><div class=\"lab\">Repair 3 &middot; \"Earn it\" heard alone</div><div class=\"ans\">\n<p>\"Earn that\" landed with Dan, and about 15 minutes later he gave a speech on \"you have to love people.\" In plain words, earn it means: a new principal runs the proven play until the school is stable and functional, then gets room to change it. Say it, then Carver or the associate dean, so they hear the investment too.</p></div></div>\n<div class=\"card\"><div class=\"lab\">Repair 4 &middot; Grading KIPP and AF</div><div class=\"ans\">\n<p>Describe how KIPP works, never its results. The Excel contrast makes the point alone. Your line: <em>\"So fundamentally, we were clear on who we were.\"</em></p></div></div>\n<div class=\"card\"><div class=\"lab\">Repair 5 &middot; Leaving Excel</div><div class=\"ans\">\n<p>Never the health reason. The approved form: you knew you would be leaving at the end of the year. Your bank line: <em>\"Then I learned I had to leave.\"</em></p></div></div>\n<div class=\"card\"><div class=\"lab\">Repair 6 &middot; The questions</div><div class=\"ans\">\n<p>Ask by minute 10. Then ask, and be silent. Do not answer your own question.</p></div></div>", "numbers": "<div class=\"card\"><div class=\"lab\">Every number, with its source. Never say one that is not on this card.</div><div class=\"ans\">\n<p><b>Excel:</b> 270th to #1 in Massachusetts &middot; National Charter School of the Year &middot; Dean of Students &middot; 40% of staff reported to you &middot; six days on the playbook &middot; HS top 3% nationally. <span class=\"small\">Sources: bank blocks 1, 3</span></p>\n<p><b>Consulting:</b> over 100 schools &middot; fourteen years. <span class=\"small\">Source: bank block 1</span></p>\n<p><b>Collegiate:</b> 5 years CCO &middot; largest CREDO effect size of any HS in the country &middot; suspension drop is <b>network-wide</b> only. <span class=\"small\">Sources: bank blocks 1, 10; verified-facts</span></p>\n<p><b>Carver:</b> 200 to eight or nine hundred students &middot; Jerel is the CEO. <span class=\"small\">Source: bank block 4</span></p>\n<p><b>Brooklyn Lab:</b> superintendent just over a year &middot; managed 3 principals and the C-level team &middot; interim HS principal, half a year &middot; both charters reauthorized. <span class=\"small\">Sources: bank blocks 1, 5; PRINCIPAL MANAGER TRACK L1254</span></p>\n<p><b>KIPP:</b> 28 regions &middot; 48 high schools &middot; 46% of 9th graders at 3.0+, up 6, third quarter &middot; no school took the alternate path. <span class=\"small\">Source: bank block 2</span></p>\n<p><b>Coverage schedule maker:</b> two schools' master schedules &middot; installed at one &middot; your estimate two to three hours a week. <span class=\"small\">Source: bank block 8</span></p>\n<p><b>Zeta:</b> high school 119 ninth graders &middot; 91% HS retention (Dan). <span class=\"small\">Sources: research 092826; Rojas debrief</span></p>\n<p><b>Principal Manager band:</b> $125K-$175K &middot; 425 Westchester Ave, daily. Never raise. <span class=\"small\">Source: Rojas debrief &sect;0</span></p></div></div>", "room": "<div class=\"card\"><div class=\"lab\">Paola Zalkind &middot; Chief Schooling Officer</div><div class=\"ans\">\n<p>Her Zeta bio: she \"manages Zeta's school leaders.\" TFA corps (5th grade). Success Academy from about 2006: teacher, AP, founding principal of SA Union Square (2013), then Managing Director of Schools. Then Director of Leader Development at <b>KIPP New Jersey</b>. At Zeta, Managing Director of Academics, now CSO. M.A., Teachers College.</p>\n<p><b>What she is screening for:</b> has he actually managed principals, can he grow one, and does he show proof. She built principals for a living. She is the Principal Manager decision.</p>\n<p class=\"small\">Jessica Sie (CAO) owns curriculum, so Paola's lane is principals and school execution. LIKELY.</p></div></div>\n<div class=\"card\"><div class=\"lab\">Kruti Mehta &middot; Managing Director, Scaling School Excellence</div><div class=\"ans\">\n<p>UT Austin BBA, Accenture, then BCG. Joined Zeta in its second year: \"a complete leap of faith in myself when I left my consulting job.\" Network Operational Excellence, then Policy and Advancement, then Chicago Booth MBA (2024), now scaling. No school-leader history found.</p>\n<p><b>What she is screening for:</b> can he codify what works and get schools to adopt it with fidelity. She likely needs someone with school-leader credibility beside her. LIKELY.</p>\n<p class=\"small\">She is the host (her Zoom room). Use whatever title she uses.</p></div></div>\n<div class=\"card prepOnly\"><div class=\"lab\">Who's who</div><div class=\"ans\">\n<p>Emily Kim, Founder/CEO &middot; Paola Zalkind, CSO &middot; Jessica Sie, CAO &middot; Felipe Bustamante, COO Schools (passed you to this side) &middot; Dan Rojas, MD Schooling Excellence &middot; Gillian Clouser, talent, your advocate.</p></div></div>", "asks": "<div class=\"card\"><div class=\"lab\">MUST-ASK 1 by minute 10 <span class=\"dcue flat\">proposed, not yet your words</span></div><div class=\"ans\">\n<p>Which role they are considering you for, and what success looks like at twelve months.</p>\n<p class=\"small\">Your own form that worked with Dan (line 211): \"What, if anything, should I read into the fact that you and I are having a conversation on the school excellence side of things as opposed to operations?\"</p></div></div>\n<div class=\"card\"><div class=\"lab\">One for each, around minute 20 <span class=\"dcue flat\">proposed</span></div><div class=\"ans\">\n<p><b>Kruti:</b> with Flushing, Tremont Park and the high school all opening this fall, what has been hardest to keep consistent campus to campus?</p>\n<p><b>Paola:</b> for the 119 ninth graders in that first class, what does a great first year look like by June?</p>\n<p><b>Either:</b> what does the principal pipeline look like? Is Z Combinator feeding your own leaders?</p></div></div>\n<div class=\"card\"><div class=\"lab\">The next-step ask</div><div class=\"ans\">\n<p>The next step, and who else you would talk to. Dan's call ended without it.</p></div></div>", "close": "<div class=\"card\"><div class=\"lab\">The last two minutes</div><div class=\"ans\">\n<p><span class=\"dcue warm\">warm, at the camera</span> Thank them. <span class=\"dcue beat\">beat</span> Echo ONE thing each of them said, in their words. <span class=\"dcue beat\">beat</span></p>\n<p>Your words: <em>\"I wanna find the right group of people doing the right work more than anything.\"</em> <span class=\"small\">[Zeta screen 091126]</span></p>\n<p>Your words: <em>\"I love being in environments where it's like best idea wins, strong opinions, loosely held. Let's debate the heck out of things. Let's attack people's ideas without attacking people.\"</em> <span class=\"small\">[Dan call line 227]</span></p>\n<p><span class=\"dcue slow\">slow</span> The next step, and who else. <span class=\"dcue stop\">STOP</span></p>\n<p class=\"small\">Not \"blah, blah, blah. You know the story.\"</p></div></div>\n<div class=\"card\"><div class=\"lab\">After the call, same day</div><div class=\"ans\">\n<p>Thank-yous within two hours, separate threads, one specific thing each said. first.last@zetaschools.org is likely; check the invite.</p></div></div>", "traps": "<div class=\"card\"><div class=\"lab\">Banned strings. These are literal, not concepts.</div><div class=\"ans\">\n<p><span class=\"dcue stop\">never</span> The health reason for leaving Excel</p>\n<p><span class=\"dcue stop\">never</span> A grade for KIPP or AF (\"B minus to C minus\")</p>\n<p><span class=\"dcue stop\">never</span> \"The rest of the mess,\" or any Success comparison. Paola spent years at Success</p>\n<p><span class=\"dcue stop\">never</span> \"I don't care really if you as a first-year principal...\"</p>\n<p><span class=\"dcue stop\">never</span> A bare \"principal.\" It was <b>interim</b>, half a year, while superintendent</p>\n<p><span class=\"dcue stop\">never</span> The Brooklyn Lab removal decision in writing. Out loud only</p>\n<p><span class=\"dcue stop\">never</span> That the numbers you were shown at Brooklyn Lab were false</p>\n<p><span class=\"dcue stop\">never</span> \"Managed 48 principals.\" You supported 48 high schools. Never merge the 8 you coached at Collegiate PD with the 3 at Brooklyn Lab</p>\n<p><span class=\"dcue stop\">never</span> \"The tool is used by all 28.\" It was piloted and handed off</p>\n<p><span class=\"dcue stop\">never</span> Suspensions down 75% at Carver. It was network-wide</p>\n<p><span class=\"dcue stop\">never</span> \"Better part of a decade\" for consulting. It was fourteen years</p>\n<p><span class=\"dcue stop\">never</span> The kids, the commute, or pay, first</p>\n<p><span class=\"dcue stop\">never</span> A Zeta proficiency or attrition number, the NYPD episode, the 181st St fight</p></div></div>", "rp": "<div class=\"card\"><div class=\"lab\">How to use these</div><div class=\"ans\">\n<p>Three likely sequences. The follow-ups are frames; your answers point to cards with your words. <b>Say each out loud once.</b></p></div></div>\n<div class=\"card\"><div class=\"lab\">ROLE PLAY 1 &middot; Paola, then the push for proof</div><div class=\"ans\">\n<p><span class=\"rpq\">PAOLA</span> How do you develop a principal who's good but not great?</p>\n<p><span class=\"rpa\">YOU</span> Card 3, ending on Carver. <span class=\"dcue stop\">stop</span></p>\n<p><span class=\"rpq\">PAOLA</span> What did you actually do with him week to week?</p>\n<p><span class=\"rpa\">YOU</span> Card 4, the middle: the leadership-team presentation, \"Mom and Dad,\" connect and correct. <span class=\"dcue stop\">stop on \"Jerel is the CEO\"</span></p></div></div>\n<div class=\"card\"><div class=\"lab\">ROLE PLAY 2 &middot; Kruti, fidelity vs. autonomy</div><div class=\"ans\">\n<p><span class=\"rpq\">KRUTI</span> How do you decide what's non-negotiable when a principal wants to do it differently?</p>\n<p><span class=\"rpa\">YOU</span> Card 8, earn it. <span class=\"dcue power\">then</span> Engine 2, last bend: connect and correct.</p>\n<p><span class=\"rpq\">KRUTI</span> And when a school just isn't adopting it?</p>\n<p><span class=\"rpa\">YOU</span> Card 9, KIPP. End on \"no school chose it.\"</p></div></div>\n<div class=\"card\"><div class=\"lab\">ROLE PLAY 3 &middot; The doubt</div><div class=\"ans\">\n<p><span class=\"rpq\">PAOLA</span> You've never been a standing principal. Why should principals trust you?</p>\n<p><span class=\"rpa\">YOU</span> Card 5: two seats managing principals, and interim at Brooklyn Lab for half a year. <span class=\"dcue flat\">flat, no apology</span> Then card 12's first line: \"Yes and no.\" <span class=\"dcue stop\">stop</span></p></div></div>", "intel": "<div class=\"card\"><div class=\"lab\">From the Dan call 092526 (debrief &sect;6)</div><div class=\"ans\">\n<p>The ops seat is closed; Felipe made the call. Zeta moves people between teams rather than letting them go. \"You have to love people\": kids, parents (\"most especially the ones that are most challenging\"), and staff. \"The requirement of the manager is a lot higher.\" Dan oversees many principals and designed the high school. He said \"I love that idea\" about the 50/25/25 audit. \"We will be in touch very soon.\"</p></div></div>\n<div class=\"card\"><div class=\"lab\">What Zeta is doing now</div><div class=\"ans\">\n<p>Tremont Park opened Sept 17, 2026. Queens Flushing opened August 2026. The high school opened August 2026. Z Combinator, a federal grant for charter founders. <span class=\"small\">Source: research 092826, LIKELY on counts</span></p></div></div>\n<div class=\"card prepOnly\"><div class=\"lab\">Connection points, light touch</div><div class=\"ans\">\n<p>Paola was at KIPP New Jersey; you were at the KIPP Foundation. Don't name anyone you haven't checked. Paola is a TFA alum and the TFA 35th Summit is this Friday and Saturday: an easy line at the end. Kruti left consulting for Zeta; you went consulting to operator (bench card).</p></div></div>\n<div class=\"card prepOnly\"><div class=\"lab\">Know it, don't raise it</div><div class=\"ans\">\n<p>The NYPD episode. The 181st St community board fight. The Sept 2025 rally. Reported 2026 ELA dip. Listen if any of it surfaces. Never introduce it.</p></div></div>"};

var ENGINES=[{"sid": "ENGINE 1", "name": "NO MANDATE, NO SCHOOL TOOK THE ALTERNATE PATH", "one": "Nobody had to say yes, so we had to get them to want to say yes.", "proves": "Adoption without authority: how a network office gets principals to use what works. Kruti's whole job.", "full": "Mandate authority isn't what drives change, not at any organization that attracts this kind of talent. The idea has to earn its place on merit, not on positional authority. <span class=\"dcue slow\">slow</span> That was the situation at KIPP. The Foundation is the national strategy, support and oversight arm, but it has no mandate authority, and we had twenty-eight independent regions and forty-eight high schools. Nobody had to say yes, so we had to get them to want to say yes. … <span class=\"dcue power\">land this</span> All 28 regions and all 48 high schools adopted the strategy. There was an alternate path, and no school chose it.", "guards": "Strategy adoption is 28 and 48. The push-button tool was PILOTED and handed off, never \"used by all 28.\" You SUPPORTED 48 high schools; never \"managed 48 principals.\" Never grade KIPP.", "bends": [["What's hard about the high school", "Lead with ninth-grade academic health.", "In the third quarter, 46% of ninth graders across all 48 high schools finished at a 3.0 or better, up six points."], ["How do you lead change", "Lead with the one thing.", "I figure out the one thing we're going after, and then I build the systems and tools to go after it."], ["A principal won't use the system", "Lead with merit over obligation.", "Building systems and structures and practices that people buy into on merit, not out of obligation."], ["A strong principal pushes back", "Lead with your side of the street.", "The third thing is my side of the street needs to be totally clean above reproach."]]}, {"sid": "ENGINE 2", "name": "EARN IT: RUN THE PLAY, THEN INNOVATE", "one": "Earn that, right? Get to the place of stable, get to the place of functional, then let's have a conversation about innovation.", "proves": "In plain words: a new principal runs the proven playbook until the school is stable and functional, and that earns the room to change it. It is about sequence, not control. Pair it with how you invest in people (Dan's \"love people\" speech came about 15 minutes later).", "full": "Earn that, right? Get to the place of stable, get to the place of functional, then let's have a conversation about innovation. But for right now, we need to run the play because the play works. The play is not perfect. The play is going to evolve. You're going to be part of that evolution. But the way in which we grow with quality is starting from a solid foundation of what we know that works. <span class=\"dcue power\">then the proof</span> Its high school is in the top 3% of all public high schools nationally, and a student I had in sixth grade now has my job.", "guards": "Never \"I don't care really if you as a first-year principal...\" Never grade KIPP or AF. Jackie is sixth grade. Always pair with investment: Carver, the associate dean.", "bends": [["First ninety days, a new principal", "Lead with writing it down.", "I spent six days writing the playbook, my culture manual and my operations manual. My boss thought that was a crazy use of time."], ["A principal wants to do their own thing", "Lead with the evolution line.", "The play is not perfect. The play is going to evolve. You're going to be part of that evolution."], ["Why do networks plateau", "Lead with identity, not the KIPP grade.", "So fundamentally, we were clear on who we were."], ["How does that square with loving your people", "Lead with Carver.", "Don't let your first interaction with a human being be a correction."]]}, {"sid": "ENGINE 3", "name": "CARVER", "one": "The best example is Carver, and the principal I was brought in to assess is now the CEO.", "proves": "He can tell a hard truth about a struggling principal and grow him into the top seat. Paola's whole job.", "full": "Ben Marcovitz brought me to Carver for a two or three day trial, and it was clearly a big question on his mind whether this effort to support Jerel was going to last. <span class=\"dcue power\">land this</span> Jerel is one of the best I have ever seen at working with students, and we just weren't playing to his strengths. And the two of you are in a bad breakup. Nothing works until Mom and Dad get right. <span class=\"dcue beat\">beat</span> We fixed the smallest action first. I coined a phrase, connect and correct. Don't let your first interaction with a human being be a correction. <span class=\"dcue slow\">slow</span> Two hundred students when I walked in. Eight or nine hundred now, in a brand-new building. And Jerel is the CEO.", "guards": "It started as an assessment. Louisiana Principal of the Year is a fact, not in your recorded words; say it only if it comes naturally. The 75% suspension drop is network-wide, never Carver alone.", "bends": [["The good principal who needs to get to great", "Lead with clothes, not skin. Then Carver.", "Your identity as a principal is the clothes that you wear, not the skin that you're in."], ["Hard feedback", "Lead with the leadership-team presentation.", "Nothing works until Mom and Dad get right."], ["A principal is underwater", "Lead with strengths, not deficits.", "Jerel is one of the best I have ever seen at working with students, and we just weren't playing to his strengths."], ["Culture", "Lead with connect and correct.", "I coined a phrase, connect and correct. Don't let your first interaction with a human being be a correction."]]}];

        return '<div class="bend"><div class="bq">'+b[0]+'</div><div class="bl">'+b[1]+'</div>'+
               '<div class="bs">&ldquo;'+b[2]+'&rdquo;</div></div>'}).join('')+
    '</div>'}).join('')+
  '<div class="card"><div class="lab">The rest of the bank</div><div class="ans"><p>Referenced by the answer cards, not retold.</p></div></div>'+
  STORIES.map(function(s){
  return '<div class="card"><div class="lab"><span class="sid">'+s.sid+'</span> '+s.name+'</div>'+
    '<div class="box land"><b>What it proves</b>'+s.proves+'</div><div class="ans">'+s.full+'</div></div>'}).join('');
['now','open','hs','repairs','numbers','room','asks','close','rp','intel','traps'].forEach(function(k){
  if(HTML[k])document.getElementById(k).innerHTML=HTML[k]});
document.getElementById('deliver').innerHTML='<div class="card"><div class="lab">The physical layer</div><ol style="padding-left:20px">'+
  DELIVERY.map(function(d){return '<li style="margin-bottom:7px">'+d+'</li>'}).join('')+'</ol></div>'+
  '<div class="card"><div class="lab">Must say - tap when it lands</div><ul id="ms">'+
  MUST.map(function(m){return '<li class="must">'+m+'</li>'}).join('')+'</ul></div>'+
  '<div class="card"><div class="lab">Panic tap</div><div class="ans">'+PANIC.say+'</div>'+
  '<div class="small">'+PANIC.then+'</div></div>';
var msDone=load('ms',{});
document.querySelectorAll('#ms .must').forEach(function(li,i){
  if(msDone[i])li.classList.add('done');
  li.onclick=function(){li.classList.toggle('done');msDone[i]=li.classList.contains('done');save('ms',msDone)}});

var STOP=new Set(['the','a','an','and','or','of','to','in','is','it','for','on','with','that','this','you','your','how','what','do']);
function tok(t){return (t||'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(Boolean)}
var INDEX=[];
Q.forEach(function(x){INDEX.push({sec:'quest',id:'c-'+x.id,head:x.label,ht:tok(x.label+' '+(x.hook||'')+' '+(x.keys||'')),
  bt:tok((x.answer||'').replace(/<[^>]+>/g,' ')+' '+x.land+' '+x.avoid+' '+(x.stop||'')),card:true})});
SECTIONS.forEach(function(sc){ var h=HTML[sc.id]; if(!h)return;
  INDEX.push({sec:sc.id,id:null,head:sc.name,ht:tok(sc.name),bt:tok(h.replace(/<[^>]+>/g,' '))}); });
INDEX.push({sec:'deliver',id:null,head:'Delivery + must-say + panic',
  ht:tok('delivery must say panic stall breathe pace stop reminder checklist'),
  bt:tok(DELIVERY.join(' ')+' '+MUST.join(' ')+' '+PANIC.say+' '+PANIC.then)});
STORIES.forEach(function(s){INDEX.push({sec:'stories',id:null,head:s.name,ht:tok(s.name),bt:tok(s.proves+' '+s.full)})});
function scoreEntry(e,toks){var sc=0;toks.forEach(function(t){
  var ex=e.ht.indexOf(t)>-1, pre=e.ht.some(function(h){return h.indexOf(t)===0});
  if(ex)sc+=3; else if(pre)sc+=2;
  var n=e.bt.filter(function(b){return b===t}).length;
  sc+=Math.min(n,3); if(!n&&e.bt.some(function(b){return b.indexOf(t)===0}))sc+=1});return sc}
function searchDoc(qs){var t=tok(qs).filter(function(x){return x.length>1&&!STOP.has(x)});
  if(!t.length)return [];
  return INDEX.map(function(e){return{e:e,s:scoreEntry(e,t)}}).filter(function(x){return x.s>0})
    .sort(function(a,b){return b.s-a.s}).slice(0,5).map(function(x){return x.e})}
function jumpTo(e){
  showSec(e.sec);
  setTimeout(function(){
    var n=e.id?document.getElementById(e.id):document.getElementById(e.sec);
    if(!n)return;
    if(e.card){ if(body.classList.contains('live'))
        document.querySelectorAll('.qcard.open').forEach(function(o){o.classList.remove('open')});
      n.classList.add('open'); }
    n.scrollIntoView({behavior:'smooth',block:'center'});
    n.classList.add('flash'); setTimeout(function(){n.classList.remove('flash')},1600);
  },60);
}
var qi=document.getElementById('q'),rb=document.getElementById('res');
qi.addEventListener('input',function(){
  var hits=searchDoc(this.value);
  if(!this.value.trim()||!hits.length){rb.classList.remove('on');rb.innerHTML='';return}
  rb.innerHTML=''; hits.forEach(function(h){
    var d=el('<div>'+h.head+'</div>'); d.onclick=function(){rb.classList.remove('on');qi.value='';jumpTo(h)};
    rb.appendChild(d)});
  rb.classList.add('on');
});

document.getElementById('livebtn').onclick=function(){
  var on=body.classList.toggle('live');
  this.classList.toggle('on',on);
  this.textContent=on?'LIVE - tap for PREP':'PREP - tap for LIVE';
  if(on&&!MANY){var o=document.querySelectorAll('.qcard.open');for(var i=1;i<o.length;i++)o[i].classList.remove('open')}
  window.scrollTo({top:0});
};

var tS=0,tI=null,ck=document.getElementById('clock');
function paint(){var m=Math.floor(tS/60),s=tS%60;
  ck.textContent=(m<10?'0':'')+m+':'+(s<10?'0':'')+s;
  ck.classList.toggle('warn',tS>=1200&&tS<1560); ck.classList.toggle('hot',tS>=1560)}
document.getElementById('go').onclick=function(){
  if(tI){clearInterval(tI);tI=null;this.textContent='Start'}
  else{tI=setInterval(function(){tS++;paint()},1000);this.textContent='Pause'}};
var nT=0;document.getElementById('plus').onclick=function(){nT++;document.getElementById('cnt').textContent=nT};
var hb=document.getElementById('hold'),hT=null;
hb.onclick=function(){if(hT)clearInterval(hT);var r=3;hb.className='run';hb.textContent='SILENCE '+r;
  hT=setInterval(function(){r--;if(r>0)hb.textContent='SILENCE '+r;
    else{clearInterval(hT);hT=null;hb.className='ok';hb.textContent='OK to talk';
      setTimeout(function(){hb.className='';hb.textContent='STOP - hold 3s'},2500)}},1000)};

var ti=0,tt=null,tb=document.getElementById('tick');
function tshow(){tb.textContent='-> '+TICK[ti%TICK.length]}
function tickNext(){ti++;tshow();clearInterval(tt);tt=setInterval(function(){ti++;tshow()},45000)}
tb.onclick=tickNext; tshow(); tt=setInterval(function(){ti++;tshow()},45000);

var pIdx=-1,pSec=0,pTick=null,pLog=load('plog',[]);
function fmt(s){return Math.floor(s/60)+':'+(s%60<10?'0':'')+(s%60)}
document.getElementById('practice').innerHTML=
 '<div class="card"><div class="lab">Drill</div><div id="pQ" style="font-size:18px;font-weight:700">Tap start.</div>'+
 '<div class="small" id="pTarget"></div><div style="font-size:30px;font-weight:700;margin:9px 0" id="pTimer">0:00</div>'+
 '<button id="pMainBtn">Start drill</button> <button id="pSkip">Skip</button>'+
 '<div id="pRevealBox" style="margin-top:12px"></div></div>'+
 '<div class="card"><div class="lab">Rep log</div><div id="pLogBox"></div>'+
 '<button id="pClear" style="margin-top:9px">Clear the log</button></div>';
function pRender(){var b=document.getElementById('pLogBox');b.innerHTML=pLog.length?'':'<div>No reps yet.</div>';
  pLog.forEach(function(l){b.appendChild(el('<div>'+l+'</div>'))})}
function pNext(){pIdx=(pIdx+1)%Q.length;var x=Q[pIdx];
  document.getElementById('pQ').textContent=x.label;
  document.getElementById('pTarget').textContent='Out loud. Target '+(x.target||'60 seconds')+'.';
  document.getElementById('pRevealBox').innerHTML='';pSec=0;
  document.getElementById('pTimer').textContent='0:00';
  document.getElementById('pMainBtn').textContent='Start drill'}
function pReveal(){var x=Q[pIdx],t=fmt(pSec);
  document.getElementById('pRevealBox').innerHTML=
    '<div class="box land"><b>Landing</b>'+x.land+'</div><div class="box avoid"><b>Do not</b>'+x.avoid+'</div>'+
    '<div class="lab" style="margin-top:12px">Score this rep</div><div class="score" id="pScore">'+
    '<button data-v="Landed">Landed</button> <button data-v="Long">Long</button> '+
    '<button data-v="Wobbled">Wobbled</button></div><div class="ans" style="margin-top:11px">'+x.answer+'</div>';
  var entry=x.label.slice(0,42)+' - '+t; pLog.unshift(entry);save('plog',pLog);pRender();
  document.getElementById('pScore').onclick=function(e){var b=e.target.closest('button');if(!b)return;
    [].forEach.call(this.children,function(c){c.classList&&c.classList.remove('on')});
    b.classList.add('on');pLog[0]=entry+' - '+b.dataset.v;save('plog',pLog);pRender()}}
document.getElementById('pMainBtn').onclick=function(){
  if(pTick){clearInterval(pTick);pTick=null;this.textContent='Next question';pReveal();return}
  if(this.textContent==='Next question'||pIdx<0){pNext();return}
  pSec=0;pTick=setInterval(function(){pSec++;document.getElementById('pTimer').textContent=fmt(pSec)},1000);
  this.textContent='Stop and reveal'};
document.getElementById('pSkip').onclick=function(){if(pTick){clearInterval(pTick);pTick=null}pNext()};
document.getElementById('pClear').onclick=function(){pLog=[];save('plog',pLog);pRender()};
pRender();

document.addEventListener('keydown',function(e){
  if(e.target===qi){if(e.key==='Escape'){qi.value='';rb.classList.remove('on');qi.blur()}return}
  if(e.key==='/'){e.preventDefault();qi.focus()}

});

var CO=null;
function coachPaint(){
  if(CO&&Date.now()<CO.until){var nx=document.getElementById('cNowTx');if(nx.textContent!==CO.text)nx.textContent=CO.text;
    document.getElementById('cNow').classList.add('hot');return}
  var m=COACH[0];
  for(var i=0;i<COACH.length;i++){ if(tS>=COACH[i].t) m=COACH[i]; }
  var n=document.getElementById('cNowTx'); if(n.textContent!==m.s) n.textContent=m.s;

  var left=document.querySelectorAll('#ms .must').length-document.querySelectorAll('#ms .must.done').length;
  document.getElementById('cMustN').textContent=left;
  document.getElementById('cMust').classList.toggle('done', left===0);
}
function coachCard(){
  var c=document.querySelector('.qcard.open');
  var L=document.getElementById('cLand'), S=document.getElementById('cStop');
  if(!c){ L.textContent='Tap a question. This fills in.'; S.textContent=''; return; }
  var id=c.id.replace(/^c-/,'');
  var x=null; for(var i=0;i<Q.length;i++){ if(Q[i].id===id) x=Q[i]; }
  if(!x){ return; }
  L.textContent=x.land; S.textContent=x.stop?('-> '+x.stop):'';
}

(function(){var lab=document.querySelector('#cNow .clab'),last=0;
if(!(window.claude&&window.claude.use))return;
window.claude.use('db').then(function(db){if(!db)return;lab.textContent='Right now \u00b7 coach on';
db.doc('coach/alert').onSnapshot(function(s){if(!s.exists)return;var d=s.data()||{};var at=+d.at||0;
  if(!d.text||(at&&at<=last)||(at&&Date.now()-at>90000))return;last=at;
  CO={text:(d.level?d.level.toUpperCase()+': ':'')+d.text,until:Date.now()+20000};coachPaint()},
 function(){lab.textContent='Right now \u00b7 coach lost'})}).catch(function(){})})();
