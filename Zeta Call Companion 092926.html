d the quarter at a 3.0 or better. Up six points. Best quarter KIPP had ever had on that number, and twenty schools hit the goal, which was also the most ever. <span class=\"small\">[bank block 2 as dictated]</span>"}, {"sid": "(4)", "name": "CARVER", "proves": "He coached a struggling principal into the CEO seat.", "full": "I first started working with Jerel Bryant as a consultant. Jerel was the founding principal of Collegiate Academies Carver High School, then in its third year. He was (and still is) a really compelling and charismatic leader. At the time, his school was really struggling with academic results, student culture and community relations. I was tasked with answering the question: do we keep this leader, can he be successful? … I helped Jerel be the leader of the campus by getting out of his office and on to the floor - we spent hours and hours real time coaching and modelling. Jerel was very good as a teacher and was good with student interactions, so we took the approach that we needed to put that on stage and show teachers and students what it looks like to effectively invest, direct and redirect scholars. It worked. … Jerel received Louisiana state's Principal of the Year in our fourth year together and is now CEO of Collegiate Academies. <span class=\"small\">[written Carver answer 060925]</span>"}, {"sid": "(5)", "name": "BROOKLYN LAB, IN CONTEXT", "proves": "Stewardship through a mess: a team that did not trust each other, COVID, an ownership transfer, two renewals at once. And he ran a high school himself.", "full": "Two simultaneous renewals. A renewal in itself is already a big undertaking. Now do that twice at the same time. A charter renewal is not a project deadline. Missing it does not mean late. It means the schools do not exist next year. Both were reauthorized. <span class=\"small\">[ONE STORY 091326; Story Bank 081226]</span>"}, {"sid": "(6)", "name": "DEANSLIST", "proves": "A school operations product he built. Only if asked.", "full": "So I started an Excel spreadsheet, which I later grew into DeansList. … <span class=\"small\">Facts, not your words: zero to 275 while you were there, in over a thousand now, not affiliated in years. All three together or none.</span> <span class=\"small\">[Dan call line 40]</span>"}, {"sid": "(7)", "name": "THE COVERAGE SCHEDULE MAKER", "proves": "He is building school tools now, with an honest ceiling.", "full": "Your words 090326: \"returning somewhere between two and four hours a week.\" <span class=\"small\">[ONE STORY 091326]</span>"}, {"sid": "(8)", "name": "THE ASSOCIATE DEAN", "proves": "The failure is real, and it has a happy ending.", "full": "I learned I had to leave, and all of a sudden I've got six months before he is now the Dean of Students. And I realized I failed him … within a month, he was clearly meeting well-established targets … he's now co-Dean of Students with one of my former students <span class=\"small\">[onsite 090826, debrief-quoted]</span>"}, {"sid": "(9)", "name": "THE DREAM VERSION (academics)", "proves": "Your other recorded answer to \"you are a systems and culture person.\" Reference, not a script.", "full": "Yeah, I think my career in the last... Five to six years has really leaned into that side of the work. … superintendent role at Brooklyn Lab and so that was overseeing three schools. But that was where I was responsible for the academic results directly through the principals I led all the summer onboarding, all of the learning and development. that at the network level and then of course through the principals. … Most recently at the KIPP Foundation, The... Primary focus for my work has been academic health. And so... You know, we've got so many different schools in so many different places with so many different standards. Our big push was to really make sure that our grades were meaningful, that they were normed, We developed a ton of best practices and guidance and goals around what it takes to have a true, meaningful, powerful both curriculum and set of grading practices and really be attentive to both end of day results, end of IA cycle results, and end of year results because of our goal of obviously having students being ready to be over prepared to succeed in college and beyond. <span class=\"small\">[DREAM screen 081726]</span>"}, {"sid": "(10)", "name": "THE FOUR-DAY COVID PLAYBOOK", "proves": "He runs a crisis as a plan on paper that actually reaches people. Good for launch or ambiguity questions.", "full": "I effectively did a version of My strong start spring readiness planning, I condensed it to about four days. And so it was day one, gather all the information. A lot of this is coming in piecemeal from different sources, but also from the people and really understanding, because so much of this was an emotional issue as much as it was a scientific issue, as much as it was a logistical issue. Day two began the work of Getting as many answers as possible on paper so that on day three I could bring this to the leadership team and say this is our new playbook. We're opening a fully remote school. We're staying open brick and mortar for every student who wants to come in … we effectively spent the entire day with staff on Zoom working to roll out all of these new changes. … drawing on those experiences to run the plays that you know how to run, And recognizing that You both have to have the answer on paper. But having the answer only on paper is next to worthless if it doesn't actually get to the people. And nothing that gets to the people is going to matter if The fundamental premise is this is being done to us or like they don't get it or they haven't heard me or I haven't had a chance to make my voice heard. <span class=\"small\">The passage does not name the school. No student or staff count with it; the one you gave DREAM does not match the Brooklyn Lab file.</span> <span class=\"small\">[DREAM screen 081726]</span>"}];

var Q = [{"id": "aboutyou", "grp": "A", "t1": 1, "tier": "LOCK", "type": "core", "short": "Background walk", "trig": "&ldquo;tell me about yourself&rdquo; &middot; &ldquo;walk me through your background&rdquo;", "core": "Frame: systems, change management, now tech. 270th to one, 100 schools, Carver, Brooklyn Lab, KIPP, the tools. Ends on why Zeta.", "why": "Paola and Kruti haven't heard it. Dan got about 6 minutes; the bank version is about 2:35.", "keys": "background about yourself walk me through career history story arc resume", "label": "1 &middot; Walk me through your background.", "hook": "270th to number one / DeansList, three parts / Carver / stabilize, lead, pass off / happiest in a place like this", "tests": "Whether the arc reads as schools, and lands inside three minutes.", "target": "2:35 to 3:00. Cut the consulting list and the AI details first.", "land": "He hears a school person, and the last line points at Zeta.", "avoid": "The health reason for leaving Excel. \"Better part of a decade.\" \"I'm happy to go more into that.\" \"Long story short.\" The kids paragraph.", "answer": "<p>I started as a teacher in DC, then went to Excel Academy up in Boston. We were doing a turnaround. I was on the leadership team running culture and operations, and <span class=\"dcue slow\">slow</span> we took the school from <b>270th in the state to number one</b> <span class=\"dcue power\">land it</span> and got National Charter School of the Year.</p><p><span class=\"dcue flat\">one breath, all three parts</span> While I was there I built a tool we needed and turned it into DeansList. I grew it from <b>zero to 275</b> schools. It's in <b>over a thousand now</b>, though I <b>haven't been affiliated with it in years</b>.</p><p>With Excel's success, we were getting hundreds, if not thousands, of visitors a year. A lot of those folks wanted to figure out how to bring what we were doing back to their schools, and some of them became my first clients. So I launched a consulting practice. And I got to walk into 100 different schools, find and fix problems, help people improve systems, help each principal set their goals and figure out how to meet them. <span class=\"dcue beat\">cut the list if short</span> KIPP, Uncommon, Achievement First, most of the regional, local and midsize operators.</p><p>Then I found a client I was really keen on, Collegiate Academies down in New Orleans, a true all-means-all network. <span class=\"dcue slow\">slow</span> I was brought down to Carver to work with a principal who was unclear whether or not he could do the job. He went on to be Louisiana Principal of the Year, and <b>now he runs the organization</b>. That work created the chief culture officer role, so I moved down and was Chief Culture Officer for five years. We slashed suspensions while greatly increasing teacher retention and student and family satisfaction.</p><p><span class=\"dcue stop\">SKIP for Zeta (the kids)</span> Then we came back to Brooklyn, because my wife is from New York and the plan was always to raise our two girls here. Or at least that was her plan. But we're here now and loving it.</p><p>I was superintendent at Brooklyn Lab for a transitional period. I was there to <b>stabilize, lead and pass off</b>. We led through COVID. We opened a fully remote school while keeping the in-person school up and running simultaneously. And we took both charters through renewal at the same time, and both were reauthorized. That wasn't super easy because of some of the knots and tangles that existed there.</p><p>Then two years at the KIPP Foundation, trying to bring 28 wonderful but very independent regions into some degree of alignment, and we built a national high school strategy and handed it back to the regional teams, who run it now.</p><p>And now I'm doing a really cool thing, or at least I think it's very cool. I build custom AI tools for school leaders. They point me at a problem, and I build the thing that saves them the time so they can focus on the real work.</p><p><span class=\"dcue beat\">two-second beat</span> The happiest I've ever been is in a mid-sized, growing charter network with outsized ambition. <b>That's what my research says you all are</b>. And this role is a perfect blend of the really cool work I'm doing with custom tools and an ambitious, growing charter. So that's what brought me here. <span class=\"dcue stop\">STOP</span></p><p class=\"small\">Your words: THE TWELVE ANSWERS block 1 as dictated (Notion, revised 092426); the 100-schools line and \"knots and tangles\" are from the Dan call 092526. The concise-pass rewording is dropped.</p>", "receipts": ["(1) 270TH TO NUMBER ONE", "(4) CARVER", "(5) BROOKLYN LAB"], "stop": "Stop at \"that's what brought me here.\" Then the role question, if they pause."}, {"id": "whyzeta", "grp": "A", "t1": 2, "tier": "LOCK", "type": "core", "short": "Why Zeta, why this side", "trig": "&ldquo;why Zeta&rdquo; &middot; &ldquo;why this role&rdquo; &middot; &ldquo;why schooling, not ops&rdquo;", "core": "Building things other people can run. A midsize network with outsized ambition. Excellence with exploration.", "why": "The ops seat is closed. This has to be a clear yes to the schooling side.", "keys": "why zeta why us why this role why now schooling side ops operations transformation felipe", "label": "2 &middot; Why Zeta? Why this side of the house?", "hook": "building things other people can run / excellence with exploration / best idea wins", "tests": "Whether he wants this seat, or the ops seat he applied for.", "target": "75 seconds", "land": "He wants this work, at this network, now.", "avoid": "Any sign you would rather have the Operations Transformation seat. Title, level or money.", "answer": "<p><span class=\"dcue flat\">plain, easy</span> The idea that the job is focusing on initiatives, the ones that transition from launch into practices that the entire organization uses. And this, I think if there was one thing to sum up what I've been doing my whole career as a, in New York, Network offices at CMOs and as a consultant, it's been this like <span class=\"dcue slow\">slow</span> building things that other people can run.</p><p>I both like doing that work and I also like... Building systems. and structures and practices that people buy into on merit, not out of obligation.</p><p><span class=\"dcue power\">the seat, in your words 092826</span> <b>I want to be part of a great organization, and this is a high impact role that would get me close to schools and close to network decision makers, so it's a great way to get to know the org and the schools and the people.</b></p><p><span class=\"dcue beat\">beat</span> … the happiest I've ever been is in a midsize growing charter network that has wildly outsized ambition and is full of smart, aspirationally aligned folks. And my read is that you all might be that place and that this role just really spoke to me as a perfect blend of what I've done, what I want to do, and where I might want to be.</p><p><span class=\"dcue warm\">warm</span> … excellence with exploration on what that means seems really cool to me. I do have a lot of high school-specific experience in operations, culture, and academics. And so there's something cool about like the high school question. I love being in environments where it's like best idea wins, strong opinions, loosely held. Let's debate the heck out of things. Let's attack people's ideas without attacking people. <span class=\"dcue stop\">STOP</span></p><p class=\"small\">Your words: DREAM screen 081726 (first two paragraphs); your typed answer 092826 (third); Dan Rojas call 092526, lines 54 and 225-227.</p>", "receipts": [], "stop": "If they ask about ops: Felipe thought your strongest fit was the schooling side, and after the Dan call you see the logic."}, {"id": "g2g", "grp": "B", "t1": 3, "tier": "LOCK", "type": "core", "short": "Good principal → great", "trig": "&ldquo;how do you manage principals&rdquo; &middot; &ldquo;good to great&rdquo; &middot; &ldquo;feedback to a principal&rdquo;", "core": "Clothes, not skin. Support hat 99%. Side of the street clean. Shoulder to shoulder. Then Carver.", "why": "Paola manages Zeta's principals. Dan asked this exact question and the answer ended with no proof.", "keys": "principal manage feedback good to great coaching develop protective support evaluation", "label": "3 &middot; The good principal who needs to get to great. What's your common feedback?", "hook": "clothes, not skin / support hat 99% / end on Carver", "tests": "Whether he can manage strong, protective principals without mandating.", "target": "2 minutes", "land": "Ends on a named principal and a result: Carver, Jerel now runs the organization.", "avoid": "Ending on \"completely let go of any hierarchical sense of mandate authority.\" Four principles and no proof (what happened with Dan).", "answer": "<p>I would say that the playbook that I have developed over time by doing it wrong and then eventually doing it better and then doing it well a few times at least is I think the first thing is <span class=\"dcue slow\">slow</span> we have to separate someone's performance from their identity. And I talk about using your identity not as your skin, but your identity as a principal is <em>the clothes that you wear, not the skin that you're in</em>. And helping them separate this idea that there are things that make you who you are that are irreplaceable and that nothing about those should change. There are, however, also ways in which we can build on those strengths. And by aligning on what the key problems or opportunities are, we can focus on improving those without undercutting either who you are, the strengths you bring, or attacking your personal identity. So that's number one. Number two is getting clear on support versus evaluation. <span class=\"dcue power\">land this</span> 99% of the time, I'm wearing my support hat. My success is entirely a function of your success. And so that when it comes time to evaluate, number one, nothing is a surprise. And number two, I've helped you along the way so that your review is wildly positive. The third thing is my side of the street needs to be totally clean above reproach. I need to be clear. I need to follow through. I need to be the model for reliability, for clarity and communication. And number four, doing the work alongside them. I think so often it's easy for folks, especially that have been doing it for a while, to say, \"Even if I respect you, even if I think you're great, you don't really get it, or you don't get it at the level that I'm currently experiencing it.\" And that's true. And I think with most conversations with smart people, acknowledging that their perspective is entirely valid is both necessary and important. Also, there are ways in which you can dive in, do the work alongside them, and really go shoulder to shoulder with them. And I'll close with this. <span class=\"dcue beat\">beat</span> Mandate authority is almost worthless in these settings. I mean, sure, you're the person's boss. Sure, you can say we are or aren't doing certain things, and you need to. However, for the people that we want to keep, like you said, the people who are innovative, who are strong, who bring their whole selves, we need to convince them through the quality of our ideas and our actions and through the data on what directions and changes need to be made. <span class=\"dcue power\">then the proof</span> <em>Jerel received Louisiana state's Principal of the Year in our fourth year together and is now CEO of Collegiate Academies.</em> <span class=\"dcue stop\">STOP</span></p><p class=\"small\">Your words: Dan Rojas call 092526, lines 60-72. The last line is your written Carver answer, 060925.</p>", "receipts": ["(4) CARVER"], "stop": "Carver in one line, then stop."}, {"id": "carver", "grp": "B", "t1": 4, "tier": "LOCK", "type": "core", "short": "Carver, the whole story", "trig": "&ldquo;a principal who was struggling&rdquo; &middot; &ldquo;hard feedback&rdquo; &middot; &ldquo;developing a leader&rdquo;", "core": "\"do we keep this leader, can he be successful?\"", "why": "Your best proof for a principal-manager seat. With Dan it came out as \"we were able to be successful in that.\"", "keys": "carver struggling principal underwater hard feedback develop leader coach jerel ben marcovitz collegiate", "label": "4 &middot; Tell me about a principal who was struggling. What did you do?", "hook": "do we keep this leader? / negative controllers / shoulder to shoulder / reset the frayed relationship / now CEO", "tests": "Whether he can diagnose, tell a hard truth, and grow a leader instead of replacing him.", "target": "90 seconds", "land": "\"Jerel received Louisiana state's Principal of the Year in our fourth year together and is now CEO of Collegiate Academies.\"", "avoid": "The 75% suspension drop at Carver (network-wide only). \"Led\" Carver: you coached. Naming blame.", "answer": "<p><span class=\"dcue warm\">steady</span> I first started working with Jerel Bryant as a consultant. Jerel was the founding principal of Collegiate Academies Carver High School, then in its third year. He was (and still is) a really compelling and charismatic leader. At the time, his school was really struggling with academic results, student culture and community relations. I was tasked with answering the question: <b>do we keep this leader, can he be successful?</b></p><p>When I arrived I found teachers highly frustrated with students and operating as \"negative controllers\" and students responding by pushing back, skipping class, opting out of learning.</p><p><span class=\"dcue slow\">slow</span> Knowing we had a high potential leader in Jerel, I sought to build him up as the model for how we should be operating with students and helped him build enabling systems to help the school function smoothly. I did this by primarily working <b>shoulder to shoulder</b> with him and giving him incredibly high doses of real time feedback - primarily affirming feedback that empowered him and built his confidence to help him stop second guessing himself.</p><p><b>I clearly named that this frayed relationship needed to be reset</b> and helped them come into alignment, focusing them on results and impact rather than narratives of blame.</p><p>I helped Jerel be the leader of the campus by getting out of his office and on to the floor - we spent hours and hours real time coaching and modelling. Jerel was very good as a teacher and was good with student interactions, so we took the approach that we needed to put that on stage and show teachers and students what it looks like to effectively invest, direct and redirect scholars. It worked. Students started to feel like school was safe, predictable and purposeful.</p><p><span class=\"dcue power\">land this</span> <b>Jerel received Louisiana state's Principal of the Year in our fourth year together and is now CEO of Collegiate Academies.</b> <span class=\"dcue stop\">STOP</span></p><p class=\"small\">Your words: your written Carver answer, Brooklyn Prospect 060925 (spelling fixed, nothing added). Cut: \"decrease suspension by 75% (truly)\" (that number is Collegiate network-wide), and the five-year growth line. Written, so say it your way.</p><p class=\"small prepOnly\">If asked for a reference line, his words about you (060925): \"The work with Chris Habetler deeply accelerated the trajectory of my school and ultimately the network at large... Chris's work was nothing short of transformational.\"</p>", "receipts": ["(4) CARVER"], "stop": "Stop on \"CEO of Collegiate Academies.\""}, {"id": "managed", "grp": "B", "t1": 5, "tier": "LIKELY", "type": "core", "short": "Have you managed principals?", "trig": "&ldquo;have you managed principals&rdquo; &middot; &ldquo;you've never been a principal&rdquo;", "core": "Frame: superintendent over three principals, results through them, interim for half a year.", "why": "The seat is likely Principal Manager. Your fact file has a ruling on exactly how to say this.", "keys": "managed principals portfolio principal experience interim never been a principal evaluated", "label": "5 &middot; Have you managed principals? Have you been a principal?", "hook": "stabilize, lead, pass off / results through the principals / decision maker who answered fast / interim, half a year", "tests": "Whether he has done the seat, not just coached near it.", "target": "75 seconds", "land": "\"What they needed from me was a decision maker who answered fast, not a superintendent who visited.\"", "avoid": "Volunteering that you never held a standing principalship. A bare \"principal.\" \"Evaluated.\" \"New charter operator.\"", "answer": "<p><span class=\"dcue flat\">plain, no hedge</span> I was superintendent at Brooklyn Lab for a transitional period. I was there to <b>stabilize, lead and pass off</b>.</p><p>superintendent role at Brooklyn Lab and so that was overseeing three schools … But that was where I was <b>responsible for the academic results directly through the principals</b> I led all the summer onboarding, all of the learning and development. that at the network level and then of course through the principals.</p><p><span class=\"dcue beat\">then the trade you made</span> Two of my three schools did not see their superintendent in their building for a semester. They got their principal and my phone. What they needed from me was <b>a decision maker who answered fast</b>, not a superintendent who visited. I made that trade at the semester line, not in June.</p><p><span class=\"dcue slow\">Collegiate</span> I was brought down to, as a consultant, I was brought down to Collegiate Academies. You know, spoiler alert, I went and worked there full time for Five years after this consulting arrangement. So this is a story of like most of my work as a consultant and then later as chief culture officer. But I was brought down as a last ditch effort to assess whether or not the principal could be successful. They'd tried everything and things just weren't working. <span class=\"dcue power\">then Carver, card 4</span></p><p><span class=\"dcue slow\">interim, out loud only</span> Your note, 083026: \"i was the princpal at bk lab for half a year bc i decided to remove the principal and take it over bc it needed to be done.\" <span class=\"dcue stop\">STOP</span></p><p class=\"small\">Your words: THE TWELVE ANSWERS block 1 (dictated); DREAM screen 081726; Story Bank 081226 (his words, 071426); School in the Square round 082426; your 083026 note.</p><p class=\"small\"><b>Fact file wording, not a recording:</b> managed three principals and the C-level team, with the CEO and CFO co-managed. Collegiate principal portfolio shared with the CAO. Never \"managed 48 principals.\" Never merge the 8 you coached at Collegiate summer PD with the 3 at Brooklyn Lab.</p>", "receipts": ["(5) BROOKLYN LAB"], "stop": "Stop after the interim line."}, {"id": "hs", "grp": "C", "t1": 6, "tier": "LOCK", "type": "core", "short": "What high school should be", "trig": "&ldquo;the high school&rdquo; &middot; &ldquo;what would you rethink&rdquo; &middot; &ldquo;college admissions&rdquo;", "core": "Not middle school with a couple of dials turned. Same spine, dressed entirely different. 50/25/25.", "why": "Dan's biggest problem, and it rolls up to Paola. Dan said \"I love that idea.\"", "keys": "high school rethink ninth grade college admissions gradual release seating chart 50 25 identity", "label": "6 &middot; What should high school be? What needs a structural rethink?", "hook": "not middle school with the dials turned / same spine, dressed different / 50-25-25", "tests": "Whether he has a real point of view on the high school they just opened.", "target": "2 minutes. The seating-chart paragraph is the one to cut.", "land": "Lives of unlimited opportunity, and what a ninth grader needs to do to get there. Then the 46%.", "avoid": "Opening with \"I wish I had the answer\" (what happened with Dan).", "answer": "<p>… <span class=\"dcue power\">lead with this</span> high school can't be like middle school just with a couple of dials turned. We get into a lot of and I think that's what a lot of folks have done. Because like you said, some of the things wear off, some of the things that compelled students in middle school either don't hold for different reasons. Number two, we can't overcorrect and we can't undercorrect on our systems and our structures. When we try and go too far and we don't have any systems, students are looking left and looking right and being like, \"Do you even have it together? What is going on? This is not what I signed up for.\" At the same time, if we don't evolve them in strategic ways, you guys are treating me like I'm still in middle school. And so I would think about it the way I think about my classroom, which is I'm starting a new school year. It's a new group of students. I'm teaching something different. What is it that I did in the past that worked that I need to replicate for this group? And I think it would be about defining a wholly different identity, making sure that this was one that was resonant with students and that <span class=\"dcue slow\">slow</span> we had a spine, a skeleton of the same values, but we dressed it entirely different. And I don't mean dress in terms of faking or putting on just bells and whistles. What I simply mean to say is our values are still our values. But how they show up and what they look like and what the experience of a student is going to be does need to be fundamentally different.</p><p><span class=\"dcue flat\">cut if short</span> I would ideally have us start at the end of seventh grade and begin a transition towards independence. In eighth grade, one of the things we did at Excel and we started to do at collegiate was run the second semester of each of those years as intentional transition points where we said, \"We're going to remove the seating chart. Before we do that, we're going to teach you why it existed, what are the choices people are making, what does it look like to choose the seat?\" And then we let kids fail. Sorry, I should say, we let kids choose their own seat. Some of them did well, some of them didn't. And we didn't immediately jump in and say, \"Okay, fine. Here's where you sit.\" We let it run and we let kids sit with and see what the outcome, how the outcome of that two-weeks grading cycle, how it changed. And we reflected with them and gave them another opportunity, again, to choose. And we did three to four cycles of that for multiple discrete skills such that we were taking all of our we were taking, let's say, 40% of our 50% of our systems that were meant as placeholders or substitutes for the real skill, the student choice, the student understanding of why. So this is the org system. This is office hours and tutoring, student materials, late homework, or late work policy. And we systematically took those back, gave, like I said, the front-end instruction, the opportunity to try it out, and multiple cycles of that. And I think that's where I would want to start doing that in eighth grade so that we could do that in high school. And I think it's hard, though, because if you start that exact strategy in high school, are we really willing to say to students that we're going to take the first semester of their year and let things slide or let things slip? Because that's obviously highly problematic. So I think what I would try and do is find a way to apply some of that same logic.</p><p>I would take a look at my middle school plays. I would say, \"Which 25% of these no longer make sense? Or <span class=\"dcue beat\">beat</span> what are the 50 that are core we're going to keep? What are the 25% that don't make sense anymore or we don't need them? And then what are the 25% that we are going to intentionally do pretty quick gradual release with instruction and reflection as a primary starting point?\" All built around aiming at a different identity and an endpoint rather than we did in middle school because middle school is obviously focused on the high school portion of it. So then we have to focus on the lives of unlimited opportunity and what that means to a scholar in terms of what they need to do to advance and arrive at the right place. <span class=\"dcue power\">then the number</span> <em>That year, 46% of ninth graders across all 48 high schools finished the quarter at a 3.0 or better. Up six points. Best quarter KIPP had ever had on that number.</em> <span class=\"dcue stop\">STOP</span></p><p class=\"small\">Your words: Dan Rojas call 092526, lines 118-139. The number is from block 10 of your answer bank.</p>", "receipts": ["(3) ACADEMIC HEALTH, 46%"], "stop": "The 46%, then stop."}, {"id": "ownership", "grp": "C", "t1": 7, "tier": "LIKELY", "type": "core", "short": "Culture and student ownership", "trig": "&ldquo;beyond systems&rdquo; &middot; &ldquo;culture&rdquo; &middot; &ldquo;student voice&rdquo;", "core": "Cool to be smart. Ownership that isn't thin and surfacey. It's my school.", "why": "Dan's follow-up. For Paola it shows culture as academic identity.", "keys": "culture student ownership honor council orientation leaders identity belonging events", "label": "7 &middot; Beyond systems, what would you change about high school?", "hook": "cool to be smart / not thin and surfacey / it's my school", "tests": "Whether culture means more than discipline to him.", "target": "90 seconds", "land": "As adults, we would be saying a whole lot less and helping our students say a whole lot more.", "avoid": "Running past two minutes.", "answer": "<p>It sounds like you're in a place that where I think we got to a place at Excel where things were functional, things were academically focused, things were working. Were they perfect? No, of course not. But were they functional? Yes. And one of the corners that we turned two corners that made all the difference. One was what was teacher doing bell to bell in terms of rigor and instruction that gave us a sense of purpose and built an academic identity of cool to be smart, cool to work hard, and driving that as whereas in middle school, it might have been more focused on incentives and rewards or team. We switched it to a little bit more of an individual and more of an academic rigorous folk. <span class=\"dcue slow\">slow</span> It's not fun because it's fun. It's fun because it's challenging. And so building a true academic scholarly identity is number one. And number two, <span class=\"dcue beat\">beat</span> we always talk about student ownership over culture and over the school. And oftentimes, those end up being thin and surfacey. And so what I would do, I believe, would be something we did at Excel, which is to develop a lot of genuine student groups that play a key role, not just in the planning of the dance or the student council, but that are actually operating within the school day to help the school operate, to build the students who are involved in it to build their place and identity, but also so other students could see that this is the school that both trusts, empowers students, and those students are actually doing the thing incredibly well. So we'd have an honor council, right? And that honor council would be entirely responsible for within limits, of course, but doing a bit of investigation, evaluation around honor code violations, making recommendations. And we would put them front and center in terms of as much as we could from a legal and reasonable parent perspective, putting them in the position of understanding, deciding, and supporting scholars who are struggling. We would have groups that are intentionally owning and planning some of our joy factor or student events. All of these would be undergirded by our values. So not only would the group of the ninth-grade events committee be planning the dance, they'd be hyping the dance, they'd also attach a service commitment to it or a canned food drive to it. And they would be the ones making the announcements. They would be the one speaking and doing all of the things that oftentimes we have adults still do, even though behind the scenes, students are doing it. So it's really moving kids from supporting the school from an aspirational idea to action, but also to a level of doing it actually quite publicly. And that is where in a high school of 150 students, first year, 150 students per grade, you can get it so that more than a third of those students at any given time is in a meaningful group like this. And so they're part of one, and then they're seeing three to four others. And that's how we really get students to get that feeling of not only is this high school and it's different, it's also my school. And so we have this we build this identity of belonging such that when students are joining I mean, one of the big groups we would do, and I'll leave it at this, is our orientation leaders. We would have sophomores and juniors leading our freshman orientation, 50% of it, right? We would help prep them. We would help we'd spend a lot of time getting them to be incredibly good at this. We'd record a lot of video so that we could show what it looks like. But we would, <span class=\"dcue power\">land this</span> as adults, be saying a whole lot less and helping our students say a whole lot more. <span class=\"dcue stop\">STOP</span></p><p class=\"small\">Your words: Dan Rojas call 092526, lines 143-159.</p>", "receipts": [], "stop": "Stop on \"say a whole lot more.\""}, {"id": "scale", "grp": "D", "t1": 8, "tier": "LOCK", "type": "core", "short": "Earn it: when to scale, playbook vs autonomy", "trig": "&ldquo;playbook or autonomy&rdquo; &middot; &ldquo;why do networks plateau&rdquo; &middot; &ldquo;when is it ready to scale&rdquo;", "core": "Frame: run the proven play until the school is stable and functional; that earns room to change it. Pair with how you invest in people.", "why": "Kruti's job is scaling what works. \"Earn it\" means: autonomy is earned by first getting the school stable and functional on the proven playbook.", "keys": "scale scaling playbook autonomy fidelity new principal earn it plateau network kipp excel replicate", "label": "8 &middot; When is a practice ready to scale? Playbook or principal autonomy?", "hook": "clear on who we were / earn it: stable, functional, then innovate / you are part of the evolution", "tests": "Fidelity versus autonomy, and whether he respects principals.", "target": "90 seconds", "land": "\"the high school is in the top 3% of all public high schools across the country. And even better, Jackie... now has my old job\"", "avoid": "\"I don't care really if you as a first-year principal...\" (it came right before \"earn that\" with Dan). The KIPP half of the comparison.", "answer": "<p>… Now, in contrast that with Excel, where we had playbooks for everything, we were unapologetic about the adult culture values, the way in which we did things, and we replicated not quite as cloning. I don't use huge, but the principal who started our second school and then our third school inherited 95% of the play was exactly the same. We wanted to maintain an opportunity for innovation because we recognized that innovation, one, you don't get to keep the right talent if you don't allow for some of that. And two, that's the laboratory where all the other schools can get better because we're trying something new. So fundamentally, we were clear on who we were. We were unapologetic about growing meant starting from a proven starting point and growing at a pace such that we could maintain the level of talent that we needed to do that incredibly well. And yeah, at the end of the day, our philosophy was we are here to build dynasties, to create radical transformations so students could live lives of unlimited opportunities. …</p><p><span class=\"dcue slow\">slow</span> Earn that, right? Get to the place of stable, get to the place of functional, then let's have a conversation about innovation. But for right now, we need to run the play because the play works. The play is not perfect. The play is going to evolve. <span class=\"dcue power\">land this</span> You're going to be part of that evolution. But the way in which we grow with quality is starting from a solid foundation of what we know that works. And what's really cool is Excel right now, the two data points I love to share is number one, the high school is in the top 3% of all public high schools across the country. And even better, Jackie, who I had in fifth, sixth, and seventh grade, now has my old job. <span class=\"dcue stop\">STOP</span></p><p class=\"small\">Your words: Dan Rojas call 092526, lines 92-101, starting after the KIPP comparison; the \"I don't care really\" sentence is cut.</p>", "receipts": ["(1) 270TH TO NUMBER ONE"], "stop": "Stop on \"now has my old job.\""}, {"id": "adopt", "grp": "D", "t1": 10, "tier": "LOCK", "type": "core", "short": "Adoption without authority (KIPP)", "trig": "&ldquo;adoption&rdquo; &middot; &ldquo;influence without authority&rdquo; &middot; &ldquo;across autonomous schools&rdquo;", "core": "\"Nobody had to say yes to what we were doing, so we had to use influence and the quality of our ideas to get them to want to say yes.\"", "why": "Zeta is growing fast; Kruti needs adoption without force.", "keys": "adoption influence authority mandate kipp regions pilot champions buy in 28 48 alternate path", "label": "10 &middot; How do you get schools to adopt something they don't have to?", "hook": "no mandate / problem, pilot, implementation / 46% up six / no school took the alternate path", "tests": "Whether he can scale without positional power.", "target": "2 minutes", "land": "\"We built it, we tested it, it worked, and we handed it off. Now the regions are running the play.\"", "avoid": "The 46% in the same breath as the 28/48 adoption. \"Used by all 28\" for the tool. Grading KIPP. \"Kate Starke led the team\" is true: never \"I led the national strategy.\"", "answer": "<p>For folks who don't know it, the KIPP Foundation is the national arm. Strategy, support and oversight. But it doesn't have mandate authority. Twenty-eight independent regions, which you can think of as twenty-eight independent districts, and forty-eight high schools. <span class=\"dcue slow\">slow</span> <b>Nobody had to say yes</b> to what we were doing, so we had to use influence and the quality of our ideas to get them to want to say yes.</p><p>First thing we did was we made the change theirs. Every single region was part of our listening tours, part of our iterative feedback, part of our working groups, so that when we announced what the strategy was, I was looking at people in the eye, watching them nod. All 28 regions and all 48 high schools adopted the strategy. There was an alternate path, and <b>no school chose that alternate path</b>.</p><p><span class=\"dcue flat\">cut if short</span> Second, we didn't go for all twenty-eight at once. We shrank the change. We let our stronger regions get early wins, and let that win sell the rest of the product. Because of the clarity and quality of our tools, we were able to stack early wins, and the early wins sold the future work. It built a positive flywheel.</p><p><span class=\"dcue flat\">cut if short</span> Third, we kept our finger on the pulse. We paid attention to the micro signals, the small, not-so-small things that tell you whether people are on board with you or turning off.</p><p>The one I'd point to is academic health. We started with clarity, we wrote the academic procedures manual, we rolled out training making it as simple as we could, and then we built a push-button data analysis tool that took eight thousand rows of data and got a teacher, a student and a school an individualized, actionable report. The data went from present but obscured to right in front of them. We piloted it, and it was highly effective.</p><p><span class=\"dcue power\">land the number</span> That year, <b>46% of ninth graders</b> across all 48 high schools finished the quarter at a 3.0 or better. Up six points. Best quarter KIPP had ever had on that number, and twenty schools hit the goal, which was also the most ever.</p><p>We built it, we tested it, it worked, and we handed it off. Now the regions are running the play. <span class=\"dcue stop\">STOP</span></p><p class=\"small\">Your words: THE TWELVE ANSWERS block 2 as dictated (Notion, revised 092426). Last paragraph cut.</p>", "receipts": ["(2) 28 REGIONS, 48 HIGH SCHOOLS, NO MANDATE", "(3) ACADEMIC HEALTH, 46%"], "stop": "Stop on \"Now the regions are running the play.\""}, {"id": "initiative", "grp": "D", "t1": 11, "tier": "LIKELY", "type": "core", "short": "An initiative, design to scale", "trig": "&ldquo;an initiative you led across schools&rdquo; &middot; &ldquo;pilot to scale&rdquo;", "core": "\"The data went from present but obscured to right in front of them.\"", "why": "Kruti's job is taking what works to scale. This is your pilot-to-network story.", "keys": "initiative pilot design implementation data academic health reports teacher student gpa weekly", "label": "11 &middot; An initiative you led from design through implementation across schools.", "hook": "data nobody could use / one button, a report per teacher / present but obscured", "tests": "Whether he can take a pilot to scale.", "target": "2 minutes", "land": "That year, 46% of ninth graders across all 48 high schools finished the quarter at a 3.0 or better. Up six points. Best quarter KIPP had ever had on that number.", "avoid": "Leading with the tool. Forgetting the book mid-story (last time).", "answer": "<p><span class=\"dcue flat\">set the scene</span> The Academic health data transparency work that was a subset of our larger academic health work so I'll I'll set the scene a little bit. Every school on our network had grade books, they had tons of data, All of that data was in these large CSV files and Excel files. and While it was accessible or while it was there, people couldn't really use it.</p><p><span class=\"dcue beat\">beat</span> … Using Claude Code to build A Python script that parsed out these huge data sets and with the push of a button created individualized teacher reports Telling them, you know, here are the students of concern, the assignments of concern. Here's where you don't have enough of a certain type of assessment. Here's where, you know, you're Your grades seem to be skewing. So we got people weekly high quality personalized data that we were able to compare to a standard. We did the same thing for students.</p><p>I designed this for one particular school, rolled it out at that school, and then we took it across the country. And so, We built these reports through the AI. Then we created a regular meeting cadence We created a team at the school I was looking into these things and was leading the work on the ground.</p><p>And what we ended up seeing was instead of people waiting till The end of the quarter to finish the grading or to tell students where they stood and what needed to happen, they were able to do that. weekly and just the fact that <span class=\"dcue slow\">slow</span> the data went from <b>present but obscured to right in front of them</b>, drove a tremendous amount of positive change because, again, they could look at it and they could see This is where I'm falling short. This is where this student is struggling.</p><p>We then took that across the country and we were able to see the biggest jump in GPA year over year in that, in the last year. <span class=\"dcue power\">the number</span> <b>That year, 46% of ninth graders across all 48 high schools finished the quarter at a 3.0 or better. Up six points. Best quarter KIPP had ever had on that number.</b> <span class=\"dcue stop\">STOP</span></p><p class=\"small\">Your words: DREAM screen 081726, your answer to \"one initiative from design through implementation.\" The number is block 2 as dictated. Cut: \"it's been cited as one of the primary drivers\" (the fact file says the link is your own read, never that KIPP credited it).</p>", "receipts": ["(3) ACADEMIC HEALTH, 46%"], "stop": "The number, then stop."}, {"id": "launch", "grp": "D", "t1": 12, "tier": "LIKELY", "type": "core", "short": "Launching a school: three phases", "trig": "&ldquo;launching a new school&rdquo; &middot; &ldquo;first-year principal&rdquo; &middot; &ldquo;turnaround&rdquo;", "core": "Frame: stability, then the adults, then student ownership.", "why": "Zeta has Flushing, Tremont Park and the high school all in year one.", "keys": "launch new school first year principal turnaround excel phases playbook six days stability", "label": "12 &middot; How do you launch a new school or onboard a first-year principal?", "hook": "stability / the adults / student ownership / six days on the playbook", "tests": "Whether he knows what a first year needs.", "target": "2 minutes", "land": "We took that school from 270th in the state to number one, and got National Charter School of the Year.", "avoid": "Running all three phases at full length if time is short.", "answer": "<p>I came into Excel Academy with a mandate for change, in a turnaround year. We had an entire new staff. We stopped growing for a year because things were in such rough shape. We literally had a hundred students. I think about it in three phases.</p><p>Phase one was stability. An all-new staff needed clear leadership. I was dean of students, forty percent of the staff reported to me, operations included, and I was the most experienced educator on the leadership team. So I took the consistency and clarity from my classroom, the routines, procedures and systems, and brought them to the entire school. <span class=\"dcue slow\">slow</span> I spent six days writing the playbook on how we were going to do everything, my culture manual and my operations manual. My boss at the time thought that was a crazy use of time. <b>It became one of the most important things we did.</b></p><p>Phase two was the adults. We really focused on the five dysfunctions of a team, and built a strong, best-idea-wins culture. Then we created an academic-focused environment where it was cool to be smart, and rigor and engagement were the primary drivers.</p><p><span class=\"dcue flat\">cut to two sentences if short</span> Phase three was student ownership. Honor council, a student events committee, lots of student committees. The principal and I taught classes throughout the year. We built an orientation leader program that put students in formal positions to speak to other students in genuine ways. On the first day of school we had kids telling kids how overwhelmed they were at first, and that they'd even told their parents they didn't like the school.</p><p>We took that school from <b>270th in the state to number one</b>, and got National Charter School of the Year. <span class=\"dcue stop\">STOP</span></p><p class=\"small\">Your words: THE TWELVE ANSWERS block 3 as dictated (Notion, revised 092526). Paragraphs 5 and 6 cut.</p>", "receipts": ["(1) 270TH TO NUMBER ONE"], "stop": "Stop on National Charter School of the Year."}, {"id": "instruction", "grp": "E", "t1": 13, "tier": "LOCK", "type": "curve", "short": "Systems and culture, not academics?", "trig": "&ldquo;you're a systems and culture person&rdquo; &middot; &ldquo;instructional leadership&rdquo;", "core": "\"Yes and no.\" Then everything upstream, then the proof.", "why": "DREAM asked this twice. It is the likeliest doubt about you for a schooling seat.", "keys": "instruction academic curriculum rigor systems culture never led instruction learning curve", "label": "13 &middot; You're known for systems and culture. Why trust you with academics?", "hook": "yes and no / culture is a means to an end / the four I spike in / 46%", "tests": "Whether a culture guy can manage instructional leaders.", "target": "2 minutes", "land": "Best quarter KIPP had ever had on that number.", "avoid": "Ending on the AP line. \"I'm not trying to.\" Claiming curriculum ownership or a CAO title.", "answer": "<p><span class=\"dcue flat\">plain, no apology</span> <b>Yes and no.</b> My reputation, for better or for worse, is very much of the systems and culture and less of the academic. I am not the person who's going to know the twelfth grade AP government standards cold.</p><p>What I've owned is everything upstream of that. People brought me in to work on behavior, and what we realized every time is that until operations are stable, it's really hard. You have thirty kids in a hallway and nobody knows where to go because their schedule is wrong. The role of operations, in my mind, is to be the <b>first line of defense</b> to take care of things, so the real rock stars, the teachers and students, can go shine.</p><p>What I came up in was Excel, which was a turnaround, and Collegiate, which was high school focused, special education focused, and a true all means all mission and infrastructure. … <span class=\"dcue power\">add</span> <em>One of our schools, Carver, had the largest CREDO effect size in the country.</em></p><p>And I have led it. At KIPP I led academic health at a national level, across forty-eight high schools. GPA, course failures, attendance, and whether a kid feels like they belong. We piloted it at one school where I led it directly, though I wasn't coaching half the teachers. And when I was <b>interim high school principal</b> at Brooklyn Lab, while serving as superintendent, instruction was part of my role.</p><p><span class=\"dcue power\">land the number</span> <b>… that year forty-six percent of ninth graders finished the quarter at a 3.0 or better, up six points. Best quarter KIPP had ever had on that number.</b> <span class=\"dcue stop\">STOP</span></p><p class=\"small\">Your words: THE TWELVE ANSWERS block 10 as dictated (Notion, revised 092526). The CREDO sentence (gold) is fact-file wording, per your 092826 ruling that it belongs to Carver. Cut: \"so I'm not trying to take all the credit.\"</p>", "receipts": ["(3) ACADEMIC HEALTH, 46%", "(9) THE DREAM VERSION"], "stop": "Stop on the 46%."}, {"id": "lab", "grp": "E", "t1": 14, "tier": "LIKELY", "type": "core", "short": "Brooklyn Lab: the hard call", "trig": "&ldquo;hardest decision&rdquo; &middot; &ldquo;crisis&rdquo; &middot; &ldquo;Brooklyn Lab&rdquo;", "core": "Frame: stewardship through a mess; he removed the principal and ran the high school himself for half a year.", "why": "The renewal only means something in context. Stewardship, not a turnaround you drove, but name the mess: a team that did not trust each other, systems that were not in place, COVID, the ownership transfer, two renewals at once.", "keys": "brooklyn lab hardest decision interim principal renewal reauthorized covid crisis superintendent", "label": "14 &middot; The hardest call you have made. Brooklyn Lab.", "hook": "transition superintendent / knots and tangles / a team that didn't trust each other / ran the high school / twice at the same time", "tests": "Whether he makes hard calls and owns them.", "target": "75 seconds", "land": "\"Two simultaneous renewals... Now do that twice at the same time.\" Both were reauthorized.", "avoid": "\"Turnaround.\" That the numbers were false. Blaming the founder. \"Five-year\" renewals (they were three-year), \"SUNY\" (Zeta's authorizer), \"new charter operator.\"", "answer": "<p><span class=\"dcue flat\">set the scene</span> They needed a transition superintendent to help them through renewal as well as recovery. being transferred over to a new ownership. The executive director and founder was trying to exit. … built a remote school, led through COVID, got the schools through both those renewals, And... That wasn't super easy because of some of the knots and tangles that existed there.</p><p><span class=\"dcue slow\">name the mess</span> a huge need… right around COVID… we didn't have strong systems in place, and we frankly didn't have a team that really trusted each other.</p><p><span class=\"dcue beat\">the call, out loud only</span> Your note, 083026: \"i was the princpal at bk lab for half a year bc i decided to remove the principal and take it over bc it needed to be done.\"</p><p>I did not spread myself evenly across three schools, because that is how you fail everything on time.</p><p><span class=\"dcue power\">why the renewal mattered</span> Two simultaneous renewals. A renewal in itself is already a big undertaking. Now do that twice at the same time. A charter renewal is not a project deadline. Missing it does not mean late. It means the schools do not exist next year. Both were reauthorized. <span class=\"dcue stop\">STOP</span></p><p class=\"small\">Your words: Dan call 092526; onsite 090826 (1:07:46); your 083026 note; Story Bank 081226; ONE STORY 091326.</p>", "receipts": ["(5) BROOKLYN LAB"], "stop": "Stop on \"Both were reauthorized.\""}, {"id": "leftkipp", "grp": "E", "t1": 15, "tier": "LIKELY", "type": "core", "short": "Leaving KIPP", "trig": "&ldquo;why did you leave KIPP&rdquo; &middot; &ldquo;what have you been doing since May&rdquo;", "core": "\"The project doesn't end when we run the first successful full cycle. It ends when we run that cycle without me.\"", "why": "Short, clean, no apology.", "keys": "left kipp leave why did you leave since may gap design role one kipp", "label": "15 &middot; Why did you leave KIPP? What since?", "hook": "design and hand-back / runs without me / arm's reach", "tests": "Whether there is a problem behind the exit.", "target": "45 seconds", "land": "Twenty-eight regions, forty-eight high schools. They're running it now.", "avoid": "\"Too many cooks.\" \"I chose to leave.\" Anything critical of KIPP. The Verizon line if it lands wrong.", "answer": "<p>I was brought on as part of the team for the One KIPP initiative, to design, launch, pilot and refine a national high school strategy. We did that, we passed it back to the regional support teams, and it's working. The project doesn't end when we run the first successful full cycle. It ends when we run that cycle without me.</p><p><span class=\"dcue flat\">cut if short</span> But a national foundation can feel a little like working at Verizon, not like working in an incubator or out of your garage. One of my favorite things to do is be part of a small group of people solving the problems within arm's reach, diving in deep as problem solvers. That's the happiest I've ever been professionally. And I'm eager to figure out the AI play.</p><p>Since then I've been building custom AI tools for school leaders, doing school leader consulting, and sales advisory.</p><p>Twenty-eight regions, forty-eight high schools. <b>They're running it now.</b> <span class=\"dcue stop\">STOP</span></p><p class=\"small\">Your words: THE TWELVE ANSWERS block 9 as dictated (Notion, revised 092526); paragraph 2 cut.</p><p class=\"small\"><b>Fact file wording, not a recording:</b> if pressed on the exit: \"KIPP was a two-year role. The position was eliminated after we delivered and met goals.\" (ONE STORY 091326; you confirmed 092826 that both are true.)</p>", "receipts": ["(2) 28 REGIONS, 48 HIGH SCHOOLS, NO MANDATE"], "stop": "Stop."}, {"id": "assocdean", "grp": "E", "t1": 16, "tier": "LIKELY", "type": "core", "short": "A failure: the associate dean", "trig": "&ldquo;a failure&rdquo; &middot; &ldquo;a time you were wrong&rdquo; &middot; &ldquo;growth area&rdquo;", "core": "Frame: a fixed mindset about someone he managed, fixed late, with a happy ending.", "why": "Zeta is \"love your people.\" This shows you own a management miss.", "keys": "failure mistake wrong fixed mindset associate dean develop growth area manager", "label": "16 &middot; Tell me about a failure.", "hook": "fixed mindset / six months / clarity, investment, training, accountability / co-dean now", "tests": "Self-awareness and how he develops people.", "target": "90 seconds", "land": "\"he's now co-Dean of Students with one of my former students\"", "avoid": "Why you left Excel. If asked: you knew you would be leaving at the end of the year. Never the health reason.", "answer": "<p>an Associate Dean of Students who was a wonderful human being, a true friend of mine, but I managed him … he was the guy that everybody loves, the parents just couldn't get upset with him, or if they did, he figured out a way to make it work … that's what he does really well. I'm kind of on the system side of things.</p><p>that worked at first, especially when we were stabilizing the school … <span class=\"dcue slow\">slow</span> <b>what I didn't do is I didn't update my thinking</b> … in years three and four, I wasn't developing him to become a Dean of Students.</p><p><span class=\"dcue beat\">beat</span> I learned I had to leave, and all of a sudden I've got six months before he is now the Dean of Students. And I realized I failed him.</p><p>Debrief-quoted: \"I realized I needed to be crystal clear about what he was good at and what I feel like he needed to develop in.\" … there's a little bit of bumpiness along the way, but within a month, he was clearly meeting well-established targets.</p><p>if I would have started two or three years earlier, he would have been much further down the road, and the school would have been better off, and he would have been better off.</p><p><span class=\"dcue warm\">smile</span> he was the Dean of Students for many years after. In fact, he's now co-Dean of Students with one of my former students. <span class=\"dcue stop\">STOP</span></p><p class=\"small\">Your words: School in the Square onsite 090826, as quoted in THE INTERVIEW REWRITTEN and the DEBRIEF (\"kept verbatim\" fragments; the raw recording is on your Mac). Joined with \"…\", nothing added.</p>", "receipts": ["(8) THE ASSOCIATE DEAN"], "stop": "Stop on the co-dean line."}, {"id": "ask1", "grp": "F", "t1": 17, "tier": "LOCK", "type": "exit", "short": "MUST-ASK 1: which role", "trig": "by minute 10", "core": "Find out the seat without naming it.", "why": "You left the Dan call without knowing the seat or the next step.", "keys": "ask role which seat success twelve months principal manager", "label": "MUST-ASK 1 &middot; The seat. By minute 10.", "hook": "has this role existed / what made that person successful / listen", "tests": "", "target": "one sentence", "land": "They describe the seat.", "avoid": "Naming the Principal Manager title first. Waiting until the end.", "answer": "<p><span class=\"dcue flat\">your Gillian question, asked by minute 10</span> <b>Is this a role that's existed in the past? And if so, What can you tell me about it and what made that person successful or what would you believe is necessary to make this person successful?</b></p><p><span class=\"dcue beat\">follow-up if they answer short</span> What makes it challenging and/or what would make someone wildly successful slash where has maybe where folks again not trying to dig into personal information, but have folks struggled and if so, what can I learn from that?</p><p>Your form that worked with Dan (line 211): \"What, if anything, should I read into the fact that you and I are having a conversation on the school excellence side of things as opposed to operations?\" <span class=\"dcue stop\">STOP</span></p><p class=\"small\">Your words: Zeta screen 091126; Dan call 092526.</p>", "receipts": [], "stop": "Ask and listen."}, {"id": "ask2", "grp": "F", "t1": 18, "tier": "LOCK", "type": "exit", "short": "MUST-ASK 2 + next step", "trig": "minute 20", "core": "One question each, then the next step.", "why": "Grounded in what Zeta is doing this fall.", "keys": "ask question kruti paola campuses ninth graders next step who else", "label": "MUST-ASK 2 &middot; One each, then the next step. Minute 20.", "hook": "what separates year one / biggest concern about my profile / next step", "tests": "", "target": "as needed", "land": "You know the next step and who decides.", "avoid": "Answering your own question.", "answer": "<p><span class=\"dcue power\">the one that got you the rubric</span> FranklinCovey 081826: <b>\"What separates a client partner who make... who make it in year one from ones that don't and being as specific as possible as you can.\"</b> <span class=\"dcue flat\">swap in their seat's name</span></p><p>School in the Square onsite 090826 (debrief-quoted): \"What separates good from great in this role? And what's your biggest concern about hiring someone with my profile?\"</p><p>School in the Square 082426: \"if you had to boil it down to one thing that really the school needs to, the organization needs to improve on, what would it be?\"</p><p><span class=\"dcue flat\">PROPOSED, not yet yours</span> Kruti: what has been hardest to keep consistent campus to campus this fall. Paola: what a great first year looks like by June for the 119 ninth graders.</p><p><span class=\"dcue slow\">then the next step</span> FranklinCovey 081426: \"How quickly are we looking to move on all this, do you know?\" <span class=\"dcue stop\">STOP</span></p><p class=\"small\">Your words: FranklinCovey Part 2 081826 and Part 1 081426; School in the Square 082426; onsite 090826 (secondary). The Kruti and Paola lines are proposed.</p>", "receipts": [], "stop": "Ask and listen."}, {"id": "now", "grp": "P", "short": "What you do now (AI)", "label": "What are you doing right now? The AI work.", "hook": "time / two fears / safe, human-in-the-loop / not for its own sake", "keys": "ai tools now current coverage schedule what are you doing technology", "core": "Frame: principals point him at a problem; he builds the thing that saves them time.", "why": "Only if asked. Do not pitch.", "tests": "", "target": "60 seconds", "land": "Frame: one sentence per tool, then stop. Never pitch the practice to Kruti.", "avoid": "\"Taking off.\" Any claim a tool is running at a school.", "answer": "<p>Right now what I'm doing, which is something I think is really cool, is I am... Talking to the principals I know, finding where They need help with efficiency and effectiveness, what their problems are and figuring out how I can build them custom tools, workflows, apps, solutions, using AI to build the specific solutions that they need and building a suite of tools. which has been really fun and a new challenge for me. And that's been taking off and it's been super fun. So that's what I'm doing right now. It's flexible.</p><p>They point me at a problem, and I build the thing that saves them the time so they can focus on the real work. We've built a suite of around a dozen workflows, tools, automations and agents. We customize them, install them and train folks on them, and we also audit, find a school's specific pain points, and build specific solutions.</p><p>The organizations that embrace this new tech, and learn what their own stance and approach to it is, are going to serve students better. The ones that bury their head in the sand are going to get left behind.</p><p>Sorry, short answer, yes to AI. The longer version of what I'm trying to say is I would imagine in... Any role that I would take in the network I would both bring a AI efficiencies to my work and my natural tendencies are to share those and spread those. So those are things I've done both for this business that I launched as well as I lead a group of... practitioners in a monthly working group that has folks from different charter networks and some of the big tech companies. <span class=\"dcue stop\">STOP</span></p><p class=\"small\">Your words: Dan call 092526; THE TWELVE ANSWERS blocks 1 and 13 as dictated; Zeta screen 091126.</p>", "stop": "Stop.", "type": "core", "receipts": []}, {"id": "whynow", "grp": "P", "short": "Why this seat (your 092826 answer)", "label": "Why this seat? Would you take it?", "hook": "great organization / close to schools, close to decision makers / not a stepping stone", "keys": "why now step down lateral ego superintendent chief level title why this seat would you take level role title step down stepping stone", "core": "\"I want to be part of a great organization, and this is a high impact role that would get me close to schools and close to network decision makers, so it's a great way to get to know the org and the schools and the people.\"", "why": "If level comes up.", "tests": "", "target": "75 seconds", "land": "\"close to schools and close to network decision makers\"", "avoid": "Anything that sounds like a stepping stone. The commute. Keeping your AI practice going.", "answer": "<p><span class=\"dcue flat\">plain, first sentence</span> <b>I want to be part of a great organization, and this is a high impact role that would get me close to schools and close to network decision makers, so it's a great way to get to know the org and the schools and the people.</b></p><p><span class=\"dcue beat\">if they probe the level</span> But a national foundation can feel a little like working at Verizon, not like working in an incubator or out of your garage. One of my favorite things to do is be part of a small group of people solving the problems within arm's reach, diving in deep as problem solvers. That's the happiest I've ever been professionally. And I'm eager to figure out the AI play.</p><p>I would love to say that I adore that mindset and that process it speaks It reminds me of the early days of Excel where we got the best People we could find and figure out what everyone's job was regardless of title and then very much a startup mentality and what that speaks to me is a flexibility, and also I imagine that would be really rewarding at an individual level. <span class=\"dcue stop\">STOP</span></p><p class=\"small\">Your words: your typed answer 092826 (typos fixed, nothing added); THE TWELVE ANSWERS block 9 as dictated; Zeta screen 091126.</p><p class=\"small prepOnly\"><b>Your guard, 092826:</b> this is not a one-year role, so \"get to know\" never sounds like a stepping stone. The commute is a slog you have accepted; never raise it. You will want to keep doing your AI work; never raise it on this call. If AI comes up, your line is on the AI card: \"short answer, yes to AI... in the service of the roles and responsibilities, not for the sake of doing it.\"</p>", "stop": "Stop.", "type": "core", "receipts": []}, {"id": "change", "grp": "P", "short": "How you lead change", "label": "How do you lead change?", "hook": "one thing / clarity, investment, training, accountability / paper is worthless", "keys": "lead change approach leadership style rollout", "core": "\"Paper is worthless until the people are behind it.\"", "why": "If the question is about approach, not a story.", "tests": "", "target": "75 seconds", "land": "\"Knows that paper is worthless until the people are behind it.\"", "avoid": "Reciting a framework.", "answer": "<p>The work I've done is developing systems, learning change management, and now applying tech. DeansList, the push-button academic health system at KIPP, and the custom workflows I'm building now.</p><p>I've seen it at every level. Directly at Excel as a school leader, as a consultant, at Collegiate and Brooklyn Lab at the network level, and nationally at KIPP. And I've made lots of mistakes at every one of them. The approach is the same every time. The first part is the most important part: figure out the one thing we're going after to know if we're on track. Then the systems, structures, mindsets and tools to go after it. It's the Heath brothers' Switch. Direct the rider, motivate the elephant, shape the path. The one thing is really the double-click on shaping the path. It's a narrow focus, intense but not blind, and willing to pivot. We work on a few things, not a hundred different things. And we don't confuse action and effort with outcomes or real progress.</p><p>I think the person you want in this role has credibility and an understanding of the day-to-day work. Knows how to write a system on paper. Knows that <b>paper is worthless until the people are behind it</b>. And knows this work is evolving, and there's a whole new set of opportunities and risks coming.</p><p>And in every situation like this, it's building the plane as you're flying it. I don't have all the answers, and the best idea wins. It's a team of rivals, super smart people with strong opinions, loosely held. A clear vision, clear proposals, and a willingness to be wrong, to disagree and commit. <span class=\"dcue stop\">STOP</span></p><p class=\"small\">Your words: THE TWELVE ANSWERS block 13 as dictated (Notion, 092426). Paragraph 4 cut.</p>", "stop": "Stop.", "type": "core", "receipts": []}, {"id": "growth", "grp": "P", "short": "Growth area", "label": "Your biggest area for growth?", "hook": "narrowing focus / build slow to go fast / first downs", "keys": "growth area weakness criticism", "core": "Narrowing focus.", "why": "One growth area, owned, with the fix.", "tests": "", "target": "45 seconds", "land": "The strategy is first downs.", "avoid": "A second weakness.", "answer": "<p>If I'm being really honest, it's narrowing focus. I know it takes movement on multiple fronts, operations, culture, academics, talent, teacher training. Because I know it's all one package deal, I can overcomplicate it and spread us too thin, and not have a few narrow, viable targets that we stack.</p><p>What I work on is being willing to build slow so we can go fast. Operating in phases. Being okay with some things being not yet.</p><p>Next time I'm directly operating, the school will run off a vision that's explicit about what the first down is, what the plays are, what the offensive line has to do, what the quarterback has to do, what every position has to do. Any player can run for a touchdown, but <b>the strategy is first downs</b>, and it takes a tremendous amount of coordination and cooperation. <span class=\"dcue stop\">STOP</span></p><p class=\"small\">Your words: THE TWELVE ANSWERS block 11 as dictated (Notion, 092526).</p>", "stop": "Stop.", "type": "core", "receipts": []}, {"id": "consult", "grp": "P", "short": "Consultant to operator", "label": "Why go back inside a network after consulting?", "hook": "stay credible / kept a distance before / a promise to principals", "keys": "consultant operator consulting why operate distance", "core": "\"There's no substitute for what it takes to run a school.\"", "why": "The unspoken \"will he stay?\"", "tests": "", "target": "75 seconds", "land": "I can't break a promise to principals.", "avoid": "The hotels line if it sounds flip.", "answer": "<p>I went from operator to consultant because so many schools were trying to do things the Excel way and not doing it well. It felt right, from a moral perspective, to help people on the ground actually do the things we were doing, rather than give them a one-day or two-day visit and a set of manuals.</p><p>Consulting is great. When it works well, it's wonderful, it feels transformative, and you feel like a special guest star on an all-star team. But it doesn't feel like you're in it the same way. It doesn't have that startup energy, move fast and break things. There's a certain distance. I've been lucky to be deep enough in a lot of places to feel some of that, but it isn't the same.</p><p>And if you're a consultant for too long, you start believing only your own ways. You lose sight of the innovations, you get set in your program, and you lose a degree of credibility. There's no substitute for what it takes to run a school. I don't think you can be a great consultant without operating in between.</p><p>A school can't break a promise to kids. A school leader can't break a promise to teachers. <b>I can't break a promise to principals.</b> <span class=\"dcue stop\">STOP</span></p><p class=\"small\">Your words: THE TWELVE ANSWERS block 7 as dictated (Notion, 092526). Paragraph 2 cut.</p>", "stop": "Stop.", "type": "core", "receipts": []}, {"id": "sped", "grp": "Q", "short": "Special education (strength)", "label": "Special education. How have you led it?", "hook": "Collegiate: best SPED operation I know / managed at Excel / oversaw at Lab", "keys": "special education sped students with disabilities ell english learners inclusion", "core": "Frame: Collegiate built it at true deep levels; Excel, he managed it; Brooklyn Lab, he oversaw it.", "why": "Zeta's authorizer has flagged SPED and ELL enrollment. This is your strongest unplayed card.", "tests": "", "target": "60 seconds", "land": "The strongest inclusive-by-design evidence in your record, said as a strength.", "avoid": "\"I learned a ton about special education.\" \"I'm a systems person, not a clinician.\" Managing SPED teachers at Collegiate. Raising Zeta's own ELL or SPED enrollment.", "answer": "<p><span class=\"dcue flat\">lead with it, no hedge</span> They have a true all means all. mission and I was really impressed to see how they had done special education at such true deep levels. And while they had that ambition, they were still trying to figure out, could they be a super high expectations and a high support organization?</p><p>What I came up in was Excel, which was a turnaround, and Collegiate, which was high school focused, special education focused, and a true all means all mission and infrastructure.</p><p><b>Facts (you confirmed 092826):</b> Collegiate, a seven-level special education continuum, including sub-separate low-incidence programs, ED programs, and a post-secondary program; you coached principals and held standards there. Excel, about 30% special education, and you managed it. Brooklyn Lab, you oversaw it. <span class=\"dcue stop\">STOP</span></p><p class=\"small\">Your words: Dan call 092526; THE TWELVE ANSWERS block 10.</p>", "stop": "Stop.", "type": "core", "receipts": []}, {"id": "pushback", "grp": "Q", "short": "A coaching miss at Collegiate", "label": "A time your approach with a principal did not work.", "hook": "wasted a year / systems before buy-in / cleaned it up", "keys": "coaching miss failure principal buy in collegiate pushback", "core": "Frame: built the documents before he had the leader.", "why": "A second failure story if they want one about principals specifically.", "tests": "", "target": "60 seconds", "land": "Yes, I cleaned it up, but it was a failure.", "avoid": "Naming the principal or the school.", "answer": "<p>Your words, 082626: \"focused on building the systems and the structure of the documents and did not insist on the leader's buy-in, or even their time and their sign-off.\" \"that school fell as a result of it.\" \"a real, genuine failure that had real, measurable impact. Yes, I cleaned it up, but it was a failure.\"</p><p class=\"small\">Your words: verified-facts L1202, via PRINCIPAL MANAGER TRACK 092026. The principal stays unnamed.</p>", "stop": "Stop.", "type": "core", "receipts": []}, {"id": "pay", "grp": "R", "short": "Compensation", "label": "Compensation expectations? (never raise first)", "hook": "right team over cashing in / top of the band", "keys": "compensation salary pay range band money", "core": "Frame: never raise it; top of the band.", "why": "Debrief: Principal Manager band $125K to $175K; your salary of record $175K; your rule is to ask for the top of the band.", "tests": "", "target": "20 seconds", "land": "Frame: the band works, and the fit matters more. Your number set before 3.", "avoid": "Naming a number first.", "answer": "<p>Yes. I think the top of that range is... Would work. Yeah. And I understand what you're saying and I appreciate you saying it clearly. But yeah, I want to join the team. Yeah. … I'm very happy to be part of the right team. That's where I've been the happiest in my life.</p><p class=\"small\">Your words: DREAM screen 081726, when the band was $145K to $165K. Cut: \"I'm not at a place in my life where I need to cash in\" (flagged in the IP debrief extract).</p><p class=\"small\"><b>Fact file wording, not a recording:</b>
