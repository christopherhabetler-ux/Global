<script>
var D={"p1": [{"t": "Intro", "x": "Zeta. Paola Zalkind and Kruti Mehta. The listen file, part one.\nFor Tuesday, September twenty-ninth, three o'clock Eastern. Thirty minutes on Zoom, two people.\n\nHere's how this tape works. The coach parts are framing, nothing more. Every answer you hear is your own words, cut from your dictated answers, your interview recordings, and your own writing. Nothing in the answers was written for you. Where a line was cut, you'll hear a pause. Play it on a walk. Don't take notes. The job is just to hear your own career in your own voice until it's automatic.\n\nWhere you are. The operations seat is closed. Felipe passed you to the schooling side, and Dan's first real question was about managing principals. So the seat in play is almost certainly the principal manager seat. Don't name it first. Let them say it.\n\nWho's in the room. Paola Zalkind is Chief Schooling Officer. She manages Zeta's school leaders. Teach For America, then Success Academy, from kindergarten teacher to founding principal of Union Square to Managing Director of Schools, then Director of Leader Development at KIPP New Jersey, then Zeta. She built principals for a living. She's the principal-manager decision, and she'll push for proof.\n\nKruti Mehta is Managing Director of Scaling School Excellence. Accenture, then B C G, then Zeta in its second year, then a Booth M B A. She's the consultant's lens: codify what works, launch new schools with fidelity. She probably needs someone with school-leader credibility beside her. Don't pitch your practice to her.\n\nFour rules, from the Dan debrief.\nOne. The first sentence is the claim. The last sentence is a person or a number.\nTwo. Every principal answer ends on proof. Carver. Brooklyn Lab. The forty-six percent. With Dan, one of five answers did.\nThree. Ask your first question by minute ten. With Dan you asked nothing until time was up.\nFour. Two minutes, then stop. Two of them, thirty minutes.\n\nAlright. The cards, in order. Sixteen answers, then your two asks."}, {"t": "Card 1. Walk me through your background.", "x": "Card 1. Walk me through your background.\n\nThis one opens almost every call. Two and a half to three minutes. Skip the paragraph about the kids for Zeta. Keep Brooklyn Lab moving. It ends on why Zeta.\n\nHere it is, in your words.\n\nI started as a teacher in DC, then went to Excel Academy up in Boston. We were doing a turnaround. I was on the leadership team running culture and operations, and we took the school from 270th in the state to number one and got National Charter School of the Year.\n\nWhile I was there I built a tool we needed and turned it into DeansList. I grew it from zero to 275 schools. It's in over a thousand now, though I haven't been affiliated with it in years.\n\nWith Excel's success, we were getting hundreds, if not thousands, of visitors a year. A lot of those folks wanted to figure out how to bring what we were doing back to their schools, and some of them became my first clients. So I launched a consulting practice. And I got to walk into 100 different schools, find and fix problems, help people improve systems, help each principal set their goals and figure out how to meet them. KIPP, Uncommon, Achievement First, most of the regional, local and midsize operators.\n\nThen I found a client I was really keen on, Collegiate Academies down in New Orleans, a true all-means-all network. I was brought down to Carver to work with a principal who was unclear whether or not he could do the job. He went on to be Louisiana Principal of the Year, and now he runs the organization. That work created the chief culture officer role, so I moved down and was Chief Culture Officer for five years. We slashed suspensions while greatly increasing teacher retention and student and family satisfaction.\n\nThen we came back to Brooklyn, because my wife is from New York and the plan was always to raise our two girls here. Or at least that was her plan. But we're here now and loving it.\n\nI was superintendent at Brooklyn Lab for a transitional period. I was there to stabilize, lead and pass off. We led through COVID. We opened a fully remote school while keeping the in-person school up and running simultaneously. And we took both charters through renewal at the same time, and both were reauthorized. That wasn't super easy because of some of the knots and tangles that existed there.\n\nThen two years at the KIPP Foundation, trying to bring 28 wonderful but very independent regions into some degree of alignment, and we built a national high school strategy and handed it back to the regional teams, who run it now.\n\nAnd now I'm doing a really cool thing, or at least I think it's very cool. I build custom AI tools for school leaders. They point me at a problem, and I build the thing that saves them the time so they can focus on the real work.\n\nThe happiest I've ever been is in a mid-sized, growing charter network with outsized ambition. That's what my research says you all are. And this role is a perfect blend of the really cool work I'm doing with custom tools and an ambitious, growing charter. So that's what brought me here.\n\nLand on this. He hears a school person, and the last line points at Zeta.\n\nThen stop. Stop at \"that's what brought me here.\" Then the role question, if they pause."}, {"t": "Card 2. Why Zeta? Why this side of the house?", "x": "Card 2. Why Zeta? Why this side of the house?\n\nThe ops seat is closed, so this has to be a clear yes to the schooling side. The third paragraph is your own answer from tonight about the seat.\n\nHere it is, in your words.\n\nThe idea that the job is focusing on initiatives, the ones that transition from launch into practices that the entire organization uses. And this, I think if there was one thing to sum up what I've been doing my whole career as a, in New York, Network offices at CMOs and as a consultant, it's been this like building things that other people can run.\n\nI both like doing that work and I also like... Building systems. and structures and practices that people buy into on merit, not out of obligation.\n\nI want to be part of a great organization, and this is a high impact role that would get me close to schools and close to network decision makers, so it's a great way to get to know the org and the schools and the people.\n\n... the happiest I've ever been is in a midsize growing charter network that has wildly outsized ambition and is full of smart, aspirationally aligned folks. And my read is that you all might be that place and that this role just really spoke to me as a perfect blend of what I've done, what I want to do, and where I might want to be.\n\n... excellence with exploration on what that means seems really cool to me. I do have a lot of high school-specific experience in operations, culture, and academics. And so there's something cool about like the high school question. I love being in environments where it's like best idea wins, strong opinions, loosely held. Let's debate the heck out of things. Let's attack people's ideas without attacking people.\n\nLand on this. He wants this work, at this network, now.\n\nThen stop. If they ask about ops: Felipe thought your strongest fit was the schooling side, and after the Dan call you see the logic."}, {"t": "Card 3. What's your philosophy on managing people, or leaders? (Also: the good principal w", "x": "Card 3. What's your philosophy on managing people, or leaders? (Also: the good principal who needs to get to great.)\n\nPaola's core question, most likely as your philosophy on managing people or leaders. This is your dictation from today: trust, clarity, support, accountability. It ends on Carver.\n\nHere it is, in your words.\n\nWhat you're saying, in one breathTrust is everything, and it's earned, not assumed. Clarity and transparency so nobody guesses. Support that makes people better: you show you can do the job, and every coaching meeting is prepared like your best lesson. Accountability as the thing that builds the relationship, not the thing the relationship permits.The answer · about 75 seconds\n\nTrust is everything, and you earn it through three things: clarity, support and accountability.\n\nClarity first. We're aligned on what we're going for and what your role is in it, and you know what to expect from me. I'm transparent about where we're headed and why, so nobody's guessing.\n\nSupport. My job is to make you better, and to do that I have to show you I can do the job. Sometimes that means modeling it, showing you what excellent looks like, bringing the exemplar. Every coaching meeting should be as well prepared and thought out as the best lessons we teach. It's teaching time, not talking time, because I'm teaching every second whether I like it or not, with every action and every inaction.\n\nAnd accountability. People usually say you need a relationship before you can have accountability. I think it's the other way around: you can't have a relationship without accountability, at least not for very long. People are watching to see whether you care enough to hold them to a high standard, whether you know what you're talking about, and whether you're willing to say what needs to be said. The best teachers and coaches any of us had were the most honest with us. We knew where we stood. Done well, that's what makes the relationship closer.\n\nThe best example is Jerel.\n\nThe proof · Jerel, about 45 seconds\n\nI was brought in to Carver as a consultant with one question: do we keep this leader? Jerel was the founding principal, a really compelling leader, and his school was struggling. Teachers were frustrated, and kids were opting out.\n\nWhat I saw was a high-potential leader getting a lot of feedback that things weren't good enough, and very little help. So I worked shoulder to shoulder with him, on the floor, with high doses of real-time feedback, mostly affirming. I named the relationship that needed to be reset. And we put what he was great at on stage.\n\nIt worked. Jerel went on to be Louisiana Principal of the Year, and today he's CEO of Collegiate Academies.\n\nLong version · your dictation, cut only\n\nI'm going to talk about trust, clarity, support, and accountability. The point I want to make is that we kind of work in that order, but it's also not linear. These concepts also all feed into each other, right?\n\nTrust is everything because you get trust from clarity. You get trust from being valuable and reliable. That's the support. You get trust through this idea of people knowing what's expected of them and what they're going to expect from you. There's this idea of predictability, clarity, transparency, aligning on purpose and mindset, showing people you're there for the right reasons, and having a degree of legitimate human care, concern, understanding, and validation.\n\nA great meeting doesn't end with a list of principal next steps. A better meeting ends with things being done, skills being applied, and skills being built and applied. Better than that, meetings aren't regular, standard office meetings, right? They're on the floor doing the work.\n\nThe best development meetings I've ever had have either been: Let's go to the problem, real-time coach.... Or: Let me show up to the meeting so prepared that, while we might be using guided discovery as part of it, there is a delivery. There's an exemplar that I'm ready to bring. There's a clear lesson, and it's not an \"I do, we do, you do\" lesson, but it's as intentional, as objective-driven, and requires as much preparation as your best lessons.\n\nBecause if I want a principal to have a tough feedback conversation, they need to see an example of it. I can't just wing that. We can't show up and expect to talk our way into improved understanding, or we can't converse our way into transforming the school. We have to teach our way into it, into that side-by-side work, and that's incredibly intentional development.\n\nNobody's time is more valuable in the school than the principal's. Therefore, my job is to model for the principal to be the example. It's an incredibly high-stakes role, and it means, effectively, that every minute I'm on stage, every minute I'm modeling, because every minute they're learning.\n\nThe accountability, which is that no one's guessing where they stand. Adam Meinig's two questions: Are they doing the right work? Are they doing it incredibly well?\n\n95% of my time, I'm in my support role. We're in this together. My success is your success, but what that also means is I'm never not saying the thing. I'm never lowering the bar. I'm never rounding up. I'm never letting a thing slide. If I'm going to keep someone's trust, they have to know that I'm telling the truth.\n\n90% of the time, when they make a mistake, they know it's a mistake. They're looking to figure out whether or not I'm willing to acknowledge it, help them work through it, and learn from it and get better as a human being.\n\nThe accountability feeds the trust.... Knowing that I'm your biggest cheerleader, but I'm also part of being your coach: watching the game tape and pointing out where the mistake was made because I totally believe in you. I, of course, care enough about you to say the thing and to show you the better version.\n\nJerel received Louisiana state's Principal of the Year in our fourth year together and is now CEO of Collegiate Academies.\n\nLand on this. Jerel went on to be Louisiana Principal of the Year, and today he's CEO of Collegiate Academies.\n\nThen stop. Your last words are \"CEO of Collegiate Academies.\""}, {"t": "Card 4. Tell me about a principal who was struggling. What did you do?", "x": "Card 4. Tell me about a principal who was struggling. What did you do?\n\nYour best proof for a job managing principals, and with Dan it came out as one word, successful. This is your written account of it.\n\nHere it is, in your words.\n\nI first started working with Jerel Bryant as a consultant. Jerel was the founding principal of Collegiate Academies Carver High School, then in its third year. He was (and still is) a really compelling and charismatic leader. At the time, his school was really struggling with academic results, student culture and community relations. I was tasked with answering the question: do we keep this leader, can he be successful?\n\nWhen I arrived I found teachers highly frustrated with students and operating as \"negative controllers\" and students responding by pushing back, skipping class, opting out of learning.\n\nKnowing we had a high potential leader in Jerel, I sought to build him up as the model for how we should be operating with students and helped him build enabling systems to help the school function smoothly. I did this by primarily working shoulder to shoulder with him and giving him incredibly high doses of real time feedback - primarily affirming feedback that empowered him and built his confidence to help him stop second guessing himself.\n\nI clearly named that this frayed relationship needed to be reset and helped them come into alignment, focusing them on results and impact rather than narratives of blame.\n\nI helped Jerel be the leader of the campus by getting out of his office and on to the floor - we spent hours and hours real time coaching and modelling. Jerel was very good as a teacher and was good with student interactions, so we took the approach that we needed to put that on stage and show teachers and students what it looks like to effectively invest, direct and redirect scholars. It worked. Students started to feel like school was safe, predictable and purposeful.\n\nJerel received Louisiana state's Principal of the Year in our fourth year together and is now CEO of Collegiate Academies.\n\nLand on this. Jerel received Louisiana state's Principal of the Year in our fourth year together and is now CEO of Collegiate Academies.\n\nThen stop. Your last words are \"CEO of Collegiate Academies.\""}, {"t": "Card 5. Have you managed principals? Have you been a principal?", "x": "Card 5. Have you managed principals? Have you been a principal?\n\nIf she asks whether you've managed principals, or been one. Plain, no hedge. Interim goes out loud only.\n\nHere it is, in your words.\n\nI was superintendent at Brooklyn Lab for a transitional period. I was there to stabilize, lead and pass off.\n\nsuperintendent role at Brooklyn Lab and so that was overseeing three schools... But that was where I was responsible for the academic results directly through the principals I led all the summer onboarding, all of the learning and development. that at the network level and then of course through the principals.\n\nTwo of my three schools did not see their superintendent in their building for a semester. They got their principal and my phone. What they needed from me was a decision maker who answered fast, not a superintendent who visited. I made that trade at the semester line, not in June.\n\nI was brought down to, as a consultant, I was brought down to Collegiate Academies. You know, spoiler alert, I went and worked there full time for Five years after this consulting arrangement. So this is a story of like most of my work as a consultant and then later as chief culture officer. But I was brought down as a last ditch effort to assess whether or not the principal could be successful. They'd tried everything and things just weren't working.\n\nYour note, 083026: \"i was the princpal at bk lab for half a year bc i decided to remove the principal and take it over bc it needed to be done.\"\n\nLand on this. What they needed from me was a decision maker who answered fast, not a superintendent who visited.\n\nThen stop. Stop after the interim line."}, {"t": "Card 6. What should high school be? What needs a structural rethink?", "x": "Card 6. What should high school be? What needs a structural rethink?\n\nDan's biggest problem is the high school, and it rolls up to Paola. Open with the claim, not with what you don't know. The seating chart paragraph is the one to cut if time is short.\n\nHere it is, in your words.\n\n... high school can't be like middle school just with a couple of dials turned. We get into a lot of and I think that's what a lot of folks have done. Because like you said, some of the things wear off, some of the things that compelled students in middle school either don't hold for different reasons. Number two, we can't overcorrect and we can't undercorrect on our systems and our structures. When we try and go too far and we don't have any systems, students are looking left and looking right and being like, \"Do you even have it together? What is going on? This is not what I signed up for.\" At the same time, if we don't evolve them in strategic ways, you guys are treating me like I'm still in middle school. And so I would think about it the way I think about my classroom, which is I'm starting a new school year. It's a new group of students. I'm teaching something different. What is it that I did in the past that worked that I need to replicate for this group? And I think it would be about defining a wholly different identity, making sure that this was one that was resonant with students and that we had a spine, a skeleton of the same values, but we dressed it entirely different. And I don't mean dress in terms of faking or putting on just bells and whistles. What I simply mean to say is our values are still our values. But how they show up and what they look like and what the experience of a student is going to be does need to be fundamentally different.\n\nI would ideally have us start at the end of seventh grade and begin a transition towards independence. In eighth grade, one of the things we did at Excel and we started to do at collegiate was run the second semester of each of those years as intentional transition points where we said, \"We're going to remove the seating chart. Before we do that, we're going to teach you why it existed, what are the choices people are making, what does it look like to choose the seat?\" And then we let kids fail. Sorry, I should say, we let kids choose their own seat. Some of them did well, some of them didn't. And we didn't immediately jump in and say, \"Okay, fine. Here's where you sit.\" We let it run and we let kids sit with and see what the outcome, how the outcome of that two-weeks grading cycle, how it changed. And we reflected with them and gave them another opportunity, again, to choose. And we did three to four cycles of that for multiple discrete skills such that we were taking all of our we were taking, let's say, 40% of our 50% of our systems that were meant as placeholders or substitutes for the real skill, the student choice, the student understanding of why. So this is the org system. This is office hours and tutoring, student materials, late homework, or late work policy. And we systematically took those back, gave, like I said, the front-end instruction, the opportunity to try it out, and multiple cycles of that. And I think that's where I would want to start doing that in eighth grade so that we could do that in high school. And I think it's hard, though, because if you start that exact strategy in high school, are we really willing to say to students that we're going to take the first semester of their year and let things slide or let things slip? Because that's obviously highly problematic. So I think what I would try and do is find a way to apply some of that same logic.\n\nI would take a look at my middle school plays. I would say, \"Which 25% of these no longer make sense? Or what are the 50 that are core we're going to keep? What are the 25% that don't make sense anymore or we don't need them? And then what are the 25% that we are going to intentionally do pretty quick gradual release with instruction and reflection as a primary starting point?\" All built around aiming at a different identity and an endpoint rather than we did in middle school because middle school is obviously focused on the high school portion of it. So then we have to focus on the lives of unlimited opportunity and what that means to a scholar in terms of what they need to do to advance and arrive at the right place. That year, 46% of ninth graders across all 48 high schools finished the quarter at a 3.0 or better. Up six points. Best quarter KIPP had ever had on that number.\n\nLand on this. Lives of unlimited opportunity, and what a ninth grader needs to do to get there. Then the 46%.\n\nThen stop. The 46%, then stop."}, {"t": "Card 7. Beyond systems, what would you change about high school?", "x": "Card 7. Beyond systems, what would you change about high school?\n\nDan's follow-up. For Paola, it shows culture as academic identity. Keep it under two minutes.\n\nHere it is, in your words.\n\nIt sounds like you're in a place that where I think we got to a place at Excel where things were functional, things were academically focused, things were working. Were they perfect? No, of course not. But were they functional? Yes. And one of the corners that we turned two corners that made all the difference. One was what was teacher doing bell to bell in terms of rigor and instruction that gave us a sense of purpose and built an academic identity of cool to be smart, cool to work hard, and driving that as whereas in middle school, it might have been more focused on incentives and rewards or team. We switched it to a little bit more of an individual and more of an academic rigorous folk. It's not fun because it's fun. It's fun because it's challenging. And so building a true academic scholarly identity is number one. And number two, we always talk about student ownership over culture and over the school. And oftentimes, those end up being thin and surfacey. And so what I would do, I believe, would be something we did at Excel, which is to develop a lot of genuine student groups that play a key role, not just in the planning of the dance or the student council, but that are actually operating within the school day to help the school operate, to build the students who are involved in it to build their place and identity, but also so other students could see that this is the school that both trusts, empowers students, and those students are actually doing the thing incredibly well. So we'd have an honor council, right? And that honor council would be entirely responsible for within limits, of course, but doing a bit of investigation, evaluation around honor code violations, making recommendations. And we would put them front and center in terms of as much as we could from a legal and reasonable parent perspective, putting them in the position of understanding, deciding, and supporting scholars who are struggling. We would have groups that are intentionally owning and planning some of our joy factor or student events. All of these would be undergirded by our values. So not only would the group of the ninth-grade events committee be planning the dance, they'd be hyping the dance, they'd also attach a service commitment to it or a canned food drive to it. And they would be the ones making the announcements. They would be the one speaking and doing all of the things that oftentimes we have adults still do, even though behind the scenes, students are doing it. So it's really moving kids from supporting the school from an aspirational idea to action, but also to a level of doing it actually quite publicly. And that is where in a high school of 150 students, first year, 150 students per grade, you can get it so that more than a third of those students at any given time is in a meaningful group like this. And so they're part of one, and then they're seeing three to four others. And that's how we really get students to get that feeling of not only is this high school and it's different, it's also my school. And so we have this we build this identity of belonging such that when students are joining I mean, one of the big groups we would do, and I'll leave it at this, is our orientation leaders. We would have sophomores and juniors leading our freshman orientation, 50% of it, right? We would help prep them. We would help we'd spend a lot of time getting them to be incredibly good at this. We'd record a lot of video so that we could show what it looks like. But we would, as adults, be saying a whole lot less and helping our students say a whole lot more.\n\nLand on this. As adults, we would be saying a whole lot less and helping our students say a whole lot more.\n\nThen stop. Your last words are \"say a whole lot more.\""}, {"t": "Card 8. When is a practice ready to scale? Playbook or principal autonomy?", "x": "Card 8. When is a practice ready to scale? Playbook or principal autonomy?\n\nKruti's lane. Earn it, in plain words, means a new principal runs the proven play until the school is stable and functional, and that earns the room to change it. Pair it with how you invest in people.\n\nHere it is, in your words.\n\n... Now, in contrast that with Excel, where we had playbooks for everything, we were unapologetic about the adult culture values, the way in which we did things, and we replicated not quite as cloning. I don't use huge, but the principal who started our second school and then our third school inherited 95% of the play was exactly the same. We wanted to maintain an opportunity for innovation because we recognized that innovation, one, you don't get to keep the right talent if you don't allow for some of that. And two, that's the laboratory where all the other schools can get better because we're trying something new. So fundamentally, we were clear on who we were. We were unapologetic about growing meant starting from a proven starting point and growing at a pace such that we could maintain the level of talent that we needed to do that incredibly well. And yeah, at the end of the day, our philosophy was we are here to build dynasties, to create radical transformations so students could live lives of unlimited opportunities. ...\n\nEarn that, right? Get to the place of stable, get to the place of functional, then let's have a conversation about innovation. But for right now, we need to run the play because the play works. The play is not perfect. The play is going to evolve. You're going to be part of that evolution. But the way in which we grow with quality is starting from a solid foundation of what we know that works. And what's really cool is Excel right now, the two data points I love to share is number one, the high school is in the top 3% of all public high schools across the country. And even better, Jackie, who I had in fifth, sixth, and seventh grade, now has my old job.\n\nLand on this. the high school is in the top 3% of all public high schools across the country. And even better, Jackie... now has my old job\n\nThen stop. Your last words are \"now has my old job.\""}, {"t": "Card 9. How do network systems actually work for the people in schools?", "x": "Card 9. How do network systems actually work for the people in schools?\n\nFor Kruti, if it's about central office and schools. These are your lines from the School in the Square onsite, as the debrief quoted them.\n\nHere it is, in your words.\n\n\"Well, it's simple. They aren't designed at the network level.\"\n\n\"I'm not saying that to be glib\" · \"what's working at one school\" · \"what are the attributes of that that make it work\" · \"let's limit the scope, let's follow the bright spot\"\n\n\"The policy might be made in this room, but the people in this room are the operations directors themselves — because then, even if you don't agree with it, you at least know your opinion was heard.\"\n\nLand on this. Even if you don't agree with it, you at least know your opinion was heard.\n\nThen stop. Your last words are \"your opinion was heard.\""}, {"t": "Card 10. How do you get schools to adopt something they don't have to?", "x": "Card 10. How do you get schools to adopt something they don't have to?\n\nAdoption without authority. Zeta is growing fast and Kruti needs schools to want the playbook. Don't put the forty-six percent in the same breath as the twenty-eight and forty-eight.\n\nHere it is, in your words.\n\nFor folks who don't know it, the KIPP Foundation is the national arm. Strategy, support and oversight. But it doesn't have mandate authority. Twenty-eight independent regions, which you can think of as twenty-eight independent districts, and forty-eight high schools. Nobody had to say yes to what we were doing, so we had to use influence and the quality of our ideas to get them to want to say yes.\n\nFirst thing we did was we made the change theirs. Every single region was part of our listening tours, part of our iterative feedback, part of our working groups, so that when we announced what the strategy was, I was looking at people in the eye, watching them nod. All 28 regions and all 48 high schools adopted the strategy. There was an alternate path, and no school chose that alternate path.\n\nSecond, we didn't go for all twenty-eight at once. We shrank the change. We let our stronger regions get early wins, and let that win sell the rest of the product. Because of the clarity and quality of our tools, we were able to stack early wins, and the early wins sold the future work. It built a positive flywheel.\n\nThird, we kept our finger on the pulse. We paid attention to the micro signals, the small, not-so-small things that tell you whether people are on board with you or turning off.\n\nThe one I'd point to is academic health. We started with clarity, we wrote the academic procedures manual, we rolled out training making it as simple as we could, and then we built a push-button data analysis tool that took eight thousand rows of data and got a teacher, a student and a school an individualized, actionable report. The data went from present but obscured to right in front of them. We piloted it, and it was highly effective.\n\nThat year, 46% of ninth graders across all 48 high schools finished the quarter at a 3.0 or better. Up six points. Best quarter KIPP had ever had on that number, and twenty schools hit the goal, which was also the most ever.\n\nWe built it, we tested it, it worked, and we handed it off. Now the regions are running the play.\n\nLand on this. We built it, we tested it, it worked, and we handed it off. Now the regions are running the play.\n\nThen stop. Your last words are \"Now the regions are running the play.\""}, {"t": "Card 11. An initiative you led from design through implementation across schools.", "x": "Card 11. An initiative you led from design through implementation across schools.\n\nAn initiative from design to scale. This is your answer from the DREAM screen, and it ends on the number.\n\nHere it is, in your words.\n\nThe Academic health data transparency work that was a subset of our larger academic health work so I'll I'll set the scene a little bit. Every school on our network had grade books, they had tons of data, All of that data was in these large CSV files and Excel files. and While it was accessible or while it was there, people couldn't really use it.\n\n... Using Claude Code to build A Python script that parsed out these huge data sets and with the push of a button created individualized teacher reports Telling them, you know, here are the students of concern, the assignments of concern. Here's where you don't have enough of a certain type of assessment. Here's where, you know, you're Your grades seem to be skewing. So we got people weekly high quality personalized data that we were able to compare to a standard. We did the same thing for students.\n\nI designed this for one particular school, rolled it out at that school, and then we took it across the country. And so, We built these reports through the AI. Then we created a regular meeting cadence We created a team at the school I was looking into these things and was leading the work on the ground.\n\nAnd what we ended up seeing was instead of people waiting till The end of the quarter to finish the grading or to tell students where they stood and what needed to happen, they were able to do that. weekly and just the fact that the data went from present but obscured to right in front of them, drove a tremendous amount of positive change because, again, they could look at it and they could see This is where I'm falling short. This is where this student is struggling.\n\nWe then took that across the country and we were able to see the biggest jump in GPA year over year in that, in the last year. That year, 46% of ninth graders across all 48 high schools finished the quarter at a 3.0 or better. Up six points. Best quarter KIPP had ever had on that number.\n\nLand on this. That year, 46% of ninth graders across all 48 high schools finished the quarter at a 3.0 or better. Up six points. Best quarter KIPP had ever had on that number.\n\nThen stop. The number, then stop."}, {"t": "Card 12. How do you launch a new school or onboard a first-year principal?", "x": "Card 12. How do you launch a new school or onboard a first-year principal?\n\nZeta has Flushing, Tremont Park and the high school all in year one. This is how you launched a school.\n\nHere it is, in your words.\n\nI came into Excel Academy with a mandate for change, in a turnaround year. We had an entire new staff. We stopped growing for a year because things were in such rough shape. We literally had a hundred students. I think about it in three phases.\n\nPhase one was stability. An all-new staff needed clear leadership. I was dean of students, forty percent of the staff reported to me, operations included, and I was the most experienced educator on the leadership team. So I took the consistency and clarity from my classroom, the routines, procedures and systems, and brought them to the entire school. I spent six days writing the playbook on how we were going to do everything, my culture manual and my operations manual. My boss at the time thought that was a crazy use of time. It became one of the most important things we did.\n\nPhase two was the adults. We really focused on the five dysfunctions of a team, and built a strong, best-idea-wins culture. Then we created an academic-focused environment where it was cool to be smart, and rigor and engagement were the primary drivers.\n\nPhase three was student ownership. Honor council, a student events committee, lots of student committees. The principal and I taught classes throughout the year. We built an orientation leader program that put students in formal positions to speak to other students in genuine ways. On the first day of school we had kids telling kids how overwhelmed they were at first, and that they'd even told their parents they didn't like the school.\n\nWe took that school from 270th in the state to number one, and got National Charter School of the Year.\n\nLand on this. We took that school from 270th in the state to number one, and got National Charter School of the Year.\n\nThen stop. Your last words are National Charter School of the Year."}, {"t": "Card 13. You're known for systems and culture. Why trust you with academics?", "x": "Card 13. You're known for systems and culture. Why trust you with academics?\n\nThe likeliest doubt about you for a schooling seat. Yes and no, then everything upstream, then the proof. The CREDO line now belongs to Carver.\n\nHere it is, in your words.\n\nYes and no. My reputation, for better or for worse, is very much of the systems and culture and less of the academic. I am not the person who's going to know the twelfth grade AP government standards cold.\n\nWhat I've owned is everything upstream of that. People brought me in to work on behavior, and what we realized every time is that until operations are stable, it's really hard. You have thirty kids in a hallway and nobody knows where to go because their schedule is wrong. The role of operations, in my mind, is to be the first line of defense to take care of things, so the real rock stars, the teachers and students, can go shine.\n\nWhat I came up in was Excel, which was a turnaround, and Collegiate, which was high school focused, special education focused, and a true all means all mission and infrastructure.... One of our schools, Carver, had the largest CREDO effect size in the country.\n\nAnd I have led it. At KIPP I led academic health at a national level, across forty-eight high schools. GPA, course failures, attendance, and whether a kid feels like they belong. We piloted it at one school where I led it directly, though I wasn't coaching half the teachers. And when I was interim high school principal at Brooklyn Lab, while serving as superintendent, instruction was part of my role.\n\n... that year forty-six percent of ninth graders finished the quarter at a 3.0 or better, up six points. Best quarter KIPP had ever had on that number.\n\nLand on this. Best quarter KIPP had ever had on that number.\n\nThen stop. Your last words are the 46%."}, {"t": "Card 14. The hardest call you have made. Brooklyn Lab.", "x": "Card 14. The hardest call you have made. Brooklyn Lab.\n\nThe renewal only means something in context. Stewardship, not a turnaround, but name the mess. The decision itself stays out loud only.\n\nHere it is, in your words.\n\nThey needed a transition superintendent to help them through renewal as well as recovery. being transferred over to a new ownership. The executive director and founder was trying to exit.... built a remote school, led through COVID, got the schools through both those renewals, And... That wasn't super easy because of some of the knots and tangles that existed there.\n\na huge need... right around COVID... we didn't have strong systems in place, and we frankly didn't have a team that really trusted each other.\n\nYour note, 083026: \"i was the princpal at bk lab for half a here it's like best idea wins, strong opinions, loosely held. Let's debate the heck out of things. Let's attack people's ideas without attacking people.\n\nThen the next step, and who else you'd talk to. Not, you know the story.\n\nThat's part one. The first sentence is the claim. Every principal answer ends on Carver, Brooklyn Lab, or the forty-six percent. Ask by minute ten. Two minutes, then stop. And let the silences be theirs."}], "p2": [{"t": "Intro", "x": "Zeta. The listen file, part two. The bench, and the traps.\nSame rule as part one. The coach parts are framing. The answers are your words."}, {"t": "Bench 1. Why this seat? Would you take it?", "x": "Bench 1. Why this seat? Would you take it?\n\nWhy this seat, and would you take it. The first line is yours from tonight. The guards behind it: it's not a one-year role, so it's never a stepping stone. The commute is a slog you've accepted, and you don't raise it. Your AI work, you don't raise on this call.\n\nIn your words.\n\nI want to be part of a great organization, and this is a high impact role that would get me close to schools and close to network decision makers, so it's a great way to get to know the org and the schools and the people.\n\nBut a national foundation can feel a little like working at Verizon, not like working in an incubator or out of your garage. One of my favorite things to do is be part of a small group of people solving the problems within arm's reach, diving in deep as problem solvers. That's the happiest I've ever been professionally. And I'm eager to figure out the AI play.\n\nI would love to say that I adore that mindset and that process it speaks It reminds me of the early days of Excel where we got the best People we could find and figure out what everyone's job was regardless of title and then very much a startup mentality and what that speaks to me is a flexibility, and also I imagine that would be really rewarding at an individual level."}, {"t": "Bench 2. Special education. How have you led it?", "x": "Bench 2. Special education. How have you led it?\n\nSpecial education is a strength lane. Lead with it, no hedge. Collegiate built it at true deep levels. Excel, you managed it. Brooklyn Lab, you oversaw it.\n\nIn your words.\n\nThey have a true all means all. mission and I was really impressed to see how they had done special education at such true deep levels. And while they had that ambition, they were still trying to figure out, could they be a super high expectations and a high support organization?\n\nWhat I came up in was Excel, which was a turnaround, and Collegiate, which was high school focused, special education focused, and a true all means all mission and infrastructure.\n\nFacts (you confirmed 092826): Collegiate, a seven-level special education continuum, including sub-separate low-incidence programs, ED programs, and a post-secondary program; you coached principals and held standards there. Excel, about 30% special education, and you managed it. Brooklyn Lab, you oversaw it."}, {"t": "Bench 3. What would you want to own in year one?", "x": "Bench 3. What would you want to own in year one?\n\nIf they ask what you'd own in year one. Your ninety-day note, then the onsite lines. The last line is a proposed frame, not yours.\n\nIn your words.\n\nYour note (CH feedback for NCS prep): \"For first 90 days, we would start observing and listening this year. Absorb. Listen. Think.\"\n\nSchool in the Square onsite 090826, as quoted in the debrief: \"people need their reality to be heard, valued, and considered before they're asked to do something different\" · \"let's limit the scope, let's follow the bright spot\" · \"I stopped thinking I knew everything and really listened\"\n\nPrincipals, the way Dan described the job. Ninth-grade academic health for the high school. Proof: Carver and the 46%."}, {"t": "Bench 4. How do you hold a leader accountable and keep the relationship?", "x": "Bench 4. How do you hold a leader accountable and keep the relationship?\n\nHolding a leader accountable and keeping the relationship. Zeta says love your people. This is how you hold the bar and love the person.\n\nIn your words.\n\nWe recognize that it's a false choice between high expectations and high levels of accountability. We recognize that it's a false choice between doing right by kids and doing right by staff. Obviously, like when we started getting into those, Zero-sum games where we're talking about Either or, we're recognizing that it's We're all on the same team and it's a both/and. And so what that looks like to me is Clarity up front such that I can I can assume the best. when I'm holding someone accountable and I lead with a curious question, But I also don't then shy away from because we have the clarity, because we've inquired to find out what the context is. And I have strong interpersonal relationships. I don't have to shy away from the context. But hey, Simon, here's where the impact of what, you know, understand, and that makes a lot of sense. I appreciate you sharing, but... We also need to find a way to get around this for next time because here was the impact. And so It's both a... It both means we say good morning and we care about each other at like a very human level, but it also means that we know that we can use that in driving each other to be the people that we signed up to be and that are our kids want us to be and that we frankly have promised our parents that we will be.\n\nOnsite 090826, debrief-quoted: \"We build the relationship by having the hard conversation, and that's the way in which people really know where they stand.\" · \"There's nothing nice and friendly about me thinking one thing behind your back and not saying it to you.\" · \"Hey, we talked about the calendar going out last week. I didn't get it. What can you tell me about that?\""}, {"t": "Bench 5. A system you inherited that wasn't working. How did you fix the root cause?", "x": "Bench 5. A system you inherited that wasn't working. How did you fix the root cause?\n\nA system you inherited that wasn't working. This is the Collegiate story from the School in the Square round, and it's really a principal-development story.\n\nIn your words.\n\nI was brought down to, as a consultant, I was brought down to Collegiate Academies. You know, spoiler alert, I went and worked there full time for Five years after this consulting arrangement. So this is a story of like most of my work as a consultant and then later as chief culture officer. But I was brought down as a last ditch effort to assess whether or not the principal could be successful. They'd tried everything and things just weren't working.\n\nAnd what we saw was was that teachers were not being in any way like human or real or authentic and really being quite rude, frankly, to students. And I think they were very frustrated and the students were returning in kind. And so, We inherited this like ineffective demerit system with a bunch of mindsets from teachers that they were showing this negative controller mindset. The way we went about fixing that was one, I went around with people individually and use guiding questions to get them to analyze the effectiveness of teacher interactions. and really put themselves in the shoes of the student who's being talked to. That way and asking them questions about like how will they respond, how did that come off. And I got them to see that like student behavior was very much a function of adult behavior. So we saw the problem, we agreed on the problem. That's the first step for me, then it changed management process. After we get a working hypothesis, we need to make sure that a dedicated group of people see the problem. Once people saw the problem, we then needed to direct them into a very concrete way to make change, right? Let's say I go to the doctor, I get told I need to get my heart health in order, so I'm woken up. Okay, great, but what do I do? Is it walking 10,000 steps a day? Is it lifting weights? So here's what we needed to do is because we can't just say like, be more human, What we did is we established three different techniques that teachers were going to do. The most, the one that's the stickiest was Connect and correct, which was the first thing you say to a student just simply cannot be a correction. It has to be a connection.\n\nWe built on the momentum. People saw the small wins. And then we were able to generate a positive flywheel. We took videos of people doing the better version. We shared it around. We got the conversation going. We were walking around with the principal. He would take a 30 second video, email it to everybody and say, comment one word. what this video makes you think."}, {"t": "Bench 6. A time with a big goal, total ambiguity and full autonomy.", "x": "Bench 6. A time with a big goal, total ambiguity and full autonomy.\n\nA big goal, total ambiguity, full autonomy. The four-day COVID playbook. Leave out the student and staff counts.\n\nIn your words.\n\nI effectively did a version of My strong start spring readiness planning, I condensed it to about four days. And so it was day one, gather all the information. A lot of this is coming in piecemeal from different sources, but also from the people and really understanding, because so much of this was an emotional issue as much as it was a scientific issue, as much as it was a logistical issue.\n\nDay two began the work of Getting as many answers as possible on paper so that on day three I could bring this to the leadership team and say this is our new playbook. We're opening a fully remote school. We're staying open brick and mortar for every student who wants to come in ...\n\nAnd recognizing that You both have to have the answer on paper. But having the answer only on paper is next to worthless if it doesn't actually get to the people. And nothing that gets to the people is going to matter if The fundamental premise is this is being done to us or like they don't get it or they haven't heard me or I haven't had a chance to make my voice heard."}, {"t": "Bench 7. Compensation expectations? (never raise first)", "x": "Bench 7. Compensation expectations? (never raise first)\n\nNever raise it first. If they ask, this is your DREAM answer, with the cash-in line cut. Top of the band. Set your number before three.\n\nIn your words.\n\nYes. I think the top of that range is... Would work. Yeah. And I understand what you're saying and I appreciate you saying it clearly. But yeah, I want to join the team. Yeah.... I'm very happy to be part of the right team. That's where I've been the happiest in my life."}, {"t": "Bench 8. In person every day in the Bronx. Does that work? (never raise first)", "x": "Bench 8. In person every day in the Bronx. Does that work? (never raise first)\n\nIn person every day in the Bronx. Never raise it first. The part about your kids is cut.\n\nIn your words.\n\nI've considered it. It's... Short answer is no. I wanna find the right group of people doing the right work more than anything. It's certainly not not a factor.... So, but at the same time, I do know what this work takes and yeah, I'm going in eyes wide open. I certainly, it's not that I've done this commute, you know, Six months straight and it's the middle of winter. I'm sure that will not always be the most joyful experience. But no, I've been up in that area and I've done the commute."}, {"t": "Bench 9. When could you start?", "x": "Bench 9. When could you start?\n\nStart date. Flexible.\n\nIn your words.\n\nThe work that I'm doing now Now... is flexible enough in scope, especially if there's some consideration for sun setting and passing off some of these projects Thoughtfully, but it's a good time for me and that my flexible life schedule does Allow for that.\n\nI am happy. I'm happy to be patient, but I'm also would be eager to move as quickly as you all are ready to."}, {"t": "Bench 10. What are you doing right now? The AI work.", "x": "Bench 10. What are you doing right now? The AI work.\n\nWhat you're doing now. One sentence per tool, then stop. Never pitch the practice to Kruti.\n\nIn your words.\n\nRight now what I'm doing, which is something I think is really cool, is I am... Talking to the principals I know, finding where They need help with efficiency and effectiveness, what their problems are and figuring out how I can build them custom tools, workflows, apps, solutions, using AI to build the specific solutions that they need and building a suite of tools. which has been really fun and a new challenge for me. And that's been taking off and it's been super fun. So that's what I'm doing right now. It's flexible.\n\nThey point me at a problem, and I build the thing that saves them the time so they can focus on the real work. We've built a suite of around a dozen workflows, tools, automations and agents. We customize them, install them and train folks on them, and we also audit, find a school's specific pain points, and build specific solutions.\n\nThe organizations that embrace this new tech, and learn what their own stance and approach to it is, are going to serve students better. The ones that bury their head in the sand are going to get left behind.\n\nSorry, short answer, yes to AI. The longer version of what I'm trying to say is I would imagine in... Any role that I would take in the network I would both bring a AI efficiencies to my work and my natural tendencies are to share those and spread those. So those are things I've done both for this business that I launched as well as I lead a group of... practitioners in a monthly working group that has folks from different charter networks and some of the big tech companies."}, {"t": "Bench 11. How do you lead change?", "x": "Bench 11. How do you lead change?\n\nHow you lead change, if the question is about approach and not a story.\n\nIn your words.\n\nThe work I've done is developing systems, learning change management, and now applying tech. DeansList, the push-button academic health system at KIPP, and the custom workflows I'm building now.\n\nI've seen it at every level. Directly at Excel as a school leader, as a consultant, at Collegiate and Brooklyn Lab at the network level, and nationally at KIPP. And I've made lots of mistakes at every one of them. The approach is the same every time. The first part is the most important part: figure out the one thing we're going after to know if we're on track. Then the systems, structures, mindsets and tools to go after it. It's the Heath brothers' Switch. Direct the rider, motivate the elephant, shape the path. The one thing is really the double-click on shaping the path. It's a narrow focus, intense but not blind, and willing to pivot. We work on a few things, not a hundred different things. And we don't confuse action and effort with outcomes or real progress.\n\nI think the person you want in this role has credibility and an understanding of the day-to-day work. Knows how to write a system on paper. Knows that paper is worthless until the people are behind it. And knows this work is evolving, and there's a whole new set of opportunities and risks coming.\n\nAnd in every situation like this, it's building the plane as you're flying it. I don't have all the answers, and the best idea wins. It's a team of rivals, super smart people with strong opinions, loosely held. A clear vision, clear proposals, and a willingness to be wrong, to disagree and commit."}, {"t": "Bench 12. Your biggest area for growth?", "x": "Bench 12. Your biggest area for growth?\n\nYour growth area. One, owned, with the fix.\n\nIn your words.\n\nIf I'm being really honest, it's narrowing focus. I know it takes movement on multiple fronts, operations, culture, academics, talent, teacher training. Because I know it's all one package deal, I can overcomplicate it and spread us too thin, and not have a few narrow, viable targets that we stack.\n\nWhat I work on is being willing to build slow so we can go fast. Operating in phases. Being okay with some things being not yet.\n\nNext time I'm directly operating, the school will run off a vision that's explicit about what the first down is, what the plays are, what the offensive line has to do, what the quarterback has to do, what every position has to do. Any player can run for a touchdown, but the strategy is first downs, and it takes a tremendous amount of coordination and cooperation."}, {"t": "Bench 13. Why go back inside a network after consulting?", "x": "Bench 13. Why go back inside a network after consulting?\n\nWhy go back inside a network after consulting. The unspoken question is, will he stay.\n\nIn your words.\n\nI went from operator to consultant because so many schools were trying to do things the Excel way and not doing it well. It felt right, from a moral perspective, to help people on the ground actually do the things we were doing, rather than give them a one-day or two-day visit and a set of manuals.\n\nConsulting is great. When it works well, it's wonderful, it feels transformative, and you feel like a special guest star on an all-star team. But it doesn't feel like you're in it the same way. It doesn't have that startup energy, move fast and break things. There's a certain distance. I've been lucky to be deep enough in a lot of places to feel some of that, but it isn't the same.\n\nAnd if you're a consultant for too long, you start believing only your own ways. You lose sight of the innovations, you get set in your program, and you lose a degree of credibility. There's no substitute for what it takes to run a school. I don't think you can be a great consultant without operating in between.\n\nA school can't break a promise to kids. A school leader can't break a promise to teachers. I can't break a promise to principals."}, {"t": "Bench 14. A time your approach with a principal did not work.", "x": "Bench 14. A time your approach with a principal did not work.\n\nA time your approach with a principal didn't work. The principal stays unnamed.\n\nIn your words.\n\nYour words, 082626: \"focused on building the systems and the structure of the documents and did not insist on the leader's buy-in, or even their time and their sign-off.\" \"that school fell as a result of it.\" \"a real, genuine failure that had real, measurable impact. Yes, I cleaned it up, but it was a failure.\""}, {"t": "The traps. These are literal strings. If you hear one starting, the sentence after it does", "x": "The traps. These are literal strings. If you hear one starting, the sentence after it doesn't get said.\n\nNever the health reason for leaving Excel. Never a grade for KIPP or Achievement First. Never the rest of the mess, or any Success comparison, because Paola spent years at Success. Never, I don't care really, if you as a first-year principal. Never a bare principal. It was interim, half a year, while superintendent. Never that the numbers at Brooklyn Lab were false. Never managed forty-eight principals. Never that the tool was used by all twenty-eight. It was piloted and handed off. Never suspensions down seventy-five percent at Carver. That's network-wide. Never five-year renewals, never SUNY, never new charter operator. Never the principal manager title unless they say it first. Never the kids, the commute, or pay, first.\n\nAnd the self-disqualifying strings. I'm not trying to. I don't mean to. There's a lot I'd have to learn. I need to catch up. That's not where I'm at. I'm probably more of a. I'm not an expert in. I don't want to overstate. This is not a question I prepared for. Happy to go deeper. Long story short. I'll get to your exact question, but first. I'll just pause right there. And never a little bit, or kind of, on a credential. If you hear yourself say a vague word about your own results, the next word out of your mouth is a number.\n\nThat's the tape. You've already done the hard part. Dan brought you into his hardest problem and said, I love that idea. Go be the person who did the work."}]}, part='p1', i=0, playing=false, voice=null;
